<body class="bg-[#1c1917] text-stone-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, memo } = React;

    const DEFAULT_GEMINI_KEY = "";
    const DEFAULT_FIREBASE_URL = "";
    const TAB_ORDER = ['decide', 'pantry', 'home', 'recipes', 'shopping'];

    const Icon = memo(({ name, size = 18, className = "" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
          window.lucide.createIcons({
            root: spanRef.current,
            attrs: { width: size, height: size, class: `inline-block ${className}` }
          });
        }
      }, [name, size, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    });

    const getFutureDateStr = (daysToAdd) => {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + Number(daysToAdd));
      return d.toISOString().split('T')[0];
    };

    const getDaysUntilExpiry = (item) => {
      if (!item) return undefined;
      if (item.expiryDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(item.expiryDate + 'T00:00:00');
        return Math.round((target - today) / (1000 * 60 * 60 * 24));
      }
      if (item.expiryDays !== undefined && item.expiryDays !== null && item.expiryDays !== '') {
        return Number(item.expiryDays);
      }
      return undefined;
    };

    const formatExpiryBadge = (days, expiryDateStr) => {
      if (days === undefined) return null;
      let dateHint = '';
      if (expiryDateStr) {
        const parts = expiryDateStr.split('-');
        if (parts.length === 3) dateHint = ` (${parts[2]}.${parts[1]}.)`;
      }
      if (days < 0) return { text: `Abgelaufen seit ${Math.abs(days)} T.${dateHint}`, urgent: true, expired: true };
      if (days === 0) return { text: `Läuft HEUTE ab!${dateHint}`, urgent: true, expired: false };
      if (days === 1) return { text: `Nur noch 1 Tag (Morgen)${dateHint}`, urgent: true, expired: false };
      if (days === 2) return { text: `Noch 2 Tage${dateHint}`, urgent: true, expired: false };
      return { text: `Noch ${days} Tage${dateHint}`, urgent: false, expired: false };
    };

    const formatContainerLabel = (containerType, count = 1) => {
      const c = containerType || 'Packung';
      const isPlural = Number(count) !== 1;
      const map = {
        'Packung': isPlural ? 'Packungen' : 'Packung',
        'Glas': isPlural ? 'Gläser' : 'Glas',
        'Gläser': isPlural ? 'Gläser' : 'Glas',
        'Dose': isPlural ? 'Dosen' : 'Dose',
        'Dosen': isPlural ? 'Dosen' : 'Dose',
        'Flasche': isPlural ? 'Flaschen' : 'Flasche',
        'Tube': isPlural ? 'Tuben' : 'Tube',
        'Becher': isPlural ? 'Becher' : 'Becher',
        'Stück': isPlural ? 'Stück' : 'Stück',
        'Topf': isPlural ? 'Töpfe' : 'Topf'
      };
      return map[c] || c;
    };

    const calcPacksSummary = (packs) => {
      if (!Array.isArray(packs) || packs.length === 0) return null;
      const totalAmount = packs.reduce((acc, p) => acc + (Number(p.count) || 0) * (Number(p.size) || 0), 0);
      const totalPacks = packs.reduce((acc, p) => acc + (Number(p.count) || 0), 0);
      const unit = packs[0]?.unit || 'g';
      return { totalAmount, totalPacks, unit };
    };

    // Packungs-Baukasten sauber herunterrechnen (z.B. 2x 500g - 400g -> 1x 500g + 1x 100g)
    const deductFromPacks = (packs, deductionAmount, defaultUnit = 'g') => {
      if (!Array.isArray(packs) || packs.length === 0) return [];
      const unit = packs[0]?.unit || defaultUnit;
      let flat = [];
      packs.forEach(p => {
        const c = Math.max(0, Number(p.count) || 0);
        const s = Math.max(0, Number(p.size) || 0);
        if (s > 0 && c > 0) {
          for (let i = 0; i < c; i++) flat.push(s);
        }
      });
      // Kleinste / bereits angebrochene Packungen zuerst verbrauchen
      flat.sort((a, b) => a - b);
      let rem = Math.max(0, Number(deductionAmount) || 0);
      for (let i = 0; i < flat.length && rem > 0; i++) {
        if (flat[i] <= rem) {
          rem -= flat[i];
          flat[i] = 0;
        } else {
          flat[i] -= rem;
          rem = 0;
        }
      }
      const remaining = flat.filter(s => s > 0);
      if (remaining.length === 0) return [];
      const groupedMap = new Map();
      remaining.forEach(s => {
        groupedMap.set(s, (groupedMap.get(s) || 0) + 1);
      });
      const result = [];
      groupedMap.forEach((count, size) => {
        result.push({ size, unit, count });
      });
      result.sort((a, b) => b.size - a.size);
      return result;
    };

    const parseRequiredAmount = (amountStr) => {
      if (!amountStr) return null;
      const str = String(amountStr).toLowerCase().replace(',', '.');
      const matchKg = str.match(/(\d+(?:\.\d+)?)\s*kg\b/);
      if (matchKg) return { val: Math.round(parseFloat(matchKg[1]) * 1000), unit: 'g' };
      const matchG = str.match(/(\d+(?:\.\d+)?)\s*(?:g|gramm)\b/);
      if (matchG) return { val: Math.round(parseFloat(matchG[1])), unit: 'g' };
      const matchL = str.match(/(\d+(?:\.\d+)?)\s*(?:l|liter)\b/);
      if (matchL) return { val: Math.round(parseFloat(matchL[1]) * 1000), unit: 'ml' };
      const matchMl = str.match(/(\d+(?:\.\d+)?)\s*ml\b/);
      if (matchMl) return { val: Math.round(parseFloat(matchMl[1])), unit: 'ml' };
      return null;
    };

    // Erkennt sowohl g/ml als auch Stück/Flaschen/Gläser/Dosen für die Abbuchungs-Vorschau beim Kochen
    const parseCookDeductionInfo = (amountStr) => {
      if (!amountStr) return null;
      const req = parseRequiredAmount(amountStr);
      if (req) return req;
      const str = String(amountStr).trim().replace(',', '.');
      if (/\b(el|tl|esslöffel|teelöffel|prise|prisen|etwas|nach\s+wunsch|nach\s+bedarf|nach\s+geschmack|schuss|spritzer|zweig|zweige|blatt|blätter|zehe|zehen|messerspitze)\b/i.test(str)) {
        return null;
      }
      const matchContainer = str.match(/^(\d+(?:\.\d+)?)\s*(stück|stk\.?|packung|packungen|pkg\.?|flasche|flaschen|glas|gläser|dose|dosen|tube|tuben|becher|topf|töpfe)?\b/i);
      if (matchContainer) {
        return {
          val: parseFloat(matchContainer[1]),
          unit: matchContainer[2] ? matchContainer[2] : 'Stück',
          isCount: true
        };
      }
      return null;
    };

    const normalizeGermanFoodWord = (word) => {
      let w = (word || '').toLowerCase().trim();
      if (!w) return '';

      const synonymMap = {
        'eier': 'ei',
        'eiern': 'ei',
        'eigelb': 'ei',
        'möhren': 'karotte',
        'möhre': 'karotte',
        'karotten': 'karotte',
        'mohrrüben': 'karotte',
        'frühlingszwiebeln': 'frühlingszwiebel',
        'lauchzwiebeln': 'frühlingszwiebel',
        'lauchzwiebel': 'frühlingszwiebel',
        'schlagsahne': 'sahne',
        'süßrahm': 'sahne',
        'stangensellerie': 'staudensellerie',
        'knoblauchzehen': 'knoblauch',
        'knoblauchzehe': 'knoblauch',
        'parmigiano': 'parmesan',
        'pecorino': 'pecorino',
        'meersalz': 'salz',
        'speisesalz': 'salz',
        'jodsalz': 'salz',
        'steinsalz': 'salz',
        'pfefferkörner': 'pfeffer',
        'pfefferkorn': 'pfeffer',
        'kapernäpfel': 'kaper',
        'kapern': 'kaper',
        'cherrytomaten': 'kirschtomate',
        'cherrytomate': 'kirschtomate',
        'kirschtomaten': 'kirschtomate',
        'datteltomaten': 'kirschtomate',
        'datteltomate': 'kirschtomate',
        'strauchtomaten': 'tomate',
        'rispentomaten': 'tomate',
        'fleischtomaten': 'tomate',
        'cannellinibohnen': 'cannellini bohne',
        'kidneybohnen': 'kidney bohne'
      };
      if (synonymMap[w]) return synonymMap[w];

      if (w.length > 5 && (w.endsWith('zwiebeln') || w.endsWith('kartoffeln') || w.endsWith('nudeln') || w.endsWith('tomaten') || w.endsWith('zitronen') || w.endsWith('limetten') || w.endsWith('nelken') || w.endsWith('beeren') || w.endsWith('bohnen') || w.endsWith('linsen') || w.endsWith('erbsen') || w.endsWith('gurken') || w.endsWith('schalotten') || w.endsWith('oliven') || w.endsWith('kapern'))) {
        return w.slice(0, -1);
      }
      if (w.length > 5 && w.endsWith('äpfel')) {
        return w.replace('äpfel', 'apfel');
      }
      return w;
    };

    const isIngredientMatchingPantry = (pantryName, ingName, pantryItemObj = null) => {
      const pRaw = (pantryName || '').trim().toLowerCase();
      const iRaw = (ingName || '').trim().toLowerCase();
      if (!pRaw || !iRaw) return false;
      if (pRaw === iRaw) return true;

      const ingExplicitlyFresh = /\b(frisch|frische|frischer|frisches|reif|reife|reifer|rispen|strauch)\b/i.test(iRaw);
      const isCherryOrFreshTomato = /\b(kirschtomaten|kirschtomate|cherrytomaten|cherrytomate|datteltomaten|rispentomaten|strauchtomaten|fleischtomaten)\b/i.test(iRaw);
      if ((ingExplicitlyFresh || isCherryOrFreshTomato) && /tomat/i.test(iRaw)) {
        if (/\b(dose|dosen|konserve|getrocknet|passiert|polpa|passata|geschält|gestückelt|stückig)\b/i.test(pRaw)) {
          return false;
        }
        if (pantryItemObj && (pantryItemObj.containerType === 'Dose' || pantryItemObj.unitType === 'Dose' || pantryItemObj.unitType === 'Dosen')) {
          return false;
        }
      }

      const cleanNeutralWords = (str) => str
        .replace(/\b\d+\s*(?:monate|monat|jahre|jahr|wochen|tage|%)\b/gi, ' ')
        .replace(/\b(frisch|frische|frischer|frisches|bio|tk|tiefgekühlt|tiefgekühlte|fein|feiner|feines|grob|grober|grobes|gemahlen|gemahlener|gemahlenes|geschrotet|geschroteter|ganz|ganze|ganzer|ganzes|am stück|stück|extra|vergine|nativ|natives|glatte|glatter|krause|gerieben|geriebener|geriebenes|gehobelt|gehobelter|kalt|kalte|kalter|warm|warme|lauwarm|lauwarme|zimmerwarm|zimmerwarme|mittelscharf|mittelscharfer|scharf|scharfer|scharfe|milder|mild|milde|süß|süßer|süße|edelsüß|edelsüßer|rosenscharf|schwarz|schwarzer|schwarze|schwarzes|weiß|weißer|weiße|weißes|rote|roter|rotes|rot|grün|grüner|grüne|grünes|gelb|gelber|gelbe|gelbes|braun|brauner|braune|braunes|bunt|bunter|bunte|hell|heller|helle|dunkel|dunkler|dunkle|klein|kleine|kleiner|kleines|groß|große|großer|großes|mittelgroß|mittelgroße|dicke|dünne|junge|junger|jung|alt|alte|alter|altes|mittelalt|mittelalter|gereift|gereifter|gereiftes|monate|monat|jahre|dop|igp|reggiano|padano|grana|romano|gehackt|gehackte|gehackter|gewürfelt|gewürfelte|geschnitten|geschnittene|ungeschält|ungeschälte|abgetropft|abgetropfte|gekocht|gekochte|roh|rohe|roher|reif|reife|reifer|weich|weiche|festkochend|festkochende|mehligkochend|mehligkochende|entsteint|entsteinte|ohne stein|ohne kerne|etwas|prise|nach geschmack|nach bedarf|zum braten|zum kochen|zum ablöschen|zum reiben|aus der mühle)\b/gi, ' ')
        .replace(/\b\d+\b/g, ' ')
        .replace(/[()]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const pClean = cleanNeutralWords(pRaw);
      const iClean = cleanNeutralWords(iRaw);
      if (!pClean || !iClean) return false;
      if (pClean === iClean) return true;

      const compoundSauceOrSpiceRegex = /\b(sugo|pesto|sauce|soße|pastasauce|tomatensauce|nudelsoße|suppe|fond|brühe|bouillon|creme|aufstrich|gewürz|pommesgewürz|gewürzmischung|gewürzsalz|kräutersalz|knoblauchsalz|rauchsalz|selleriesalz|zwiebelsalz|curry|paste|mark|tomatenmark|ketchup|senf|mayo|mayonnaise|apfelmus)\b/i;
      if (compoundSauceOrSpiceRegex.test(pClean) !== compoundSauceOrSpiceRegex.test(iClean)) {
        return false;
      }

      const forbiddenMismatchPairs = [
        /\b(getrocknet|getrocknete|getrockneter|getrocknetes|sonnengetrocknet|sonnengetrocknete|eingelegt|eingelegte|eingelegter|in öl)\b/i,
        /\b(passiert|passierte|passierter|passata)\b/i,
        /\b(dosentomaten|dosentomate|polpa|geschält|geschälte|gestückelt|gestückelte|stückig|stückige|dose|dosen)\b/i,
        /\b(kokosmilch|kondensmilch|hafermilch|mandelmilch|sojamilch|buttermilch)\b/i,
        /\b(kräuterbutter|knoblauchbutter|erdnussbutter|mandelbutter|kakaobutter)\b/i,
        /\b(puderzucker|vanillezucker|gelierzucker|rohrzucker|kokosblütenzucker)\b/i,
        /\b(cayennepfeffer|zitronenpfeffer|knoblauchpfeffer|pfefferminze|pfefferbeißer)\b/i,
        /\b(knoblauchöl|trüffelöl|chiliöl|sesamöl|erdnussöl|kokosöl)\b/i,
        /\b(reisessig|apfelessig|himbeeressig)\b/i,
        /\b(schinkenwürfel|speckwürfel)\b/i
      ];
      for (const specialRegex of forbiddenMismatchPairs) {
        if (specialRegex.test(pClean) !== specialRegex.test(iClean)) {
          return false;
        }
      }

      const stripModifiers = (str) => str.split(/\s+(?:con|mit|alla|all'|al|ai|in|auf|nach|aus|vom)\s+/i)[0].trim();
      const pHead = stripModifiers(pClean);
      const iHead = stripModifiers(iClean);
      if (pHead === iHead) return true;

      if (pHead.includes('&') || pHead.includes('+') || pHead.includes(' und ')) {
        const subItems = pHead.split(/\s*(?:&|\+|und)\s*/i).map(s => s.trim()).filter(Boolean);
        if (subItems.some(sub => isIngredientMatchingPantry(sub, iHead, pantryItemObj))) {
          return true;
        }
      }

      const pWords = pHead.split(/[\s,\-\/]+/).filter(Boolean).map(normalizeGermanFoodWord);
      const iWords = iHead.split(/[\s,\-\/]+/).filter(Boolean).map(normalizeGermanFoodWord);

      if (pWords.join(' ') === iWords.join(' ')) return true;
      if ([...pWords].sort().join(' ') === [...iWords].sort().join(' ')) return true;

      if (pWords.length === 1 && iWords.length === 1) {
        const pw = pWords[0];
        const iw = iWords[0];
        if (pw === iw) return true;

        const allowedGenericBaseWords = ['parmesan', 'pecorino', 'guanciale', 'pancetta', 'hackfleisch', 'gulasch', 'filet', 'brustfilet', 'hähnchenbrust', 'reis', 'nudeln', 'nudel', 'pasta', 'käse', 'reibekäse', 'zwiebel', 'kartoffel', 'öl', 'speiseöl', 'essig', 'senf', 'bohne', 'pfeffer', 'salz', 'kaper', 'kapern', 'zitrone', 'sahne', 'butter', 'milch', 'mehl', 'zucker'];
        if (allowedGenericBaseWords.includes(iw) && (pw.endsWith(iw) || pw.startsWith(iw))) return true;
        if (allowedGenericBaseWords.includes(pw) && (iw.endsWith(pw) || iw.startsWith(pw))) return true;
      }

      return false;
    };

    const detectItemGroup = (nameStr, existingGroup = undefined) => {
      const lower = (nameStr || '').toLowerCase();
      if (/sugo|pesto|sauce|soße/i.test(lower)) return existingGroup;
      if (/tagliatelle|rigatoni|spaghetti|penne|pasta|nudeln|fusilli|farfalle|makkaroni|linguine|fettuccine|orecchiette|lasagne/i.test(lower)) {
        return 'Pasta';
      }
      if (/fond|brühe|bouillon/i.test(lower)) {
        return 'Fond';
      }
      if (/reis|risotto|basmati|jasminreis/i.test(lower)) {
        return 'Reis';
      }
      return existingGroup;
    };

    const enforceSmartCategory = (productName, suggestedCategory) => {
      const lower = (productName || '').toLowerCase();
      if (suggestedCategory === 'sauces' && /sugo|amatriciana|pesto|fond|brühe|bouillon|tomatensauce|tomatensoße|passata|polpa|arrabbiata|bolognese|nudelsoße|pastasauce|kokosmilch|ketchup|senf|mayo|apfelmus|konserve|mais|bohnen|linsen|kichererbsen|nudeln|pasta|penne|spaghetti|rigatoni|tagliatelle|fusilli|farfalle|reis|mehl|zucker/i.test(lower)) {
        return 'pantry';
      }
      return suggestedCategory || 'pantry';
    };

    const SEED_DATA = {
      pantry: [
        { id: 'p1', name: 'Rinderhackfleisch', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(1), amount: 500, unitType: 'g', lowThreshold: 200 },
        { id: 'p2', name: 'Zitronen', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(9), amount: 3, unitType: 'Stück', lowThreshold: 1 },
        { id: 'p3', name: 'Parmesan', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(20), amount: 200, unitType: 'g', lowThreshold: 50 },
        { id: 'p4', name: 'Butter', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(14), amount: 250, unitType: 'g', lowThreshold: 50 },
        { id: 'p5', name: 'Rosmarin & Thymian', category: 'fridge', status: 'low', expiryDate: getFutureDateStr(3), amount: 1, unitType: 'Topf', lowThreshold: 1 },
        { id: 'p6a', name: 'Tagliatelle', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 500, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 1 }], lowThreshold: 200 },
        { id: 'p6b', name: 'Rigatoni', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 500, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 1 }], lowThreshold: 200 },
        { id: 'p6c', name: 'Spaghetti', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 1000, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 2 }], lowThreshold: 300 },
        { id: 'p6d', name: 'Penne', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 3000, unitType: 'g', containerType: 'Packung', packs: [{ size: 1000, unit: 'g', count: 2 }, { size: 500, unit: 'g', count: 2 }], lowThreshold: 200 },
        { id: 'p7', name: 'Dosentomaten', category: 'pantry', status: 'in_stock', amount: 1600, unitType: 'g', containerType: 'Dose', packs: [{ size: 400, unit: 'g', count: 4 }], lowThreshold: 400 },
        { id: 'p7b', name: 'Passata', category: 'pantry', status: 'in_stock', amount: 700, unitType: 'g', containerType: 'Flasche', packs: [{ size: 700, unit: 'g', count: 1 }], lowThreshold: 350 },
        { id: 'p8', name: 'Basmatireis', category: 'pantry', status: 'in_stock', group: 'Reis', amount: 800, unitType: 'g', lowThreshold: 250 },
        { id: 'p9', name: 'Zwiebeln & Knoblauch', category: 'pantry', status: 'in_stock', amount: 6, unitType: 'Stück', lowThreshold: 2 },
        { id: 'p10', name: 'Apfelmus', category: 'pantry', status: 'in_stock', amount: 2, unitType: 'Glas', lowThreshold: 1 },

    const compressImageToBase64 = (file, maxWidth = 1024, quality = 0.75) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const blobToBase64 = (blob) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const dataUrl = reader.result || '';
        const base64 = String(dataUrl).split(',')[1] || '';
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });

    let cachedWorkingModel = null;

    async function callGeminiWithAutoModel(apiKey, promptText, base64Media = null, mediaMimeType = 'image/jpeg') {
      const cleanKey = (apiKey || '').trim();
      if (!cleanKey) {
        throw new Error('Kein Gemini API-Key hinterlegt. Bitte Einladungs-Link nutzen oder im Zahnrad-Menü eintragen.');
      }

      let candidateModels = [];
      if (cachedWorkingModel) candidateModels.push(cachedWorkingModel);

      try {
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
        const listData = await listRes.json();
        if (listRes.ok && listData && Array.isArray(listData.models)) {
          const validModels = listData.models
            .filter(m =>
              m.supportedGenerationMethods &&
              m.supportedGenerationMethods.includes('generateContent') &&
              !m.name.includes('embedding') &&
              !m.name.includes('aqa') &&
              !m.name.includes('imagen') &&
              !m.name.includes('veo') &&
              !m.name.includes('tts') &&
              !m.name.includes('audio')
            )
            .map(m => m.name.replace(/^models\//, ''));

          validModels.sort((a, b) => {
            const aFlash = a.includes('flash') ? 1 : 0;
            const bFlash = b.includes('flash') ? 1 : 0;
            if (aFlash !== bFlash) return bFlash - aFlash;
            return b.localeCompare(a, undefined, { numeric: true });
          });

          for (const vm of validModels) {
            if (!candidateModels.includes(vm)) candidateModels.push(vm);
          }
        }
      } catch (err) {}

      const fallbacks = ['gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-2.0-flash'];
      for (const fb of fallbacks) {
        if (!candidateModels.includes(fb)) candidateModels.push(fb);
      }

      const parts = [{ text: promptText }];
      if (base64Media) {
        parts.push({ inlineData: { mimeType: mediaMimeType, data: base64Media } });
      }

      let lastErrorMsg = 'Kein passendes Gemini-Modell gefunden.';
      for (const modelName of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            cachedWorkingModel = modelName;
            return { text: data.candidates[0].content.parts[0].text, usedModel: modelName };
          } else {
            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (netErr) {
          lastErrorMsg = netErr.message;
        }
      }
      throw new Error(lastErrorMsg);
    }

      const wakeLockWantedRef = useRef(false);

      // Sprachausgabe (Text-to-Speech)
      const [isSpeaking, setIsSpeaking] = useState(false);

      const [toastMsg, setToastMsg] = useState(null);
      const toastTimerRef = useRef(null);
      const showToast = (msg, durationMs = 4500) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToastMsg(msg);
        toastTimerRef.current = setTimeout(() => setToastMsg(null), durationMs);
      };

      const stopSpeaking = () => {
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        setIsSpeaking(false);
      };

      const speakAnswerText = (text) => {
        if (!text || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const cleanSpeech = String(text)
            .replace(/[*#_`~]/g, '')
            .replace(/\bkcal\/100g\b/gi, 'Kilokalorien pro 100 Gramm')
            .replace(/\b(\d+)\s*g\b/g, '$1 Gramm')
            .replace(/\b(\d+)\s*ml\b/g, '$1 Milliliter')
            .replace(/\bEL\b/g, 'Esslöffel')
            .replace(/\bTL\b/g, 'Teelöffel')
            .replace(/\bMHD\b/g, 'Haltbarkeitsdatum')
            .replace(/\bTK\b/g, 'Tiefkühler');
          const utterance = new SpeechSynthesisUtterance(cleanSpeech);
          utterance.lang = 'de-DE';
          utterance.rate = 1.0;
          utterance.onstart = () => setIsSpeaking(true);
          utterance.onend = () => setIsSpeaking(false);
          utterance.onerror = () => setIsSpeaking(false);
          setIsSpeaking(true);
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          setIsSpeaking(false);
        }
      };

      const requestScreenWakeLock = async (silent = false) => {
        if (!('wakeLock' in navigator)) {
          if (!silent) showToast('Dein Browser unterstützt den Display-Wachhalter leider nicht.');
          return;
        }
        try {
          const sentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinelRef.current = sentinel;
          wakeLockWantedRef.current = true;
          setIsWakeLockActive(true);
          sentinel.addEventListener('release', () => {
            if (!wakeLockWantedRef.current) setIsWakeLockActive(false);
          });
          if (!silent) showToast('☀️ Koch-Modus aktiv: Display bleibt jetzt an!');
        } catch (err) {
          setIsWakeLockActive(false);
          if (!silent) showToast('Display-Wachhalter konnte nicht aktiviert werden.');
        }
      };

      const releaseScreenWakeLock = async (silent = false) => {
        wakeLockWantedRef.current = false;
        if (wakeLockSentinelRef.current) {
          try { await wakeLockSentinelRef.current.release(); } catch (e) {}
          wakeLockSentinelRef.current = null;
        }
        setIsWakeLockActive(false);
        if (!silent) showToast('Display-Wachhalter ausgeschaltet.');
      };

      const toggleWakeLock = () => {
        if (isWakeLockActive) releaseScreenWakeLock(false);
        else requestScreenWakeLock(false);
      };

      useEffect(() => {
        const handleVis = () => {
          if (document.visibilityState === 'visible' && wakeLockWantedRef.current) {
            requestScreenWakeLock(true);
          }
        };
        document.addEventListener('visibilitychange', handleVis);
        return () => document.removeEventListener('visibilitychange', handleVis);
      }, []);

      useEffect(() => {
        if (window.location.search.includes('db=') || window.location.search.includes('gemini=')) {

      const pushToCloud = async (stateObj) => {
        const cleanUrl = (firebaseUrl || '').trim().replace(/\/$/, '');
        if (!cleanUrl || isApplyingRemote.current) return;
        try {
          isPushingRef.current = true;
          setSyncStatus('syncing');
          const now = Date.now();
          lastSyncTimestamp.current = now;
          const currentShop = stateObj.shoppingList || [];
          const currentShopJson = JSON.stringify(currentShop.map(s => s.name));

          const requests = [
            fetch(`${cleanUrl}/kueche_shared.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                isInitialized: true,
                pantry: stateObj.pantry || [],
                mealPrep: stateObj.mealPrep || [],
                recipes: stateObj.recipes || [],
                shoppingList: currentShop,
                mealPlan: stateObj.mealPlan || [],
                updatedAt: now
              })
            })
          ];

          if (currentShopJson !== lastSyncedShoppingJsonRef.current) {
            lastSyncedShoppingJsonRef.current = currentShopJson;
            requests.push(
              fetch(`${cleanUrl}/bring_export.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(buildBringParserPayload(currentShop))
              })
            );
          }

          await Promise.all(requests);
          setSyncStatus('synced');
        } catch (err) {
          setSyncStatus('error');
        } finally {
          isPushingRef.current = false;
        }
      };

      const pullFromCloud = async () => {
        const cleanUrl = (firebaseUrl || '').trim().replace(/\/$/, '');
        if (!cleanUrl) {
          setSyncStatus('local');
          return;
        }
        if (isPushingRef.current || pushDebounceTimerRef.current || document.hidden) return;

        try {
          const res = await fetch(`${cleanUrl}/kueche_shared.json`);
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.updatedAt && data.updatedAt > lastSyncTimestamp.current) {
            isApplyingRemote.current = true;
            lastSyncTimestamp.current = data.updatedAt;
            setPantry(data.pantry || []);
            setMealPrep(data.mealPrep || []);
            setRecipes(data.recipes || []);
            setShoppingList(data.shoppingList || []);
            setMealPlan(data.mealPlan || []);
            setTimeout(() => { isApplyingRemote.current = false; }, 250);
          }
          setSyncStatus('synced');
        } catch (e) {
          setSyncStatus('error');

                const packIdx = nextPacks.findIndex(pk => Number(pk.size) === Number(targetSize) && pk.unit === targetUnit);
                if (packIdx !== -1) {
                  nextPacks[packIdx].count = (Number(nextPacks[packIdx].count) || 0) + addCount;
                } else {
                  nextPacks.push({ size: targetSize, unit: targetUnit, count: addCount });
                }
                nextPacks.sort((a, b) => Number(b.size) - Number(a.size));

                const sum = calcPacksSummary(nextPacks);
                return {
                  ...item,
                  packs: nextPacks,
                  containerType: isContainerUnit ? normContainer : (item.containerType || 'Packung'),
                  amount: sum.totalAmount,

                  group: detectItemGroup(item.name, item.group),
                  status: 'in_stock',
                  ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
                };

              const currentAmt = item.amount !== undefined ? Number(item.amount) : 0;

                ...item,

                unitType: isContainerUnit ? normContainer : item.unitType,

              ? undefined
              : (initialPacks ? pSize * pCount : Number(amountToAdd));
            const finalUnit = targetCat === 'spices'

      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const missingDetails = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];
        let minExpiryDays = 999;

        const hasEnoughQuantity = (pantryItem, ingAmountStr) => {
          if (!pantryItem || pantryItem.status === 'empty') return false;
          if (pantryItem.category === 'spices') return true;
          const availAmt = pantryItem.amount !== undefined ? Number(pantryItem.amount) : 0;
          if (availAmt <= 0) return false;

          const req = parseRequiredAmount(ingAmountStr);
          if (req && (pantryItem.unitType === 'g' || pantryItem.unitType === 'ml') && req.unit === pantryItem.unitType) {
            return availAmt >= req.val;
          }
          return true;
        };

        (recipe.ingredients || []).forEach((ing) => {
          const cleanIngName = (ing.name || '').trim();
          if (!cleanIngName) return;

          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? ((mp.blocks500 || 0) * 500 + (mp.blocks250 || 0) * 250) : 0;
            const req = parseRequiredAmount(ing.amount);
            const neededGrams = req && req.unit === 'g' ? req.val : 250;
            if (totalGrams < neededGrams) {
              missing.push(cleanIngName);
              missingDetails.push({ name: cleanIngName, reason: `Für Wochenplan: ${recipe.title}` });
            }
            return;
          }

          const ingGroup = detectItemGroup(cleanIngName);
          const isPastaIng = Boolean(ing.isPasta || ingGroup === 'Pasta');
          const isFondIng = Boolean(ing.isFond || ingGroup === 'Fond');

          if (isPastaIng) {
            const exactPasta = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName, p) && hasEnoughQuantity(p, ing.amount));
            if (exactPasta) return;

            const partialExactPasta = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName, p) && p.status !== 'empty' && Number(p.amount) > 0);
            const anyPasta = pantry.find(p => (p.group === 'Pasta' || detectItemGroup(p.name) === 'Pasta') && hasEnoughQuantity(p, ing.amount));
            if (anyPasta) {
              notes.push(`Joker: ${anyPasta.name} (${anyPasta.amount}${anyPasta.unitType}) im Haus`);
              return;
            }
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              const reasonHint = partialExactPasta
                ? `Für ${recipe.title} (Benötigt: ${ing.amount}, nur ${partialExactPasta.amount}${partialExactPasta.unitType} da)`
                : `Für Wochenplan: ${recipe.title} (${ing.amount || 'Nach Bedarf'})`;
              missingDetails.push({ name: cleanIngName, reason: reasonHint });
            }
            return;
          }

          if (isFondIng) {
            const exactFond = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName, p) && hasEnoughQuantity(p, ing.amount));
            if (exactFond) return;
            const anyFond = pantry.find(p => (p.group === 'Fond' || detectItemGroup(p.name) === 'Fond') && hasEnoughQuantity(p, ing.amount));
            if (anyFond) {
              notes.push(`Joker: ${anyFond.name} statt ${cleanIngName}`);
              return;
            }
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              missingDetails.push({ name: cleanIngName, reason: `Für Wochenplan: ${recipe.title} (${ing.amount || 'Nach Bedarf'})` });
            }
            return;
          }

          const matchingItems = pantry.filter(p => isIngredientMatchingPantry(p.name, cleanIngName, p) && p.status !== 'empty');
          const primaryFound = matchingItems[0];
          const combinedAmount = matchingItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
          const virtualCombinedItem = primaryFound ? { ...primaryFound, amount: combinedAmount } : null;

          if (!virtualCombinedItem || !hasEnoughQuantity(virtualCombinedItem, ing.amount)) {
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              const hasSome = virtualCombinedItem && combinedAmount > 0;
              const reasonHint = hasSome
                ? `Für ${recipe.title} (Benötigt: ${ing.amount}, insgesamt nur ${combinedAmount} ${primaryFound.unitType} da)`
                : `Für Wochenplan: ${recipe.title}${ing.amount ? ` (${ing.amount})` : ''}`;
              missingDetails.push({ name: cleanIngName, reason: reasonHint });
            }
          } else {
            matchingItems.forEach(found => {
              if (found.category === 'freezer_items' && found.subType === 'meat') {
                fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);

                urgentFridgeItems.push({ name: found.name, daysLeft: dLeft });

              options = { mimeType: 'audio/mp4' };
            }

          const recorder = new MediaRecorder(stream, options);

          recorder.ondataavailable = (event) => {

                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Vorrat hinzufügen</h3>
                  <button onClick={() => setShowNewPantryItemModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] text-stone-500 block mb-1">Lagerort</label>
                    <select
                      value={newPantryCategory}
                      onChange={e => {
                        const cat = e.target.value;
                        setNewPantryCategory(cat);
                        if (cat === 'fridge' && !newPantryExpiryDate) setNewPantryExpiryDate(getFutureDateStr(3));
                      }}
                      className="w-full border border-stone-300 rounded-lg px-2.5 py-2 text-xs bg-white"
                    >
                      <option value="pantry">Vorratsschrank</option>
                      <option value="fridge">Kühlschrank</option>
                      <option value="freezer_items">Tiefkühler</option>
                      <option value="sauces">Öle und Soßen</option>
                      <option value="spices">Gewürzschrank (ohne Einheit)</option>
                    </select>
                  </div>

                  <input
                    type="text"
                    placeholder="Bezeichnung ohne Marke (z.B. Penne, Senf...)"
                    value={newPantryName}
                    onChange={e => setNewPantryName(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                  />

                  {newPantryCategory !== 'spices' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[11px] text-stone-500 block mb-1">Anzahl / Menge</label>
                          <input
                            type="number"
                            min="0"
                            value={newPantryAmount}
                            onChange={e => setNewPantryAmount(e.target.value)}
                            className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] text-stone-500 block mb-1">Behälter / Einheit</label>
                          <select
                            value={newPantryUnitType}
                            onChange={e => {
                              const u = e.target.value;
                              setNewPantryUnitType(u);
                              if (u === 'g' || u === 'ml') {
                                setNewPantryAmount(500);
                                setNewPantryPackWeight('');
                              } else {
                                setNewPantryAmount(1);
                              }
                            }}
                            className="w-full border border-stone-300 rounded-lg px-2.5 py-2 text-xs bg-white font-semibold"
                          >
                            <option value="Packung">Packung</option>
                            <option value="Glas">Glas</option>
                            <option value="Dose">Dose</option>
                            <option value="Flasche">Flasche</option>
                            <option value="Tube">Tube</option>
                            <option value="Becher">Becher</option>
                            <option value="Stück">Stück (Einzeln)</option>
                            <option value="g">Gramm (g lose)</option>
                            <option value="ml">Milliliter (ml lose)</option>
                          </select>
                        </div>
                      </div>

                      {['Packung', 'Dose', 'Dosen', 'Flasche', 'Glas', 'Gläser', 'Tube', 'Becher'].includes(newPantryUnitType) && (
                        <div className="bg-stone-50 border border-stone-200 rounded-xl p-3 space-y-2">
                          <div className="flex items-center justify-between">
                            <label className="text-[11px] font-semibold text-stone-800">
                              Inhalt pro {formatContainerLabel(newPantryUnitType, 1)} (Optional für Baukasten):
                            </label>
                            {newPantryPackWeight && (
                              <button
                                type="button"
                                onClick={() => setNewPantryPackWeight('')}
                                className="text-[10px] text-stone-500 underline"
                              >
                                Ohne Gewicht
                              </button>
                            )}
                          </div>
                          <div className="flex gap-1.5">
                            {[180, 250, 400, 500, 1000].map(w => (
                              <button
                                key={w}
                                type="button"
                                onClick={() => { setNewPantryPackWeight(String(w)); setNewPantryPackUnit('g'); }}
                                className={`flex-1 py-1 rounded border text-[10px] font-semibold ${
                                  Number(newPantryPackWeight) === w ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-700 border-stone-300'
                                }`}
                              >
                                {w}g
                              </button>
                            ))}
                          </div>
                          <div className="grid grid-cols-2 gap-2 pt-0.5">
                            <input
                              type="number"
                              placeholder="z.B. 180, 500, 1000"
                              value={newPantryPackWeight}
                              onChange={e => setNewPantryPackWeight(e.target.value)}
                              className="bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold"
                            />
                            <select
                              value={newPantryPackUnit}
                              onChange={e => setNewPantryPackUnit(e.target.value)}
                              className="bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs"
                            >
                              <option value="g">Gramm (g)</option>
                              <option value="ml">Milliliter (ml)</option>
                            </select>
                          </div>
                        </div>
                      )}
                    </>
                  )}

                  <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-3 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-semibold text-amber-950">
                        Haltbar bis / MHD {newPantryCategory !== 'fridge' && '(Optional)'}:
                      </label>
                      {newPantryExpiryDate && (
                        <button
                          type="button"
                          onClick={() => setNewPantryExpiryDate('')}
                          className="text-[10px] text-stone-500 underline"
                        >
                          Kein MHD
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-4 gap-1">
                      {[
                        { label: 'Morgen', d: 1 },
                        { label: '+2 Tage', d: 2 },
                        { label: '+3 Tage', d: 3 },
                        { label: '+7 Tage', d: 7 }
                      ].map(b => (
                        <button
                          key={b.d}
                          type="button"
                          onClick={() => setNewPantryExpiryDate(getFutureDateStr(b.d))}
                          className="py-1 bg-white border border-amber-300 rounded text-[10px] font-semibold text-amber-900 hover:bg-amber-100"
                        >
                          {b.label}
                        </button>
                      ))}
                    </div>
                    <input
                      type="date"
                      value={newPantryExpiryDate}
                      onChange={e => setNewPantryExpiryDate(e.target.value)}
                      className="w-full bg-white border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold"
                    />
                  </div>
                </div>
                <button
                  onClick={handleAddPantryItem}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Speichern (oder Bestand aufstocken)
                </button>
              </div>
            </div>
          )}

          {cookedModalRecipe && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
                <div className="flex items-center justify-between border-b border-stone-100 pb-2.5">
                  <h3 className="text-base font-semibold text-stone-900">Heute gekocht: {cookedModalRecipe.title}</h3>
                  <button onClick={() => setCookedModalRecipe(null)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {cookDeductions.length > 0 ? (
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-stone-800">Zutaten vom Bestand abziehen:</span>
                      <span className="text-[10px] text-stone-500">Menge & Sorte anpassbar</span>
                    </div>
                    <div className="space-y-2 max-h-60 overflow-y-auto pr-0.5">
                      {cookDeductions.map((ded, idx) => {
                        const selectedPantryObj = !ded.isMealPrep
                          ? (ded.candidates || []).find(c => c.id === ded.selectedPantryId) || ded.candidates?.[0]
                          : null;
                        const displayUnit = ded.isMealPrep
                          ? 'g'
                          : (selectedPantryObj?.unitType || ded.parsedAmt?.unit || 'g');

                        return (
                          <div
                            key={ded.id}
                            className={`border rounded-xl p-2.5 space-y-2 transition ${
                              ded.checked ? 'bg-stone-50 border-stone-300' : 'bg-stone-50/40 border-stone-200 opacity-60'
                            }`}
                          >
                            <div className="flex items-center justify-between gap-2">
                              <label className="flex items-center gap-2 text-xs font-semibold text-stone-900 cursor-pointer flex-1">
                                <input
                                  type="checkbox"
                                  checked={ded.checked}
                                  onChange={e => {
                                    const val = e.target.checked;
                                    setCookDeductions(prev => prev.map((item, i) => i === idx ? { ...item, checked: val } : item));
                                  }}
                                  className="w-4 h-4 accent-stone-900 rounded"
                                />
                                <span>{ded.ingName}</span>
                                <span className="text-[10px] font-normal text-stone-500">({ded.ingAmountStr})</span>
                              </label>

                              <div className="flex items-center gap-1 shrink-0">
                                <span className="text-xs text-stone-500 font-bold">-</span>
                                <input
                                  type="number"
                                  min="0"
                                  step="any"
                                  value={ded.deductVal}
                                  onChange={e => {
                                    const val = e.target.value;
                                    setCookDeductions(prev => prev.map((item, i) => i === idx ? { ...item, deductVal: val } : item));
                                  }}
                                  className="w-16 bg-white border border-stone-300 rounded-lg px-2 py-1 text-xs font-bold text-right text-stone-900"
                                />
                                <span className="text-[11px] font-semibold text-stone-700 min-w-[28px]">
                                  {formatContainerLabel(displayUnit, ded.deductVal)}
                                </span>
                              </div>
                            </div>

                            {ded.isMealPrep ? (
                              <div className="text-[11px] text-stone-600 pl-6">
                                TK Meal-Prep: <strong>{ded.mealPrepName}</strong> ({ded.availGrams} g vorrätig)
                              </div>
                            ) : (
                              ded.candidates && ded.candidates.length > 1 ? (
                                <div className="pl-6">
                                  <select
                                    value={ded.selectedPantryId}
                                    onChange={e => {
                                      const newId = e.target.value;
                                      const targetObj = ded.candidates.find(c => c.id === newId);
                                      setCookDeductions(prev => prev.map((item, i) => {
                                        if (i !== idx) return item;
                                        let nextDed = item.parsedAmt?.val || item.deductVal;
                                        if (item.parsedAmt?.isCount && targetObj && (targetObj.unitType === 'g' || targetObj.unitType === 'ml') && Array.isArray(targetObj.packs) && targetObj.packs.length > 0) {
                                          nextDed = item.parsedAmt.val * (Number(targetObj.packs[0].size) || 1);
                                        }
                                        return { ...item, selectedPantryId: newId, deductVal: nextDed };
                                      }));
                                    }}
                                    className="w-full bg-white border border-stone-300 rounded-lg px-2 py-1 text-[11px] font-medium text-stone-800"
                                  >
                                    {ded.candidates.map(cand => (
                                      <option key={cand.id} value={cand.id}>
                                        Abbuchen von: {cand.name} (Bestand: {cand.amount} {cand.unitType})
                                      </option>
                                    ))}
                                  </select>
                                </div>
                              ) : selectedPantryObj ? (
                                <div className="text-[11px] text-stone-500 pl-6">
                                  Bestand: <strong>{selectedPantryObj.name}</strong> ({selectedPantryObj.amount} {selectedPantryObj.unitType} da)
                                </div>
                              ) : null
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-stone-500 bg-stone-50 border border-stone-200 rounded-xl p-3">
                    Keine messbaren Vorrats-Abzüge für dieses Rezept gefunden.
                  </p>
                )}

                <div className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 space-y-2.5">
                  <p className="text-xs font-semibold text-stone-800">
                    Reste in Silikonformen eingefroren?
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 500 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers500(Math.max(0, freezeLeftovers500 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers500}</span>
                        <button onClick={() => setFreezeLeftovers500(freezeLeftovers500 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 250 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers250(Math.max(0, freezeLeftovers250 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers250}</span>
                        <button onClick={() => setFreezeLeftovers250(freezeLeftovers250 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                  </div>
                </div>

                <button
                  onClick={handleConfirmCooked}
                  className="w-full py-3 bg-[#849b82] hover:bg-[#738871] text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 shadow-sm transition"
                >
                  <Icon name="check" size={16} />
                  <span>Bestätigen & ausgewählte Zutaten abbuchen</span>
                </button>
              </div>
            </div>
          )}

          {voiceOverlay && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <h3 className="text-base font-semibold text-stone-900">Gemini Direkt-Audio</h3>
                    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded border ${
                      isRecordingAudio ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                    }`}>
                      {isRecordingAudio ? `● Aufnahme (${formatTimer(recordingSeconds)})` : recordedAudioBlob ? 'Aufnahme bereit' : 'Bereit'}
                    </span>
                  </div>
                  <button
                    onClick={() => {
                      cleanupAudioRecording();
                      setVoiceOverlay(false);
                    }}
                    className="text-stone-400"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <p className="text-xs text-stone-500 leading-relaxed">
                  Frag nach Vorräten, Rezepten („Wie viel Parmesan kommt in die Limone?“, „Lies mir die Schritte vor“) oder buche Artikel ein. Antworten werden <strong>laut vorgelesen</strong>!
                </p>

                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      if (isRecordingAudio) {
                        stopNativeAudioRecording();
                      } else {
                        startNativeAudioRecording();
                      }
                    }}
                    className={`flex-1 py-3.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition ${
                      isRecordingAudio
                        ? 'bg-red-600 text-white animate-pulse shadow-sm'
                        : 'bg-stone-100 hover:bg-stone-200 text-stone-900'
                    }`}
                  >
                    <Icon name="mic" size={16} />
                    <span>
                      {isRecordingAudio
                        ? `Ich höre zu... (${formatTimer(recordingSeconds)}) – Tippen für Pause`
                        : recordedAudioBlob
                        ? 'Aufnahme neu starten'
                        : 'Aufnahme starten'}
                    </span>
                  </button>
                </div>

                <div className="space-y-1 pt-1 border-t border-stone-100">
                  <label className="text-[11px] font-medium text-stone-500 block">
                    Optional: Alternativ hier eintippen (oder Pixel-Tastaturmikrofon nutzen):
                  </label>
                  <textarea
                    rows={2}
                    placeholder="Optionaler Text..."
                    value={voiceText}
                    onChange={e => setVoiceText(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs leading-relaxed text-stone-900 focus:outline-none focus:border-stone-600"
                  />
                </div>

                <button
                  disabled={isProcessingVoice || (!isRecordingAudio && !recordedAudioBlob && !voiceText.trim())}
                  onClick={executeVoiceCommand}
                  className="w-full py-3 bg-[#849b82] hover:bg-[#738871] disabled:bg-stone-300 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-sm transition"
                >
                  {isProcessingVoice ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      <span>Gemini wertet deine Stimme aus...</span>
                    </>
                  ) : (
                    <>
                      <Icon name="check" size={16} />
                      <span>Fertig – Direkt mit Gemini ausführen</span>
                    </>
                  )}
                </button>
              </div>
            </div>
          )}

          <nav
            style={{
              paddingBottom: 'env(safe-area-inset-bottom, 0px)',
              boxShadow: '0 60px 0 60px #1c1917'
            }}
            className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#1c1917] border-t border-stone-800 grid grid-cols-5 px-1.5 py-1.5 z-30"
          >
            {[
              { id: 'decide', label: 'Würfler', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte', icon: 'archive' },
              { id: 'home', label: 'Start', icon: 'home' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                  className={`flex flex-col items-center justify-center gap-0.5 py-1.5 mx-0.5 rounded-xl text-[11px] transition ${
                    active
                      ? 'bg-[#849b82]/20 text-[#a8c3a5] font-semibold'
                      : 'text-stone-400 hover:text-stone-200 font-medium'
                  }`}
                >
                  <Icon name={item.icon} size={18} className={active ? 'text-[#a8c3a5]' : ''} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

*(Schreib einfach kurz **„Teil 2“**, dann folgt sofort der Rest ab `handleCreateNewMealPrep` bis `</html>`!)*
