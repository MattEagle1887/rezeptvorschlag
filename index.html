    const compressImageToBase64 = (file, maxWidth = 1024, quality = 0.75) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    // DYNAMISCHER GEMINI AUFRUF
    let cachedWorkingModel = null;

    async function callGeminiWithAutoModel(apiKey, promptText, base64Image = null) {
      const cleanKey = (apiKey || '').trim();
      if (!cleanKey) {
        throw new Error('Kein Gemini API-Key hinterlegt. Bitte Einladungs-Link nutzen oder im Zahnrad-Menü eintragen.');
      }

      let candidateModels = [];
      if (cachedWorkingModel) candidateModels.push(cachedWorkingModel);

      try {
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
        const listData = await listRes.json();
        if (listRes.ok && listData && Array.isArray(listData.models)) {
          const validModels = listData.models
            .filter(m =>
              m.supportedGenerationMethods &&
              m.supportedGenerationMethods.includes('generateContent') &&
              !m.name.includes('embedding') &&
              !m.name.includes('aqa') &&
              !m.name.includes('imagen') &&
              !m.name.includes('veo') &&
              !m.name.includes('tts') &&
              !m.name.includes('audio')
            )
            .map(m => m.name.replace(/^models\//, ''));

          validModels.sort((a, b) => {
            const aFlash = a.includes('flash') ? 1 : 0;
            const bFlash = b.includes('flash') ? 1 : 0;
            if (aFlash !== bFlash) return bFlash - aFlash;
            return b.localeCompare(a, undefined, { numeric: true });
          });

          for (const vm of validModels) {
            if (!candidateModels.includes(vm)) candidateModels.push(vm);
          }
        }
      } catch (err) {}

      const fallbacks = ['gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-2.0-flash'];
      for (const fb of fallbacks) {
        if (!candidateModels.includes(fb)) candidateModels.push(fb);
      }

      const parts = [{ text: promptText }];
      if (base64Image) parts.push({ inlineData: { mimeType: 'image/jpeg', data: base64Image } });

      let lastErrorMsg = 'Kein passendes Gemini-Modell gefunden.';
      for (const modelName of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            cachedWorkingModel = modelName;
            return { text: data.candidates[0].content.parts[0].text, usedModel: modelName };
          } else {
            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (netErr) {
          lastErrorMsg = netErr.message;
        }
      }
      throw new Error(lastErrorMsg);
    }

      const [geminiKey, setGeminiKey] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const fromUrl = params.get('gemini');
        if (fromUrl) {

          const res = await fetch(`${cleanUrl}/kueche_shared.json`);

            lastSyncTimestamp.current = data.updatedAt;
            setPantry(data.pantry || []);
            setMealPrep(data.mealPrep || []);
            setRecipes(data.recipes || []);
            setShoppingList(data.shoppingList || []);
            setMealPlan(data.mealPlan || []);

      const handleSaveFullEditPantryItem = () => {
        if (!editingFullPantryItem || !editPantryName.trim()) return;
        const cleanName = editPantryName.trim();

        const isSpice = editPantryCategory === 'spices';

        // Falls im Edit-Modal unten noch eine neue Packungsgröße eingetippt, aber noch nicht auf "+" geklickt wurde, automatisch mitnehmen:
        let finalPacks = [...editPantryPacks].filter(p => Number(p.size) > 0 && Number(p.count) >= 0);
        if (Number(editNewPackSize) > 0 && Number(editNewPackCount) > 0) {
          const s = Number(editNewPackSize);
          const c = Number(editNewPackCount);
          const u = editNewPackUnit || 'g';
          const existingIdx = finalPacks.findIndex(p => Number(p.size) === s && p.unit === u);
          if (existingIdx !== -1) {
            finalPacks[existingIdx].count += c;
          } else {
            finalPacks.push({ size: s, unit: u, count: c });
          }
        }
        finalPacks.sort((a, b) => Number(b.size) - Number(a.size));

        let cleanAmount = isSpice ? undefined : Math.max(0, Number(editPantryAmount));
        let unit = isSpice ? undefined : editPantryUnitType;

        if (!isSpice && finalPacks.length > 0) {
          const sum = calcPacksSummary(finalPacks);
          cleanAmount = sum.totalAmount;
          unit = sum.unit;

        const threshold = unit === 'g' || unit === 'ml' ? 200 : 1;
        let nextStatus = 'in_stock';
        if (!isSpice) {
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';
        }

        let detectedGroup = editingFullPantryItem.group;
        if (lowerClean.includes('tagliatelle') || lowerClean.includes('rigatoni') || lowerClean.includes('spaghetti') || lowerClean.includes('penne') || lowerClean.includes('pasta') || lowerClean.includes('nudeln') || lowerClean.includes('fusilli') || lowerClean.includes('farfalle')) {
          detectedGroup = 'Pasta';
        } else if (lowerClean.includes('fond') || lowerClean.includes('brühe')) {
          detectedGroup = 'Fond';
        } else if (lowerClean.includes('reis')) {
          detectedGroup = 'Reis';
        }

        setPantry(prev => prev.map(p => {
          if (p.id !== editingFullPantryItem.id) return p;
          return {
            ...p,
            name: cleanName,
            category: editPantryCategory,
            amount: cleanAmount,
            unitType: unit,
            packs: (!isSpice && finalPacks.length > 0) ? finalPacks : undefined,
            lowThreshold: threshold,
            status: nextStatus,
            group: detectedGroup,
            expiryDate: editPantryExpiryDate ? editPantryExpiryDate : undefined,
            expiryDays: undefined
          };
        }));

        setEditingFullPantryItem(null);
        showToast(`"${cleanName}" gespeichert!`);

      // Packungs-Anzahl in einer Vorratskarte direkt per [-] / [+] anpassen (Option 1)
      const updatePackCount = (itemId, packIndex, delta) => {
        setPantry(prev => prev.map(item => {
          if (item.id !== itemId || !Array.isArray(item.packs)) return item;
          const nextPacks = item.packs.map((pk, idx) => {
            if (idx !== packIndex) return pk;
            return { ...pk, count: Math.max(0, (Number(pk.count) || 0) + delta) };
          });
          const summary = calcPacksSummary(nextPacks);
          const cleanAmount = summary ? summary.totalAmount : 0;
          const unit = summary ? summary.unit : item.unitType;
          const threshold = item.lowThreshold || (unit === 'g' || unit === 'ml' ? 200 : 1);

          let nextStatus = 'in_stock';
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';

          if (nextStatus === 'empty' && item.status !== 'empty') {
            setShoppingList(sl => {
              if (sl.some(s => s.name.toLowerCase() === item.name.toLowerCase())) return sl;
              return [...sl, { id: 's_' + Date.now(), name: item.name, reason: 'Aufgebraucht', done: false }];
            });
            showToast(`${item.name} ist leer → Einkaufsliste`);
          }

          return {
            ...item,
            packs: nextPacks,
            amount: cleanAmount,
            unitType: unit,
            status: nextStatus
          };
        }));
      };

      // Bald ablaufende Artikel (<= 2 Tage)
      const urgentExpiringItems = useMemo(() => {

          .filter(p => p.status !== 'empty' && (p.amount === undefined || p.amount > 0))
          .map(p => ({ ...p, daysLeft: getDaysUntilExpiry(p) }))
          .filter(p => p.daysLeft !== undefined && p.daysLeft <= 2)
          .sort((a, b) => a.daysLeft - b.daysLeft);
      }, [pantry]);

      // Alphabetisch sortierte & durchsuchbare Vorratsliste
      const displayedPantryItems = useMemo(() => {
        const q = pantrySearchQuery.trim().toLowerCase();
        return pantry
          .filter(item => {
            if (q) return item.name.toLowerCase().includes(q);
            return item.category === pantrySubTab;
          })
          .sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
      }, [pantry, pantrySubTab, pantrySearchQuery]);

      // Alphabetisch sortierte & durchsuchbare Meal-Prep-Liste
      const displayedMealPrepItems = useMemo(() => {
        const q = pantrySearchQuery.trim().toLowerCase();
        return [...mealPrep]
          .filter(mp => !q || mp.name.toLowerCase().includes(q))
          .sort((a, b) => a.name.localeCompare(b.name, 'de', { sensitivity: 'base' }));
      }, [mealPrep, pantrySearchQuery]);

      // Alphabetisch sortierte & durchsuchbare Rezeptliste
      const displayedRecipes = useMemo(() => {

        return [...recipes]
          .filter(r => {
            if (!q) return true;
            const titleMatch = r.title.toLowerCase().includes(q);

            return titleMatch || ingMatch;
          })
          .sort((a, b) => a.title.localeCompare(b.title, 'de', { sensitivity: 'base' }));
      }, [recipes, recipeSearchQuery]);

      const updatePantryAmount = (itemId, newAmountVal) => {
        const cleanAmount = Math.max(0, Number(newAmountVal));
        setPantry(prev => prev.map(item => {
          if (item.id !== itemId) return item;
          const threshold = item.lowThreshold || (item.unitType === 'g' ? 150 : 1);
          let nextStatus = 'in_stock';
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';

          if (nextStatus === 'empty' && item.status !== 'empty') {
            setShoppingList(sl => {
              if (sl.some(s => s.name.toLowerCase() === item.name.toLowerCase())) return sl;
              return [...sl, { id: 's_' + Date.now(), name: item.name, reason: 'Aufgebraucht', done: false }];

            showToast(`${item.name} ist leer → Einkaufsliste`);

          return { ...item, amount: cleanAmount, status: nextStatus };
        }));
      };

      const deletePantryItem = (itemId) => {

        setPantry(prev => prev.filter(p => p.id !== itemId));

      };

      const deleteMealPrepItem = (mpId) => {

        setMealPrep(prev => prev.filter(m => m.id !== mpId));
        if (mpToDelete) showToast(`"${mpToDelete.name}" aus TK gelöscht`);
      };

      // Intelligentes Hinzufügen oder Aufstocken (Unterstützt Option 1 Packungs-Baukasten!)
      const addOrUpdatePantryItem = (name, amountToAdd, unit, category, expiryInput = undefined, packSizeNum = undefined, packUnitStr = undefined) => {
        const cleanName = name.trim();
        if (!cleanName) return;
        const lowerClean = cleanName.toLowerCase();
        const targetCat = category || (pantrySubTab === 'mealprep' ? 'pantry' : pantrySubTab);

        let resolvedExpiryDate = undefined;
        if (typeof expiryInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(expiryInput)) {
          resolvedExpiryDate = expiryInput;
        } else if (typeof expiryInput === 'number' && !isNaN(expiryInput)) {
          resolvedExpiryDate = getFutureDateStr(expiryInput);
        } else if (targetCat === 'fridge' && expiryInput === undefined) {
          resolvedExpiryDate = getFutureDateStr(5);
        }

        const hasPackInfo = Number(packSizeNum) > 0;
        const pSize = Number(packSizeNum);
        const pUnit = packUnitStr || (unit === 'ml' || unit === 'Flasche' ? 'ml' : 'g');
        const pCount = Math.max(1, Number(amountToAdd) || 1);

        const existingIndex = pantry.findIndex(p => {
          const pLower = p.name.toLowerCase();
          return pLower === lowerClean || pLower.includes(lowerClean) || lowerClean.includes(pLower);
        });

        if (existingIndex !== -1) {
          const matchedItem = pantry[existingIndex];
          setPantry(prev => prev.map((item, idx) => {
            if (idx !== existingIndex) return item;
            if (item.category === 'spices') return { ...item, status: 'in_stock' };

            // Fall A: Artikel nutzt bereits den Packungs-Baukasten ODER es wurde eine Packungsgröße übergeben
            if (hasPackInfo || (Array.isArray(item.packs) && item.packs.length > 0)) {
              let nextPacks = Array.isArray(item.packs) ? item.packs.map(pk => ({ ...pk })) : [];
              // Falls der bestehende Artikel bisher ohne Baukasten in g/ml war, überführe alten Bestand in ersten Baustein
              if (nextPacks.length === 0 && (item.unitType === 'g' || item.unitType === 'ml') && item.amount > 0) {
                nextPacks.push({ size: item.amount, unit: item.unitType, count: 1 });
              }

              const targetSize = hasPackInfo ? pSize : ( (unit === 'g' || unit === 'ml') && Number(amountToAdd) >= 100 ? Number(amountToAdd) : (nextPacks[0]?.size || 500) );
              const targetUnit = hasPackInfo ? pUnit : (nextPacks[0]?.unit || item.unitType || 'g');
              const addCount = hasPackInfo ? pCount : ( (unit === 'g' || unit === 'ml') && Number(amountToAdd) >= 100 ? 1 : pCount );

              const packIdx = nextPacks.findIndex(pk => Number(pk.size) === Number(targetSize) && pk.unit === targetUnit);
              if (packIdx !== -1) {
                nextPacks[packIdx].count = (Number(nextPacks[packIdx].count) || 0) + addCount;
              } else {
                nextPacks.push({ size: targetSize, unit: targetUnit, count: addCount });
              }
              nextPacks.sort((a, b) => Number(b.size) - Number(a.size));

              const sum = calcPacksSummary(nextPacks);
              return {
                ...item,
                packs: nextPacks,
                amount: sum.totalAmount,
                unitType: sum.unit,
                status: 'in_stock',
                ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
              };
            }

            // Fall B: Normaler Einzel-Zähler (z.B. 3 Zitronen + 2 Zitronen)
            const currentAmt = item.amount !== undefined ? Number(item.amount) : 0;
            return {
              ...item,
              amount: currentAmt + Number(amountToAdd),
              status: 'in_stock',
              ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
            };
          }));

          if (hasPackInfo) {
            showToast(`"${matchedItem.name}": +${pCount}× ${pSize}${pUnit} Packung hinzugefügt!`);
          } else {
            showToast(`"${matchedItem.name}" aufgestockt (+${amountToAdd} ${matchedItem.unitType || unit})!`);
          }
        } else {
          // Neuen Artikel anlegen
          const initialPacks = (targetCat !== 'spices' && hasPackInfo)
            ? [{ size: pSize, unit: pUnit, count: pCount }]
            : undefined;
          const finalAmount = targetCat === 'spices'
            ? undefined
            : (initialPacks ? pSize * pCount : Number(amountToAdd));
          const finalUnit = targetCat === 'spices'
            ? undefined
            : (initialPacks ? pUnit : unit);

          const newItem = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1),
            category: targetCat,
            status: 'in_stock',
            amount: finalAmount,
            unitType: finalUnit,
            ...(initialPacks ? { packs: initialPacks } : {}),
            lowThreshold: finalUnit === 'g' || finalUnit === 'ml' ? 200 : 1,
            ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate } : {}),
            ...(lowerClean.includes('tagliatelle') || lowerClean.includes('rigatoni') || lowerClean.includes('spaghetti') || lowerClean.includes('penne') || lowerClean.includes('pasta') ? { group: 'Pasta' } : {}),
            ...(lowerClean.includes('fond') || lowerClean.includes('brühe') ? { group: 'Fond' } : {})
          };
          setPantry(prev => [newItem, ...prev]);
          showToast(`Neu angelegt: ${newItem.name}`);
        }
      };

      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];
        let minExpiryDays = 999;

        (recipe.ingredients || []).forEach((ing) => {
          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? ((mp.blocks500 || 0) * 500 + (mp.blocks250 || 0) * 250) : 0;
            if (totalGrams === 0) missing.push(ing.name);
            return;
          }
          if (ing.isPasta) {
            const exactPasta = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactPasta) return;
            const anyPasta = pantry.find(p => p.group === 'Pasta' && p.amount > 0);
            if (anyPasta) { notes.push(`Joker: ${anyPasta.name} im Haus`); return; }
            if (ing.essential) missing.push(ing.name);
            return;
          }
          if (ing.isFond) {
            const exactFond = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactFond) return;
            const anyFond = pantry.find(p => p.group === 'Fond' && p.amount > 0);
            if (anyFond) { notes.push(`Joker: ${anyFond.name} statt ${ing.name}`); return; }
            if (ing.essential) missing.push(ing.name);
            return;
          }
          const found = pantry.find(p =>
            p.name.toLowerCase().includes(ing.name.toLowerCase()) ||
            ing.name.toLowerCase().includes(p.name.toLowerCase())
          );
          if (!found || found.status === 'empty' || (found.amount !== undefined && found.amount <= 0)) {
            if (ing.essential) missing.push(ing.name);
          } else {
            if (found.category === 'freezer_items' && found.subType === 'meat') {
              fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);
            }
            const dLeft = getDaysUntilExpiry(found);
            if (dLeft !== undefined && dLeft <= 2) {
              urgentFridgeItems.push({ name: found.name, daysLeft: dLeft });
              if (dLeft < minExpiryDays) minExpiryDays = dLeft;
            }
          }
        });

        return { missing, fromFreezerMeat, urgentFridgeItems, minExpiryDays, noteText: notes.join(' · ') };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => ({ ...r, ...checkRecipeAvailability(r) }))
          .filter(r => {
            if (filterMode === 'kid' && !r.isKidFriendly) return false;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;
            if (filterCalories === 'under150' && (r.kcalPer100g === undefined || r.kcalPer100g >= 150)) return false;
            if (filterCalories === '150to300' && (r.kcalPer100g === undefined || r.kcalPer100g < 150 || r.kcalPer100g > 300)) return false;
            if (filterCalories === 'over300' && (r.kcalPer100g === undefined || r.kcalPer100g <= 300)) return false;
            if (filterShopping === 'any_plan') return true;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_3' && r.missing.length > 3) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            if (a.minExpiryDays !== b.minExpiryDays) {
              return a.minExpiryDays - b.minExpiryDays;
            }
            return (b.lastCookedDaysAgo || 0) - (a.lastCookedDaysAgo || 0);
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterCalories, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {
        setMealPrep(prev => prev.map(mp => {
          if (mp.id !== mpId) return mp;
          if (label) showToast(`${mp.name}: ${label}`);
          return {
            ...mp,
            blocks500: Math.max(0, (mp.blocks500 || 0) + delta500),
            blocks250: Math.max(0, (mp.blocks250 || 0) + delta250)
          };
        }));
      };

      const handleCreateNewMealPrep = () => {
        if (!newMpName.trim()) return;
        const newId = 'mp_' + Date.now();
        const needsArray = newMpNeeds.split(',').map(s => s.trim()).filter(Boolean);
        const newEntry = {
          id: newId, name: newMpName.trim(),
          blocks500: Number(newMp500) || 0, blocks250: Number(newMp250) || 0,
          kcalPer100g: Number(newMpKcal) || 170, needsFresh: needsArray, prepTime: 20, season: 'all'
        };
        setMealPrep(prev => [newEntry, ...prev]);

        if (newMpCreateRecipe) {
          const newRec = {
            id: 'r_mp_' + Date.now(), title: `${newMpName.trim()} (aus dem TK)`,
            effort: 'quick', season: 'all', kcalPer100g: Number(newMpKcal) || 170,
            isFamilyRecipe: true, isKidFriendly: true, isMealPrep: true, mealPrepId: newId, isDraft: false, lastCookedDaysAgo: 30, prepTime: 20,
            ingredients: [
              { name: `${newMpName.trim()} (TK)`, amount: '500g oder 250g Block', essential: true, isFromMealPrep: newId },
              ...needsArray.map(n => ({ name: n, amount: 'Nach Bedarf', essential: true }))
            ],
            steps: [
              'Gewünschte Silikonform-Blöcke aus dem TK nehmen und schonend im Topf erwärmen.',
              needsArray.length > 0 ? `Dazu frisch zubereiten: ${needsArray.join(', ')}.` : 'Direkt heiß servieren.'
            ]
          };
          setRecipes(prev => [newRec, ...prev]);
        }

        setNewMpName(''); setNewMp500(1); setNewMp250(0); setNewMpKcal(170); setNewMpNeeds('');
        setShowAddMealPrepModal(false);
        showToast(`"${newEntry.name}" im TK hinterlegt!`);
      };

      const handleAddPantryItem = () => {
        if (!newPantryName.trim()) return;
        const expToSave = newPantryExpiryDate ? newPantryExpiryDate : null;
        const usesContainerPack = ['Packung', 'Dosen', 'Flasche', 'Gläser', 'Tube'].includes(newPantryUnitType) && Number(newPantryPackWeight) > 0;
        addOrUpdatePantryItem(
          newPantryName,
          Number(newPantryAmount) || 1,
          newPantryUnitType,
          newPantryCategory,
          expToSave,
          usesContainerPack ? Number(newPantryPackWeight) : undefined,
          usesContainerPack ? newPantryPackUnit : undefined
        );
        setNewPantryName('');
        setNewPantryExpiryDate('');
        setShowNewPantryItemModal(false);
      };

      const handleConfirmCooked = () => {
        if (!cookedModalRecipe) return;
        setRecipes(prev => prev.map(r => r.id === cookedModalRecipe.id ? { ...r, lastCookedDaysAgo: 0 } : r));

        setPantry(prev => prev.map(p => {
          if (p.id === 'p12') {

            if (nextUses >= (p.maxUses || 20)) setOliveOilAlert(true);
            return { ...p, usesSinceOpen: nextUses };
          }
          return p;
        }));

        if (freezeLeftovers500 > 0 || freezeLeftovers250 > 0) {
          const existingMp = mealPrep.find(m =>
            m.id === cookedModalRecipe.mealPrepId ||
            m.name.toLowerCase().includes(cookedModalRecipe.title.toLowerCase()) ||
            cookedModalRecipe.title.toLowerCase().includes(m.name.toLowerCase())
          );
          if (existingMp) {
            updateMealPrepBlocks(existingMp.id, freezeLeftovers500, freezeLeftovers250);
          } else {
            setMealPrep(prev => [{
              id: 'mp_' + Date.now(), name: cookedModalRecipe.title,
              blocks500: freezeLeftovers500, blocks250: freezeLeftovers250,
              kcalPer100g: cookedModalRecipe.kcalPer100g || 170, needsFresh: [], prepTime: 20, season: 'all'
            }, ...prev]);
          }
          showToast(`Reste (${freezeLeftovers500 * 500 + freezeLeftovers250 * 250}g) im TK gespeichert!`);
        } else {
          showToast(`"${cookedModalRecipe.title}" als gekocht markiert!`);
        }
        setFreezeLeftovers500(0); setFreezeLeftovers250(0); setCookedModalRecipe(null);
      };

      const selectedRecipe = recipes.find(r => r.id === selectedRecipeId);

      const deleteIngredientFromRecipe = (recipeId, ingIndex) => {
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          const removed = r.ingredients[ingIndex];
          const nextIngs = r.ingredients.filter((_, idx) => idx !== ingIndex);
          if (removed) showToast(`"${removed.name}" gelöscht`);
          return { ...r, ingredients: nextIngs };
        }));
      };

      const addIngredientToRecipe = (recipeId) => {
        if (!newIngredientName.trim()) return;
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          return {
            ...r,
            ingredients: [
              ...(r.ingredients || []),
              { name: newIngredientName.trim(), amount: newIngredientAmount.trim() || 'Nach Bedarf', essential: true }
            ]
          };
        }));
        setNewIngredientName(''); setNewIngredientAmount('');
        showToast('Zutat hinzugefügt');
      };

      const deleteStepFromRecipe = (recipeId, stepIndex) => {
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          return { ...r, steps: (r.steps || []).filter((_, idx) => idx !== stepIndex) };
        }));
      };

      const addStepToRecipe = (recipeId) => {
        if (!newStepText.trim()) return;
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          const cleanSteps = r.isDraft ? [] : (r.steps || []);
          return { ...r, isDraft: false, steps: [...cleanSteps, newStepText.trim()] };
        }));
        setNewStepText('');
        showToast('Zubereitungsschritt gespeichert');
      };

      const toggleRecipeFamily = (recipeId) => {
        setRecipes(prev => prev.map(r => r.id === recipeId ? { ...r, isFamilyRecipe: !r.isFamilyRecipe } : r));
      };

      const toggleRecipeKid = (recipeId) => {
        setRecipes(prev => prev.map(r => r.id === recipeId ? { ...r, isKidFriendly: !r.isKidFriendly } : r));
      };

      const updateRecipeKcal = (recipeId, val) => {
        setRecipes(prev => prev.map(r => r.id === recipeId ? { ...r, kcalPer100g: Number(val) || 0 } : r));
      };

      const addToMealPlan = (recipe) => {
        if (mealPlan.some(m => m.id === recipe.id)) {
          showToast('Rezept ist bereits im Kochplan!');
          return;
        }
        setMealPlan(prev => [...prev, recipe]);
        const avail = checkRecipeAvailability(recipe);
        const newShoppingItems = avail.missing
          .filter(ingName => !shoppingList.some(s => s.name.toLowerCase() === ingName.toLowerCase()))
          .map(ingName => ({ id: 's_' + Date.now() + '_' + Math.random(), name: ingName, reason: `Für Wochenplan: ${recipe.title}`, done: false }));

        if (newShoppingItems.length > 0) {
          setShoppingList(prev => [...prev, ...newShoppingItems]);
          showToast(`"${recipe.title}" gemerkt & ${newShoppingItems.length} Zutat(en) auf Einkaufsliste!`);
        } else {
          showToast(`"${recipe.title}" im Wochenplan gemerkt!`);
        }
      };

      const removeFromMealPlan = (recipeId) => {
        setMealPlan(prev => prev.filter(m => m.id !== recipeId));
        showToast('Aus dem Kochplan entfernt');
      };

      // OFFIZIELLER BRING!-EXPORT
      const triggerOfficialBringImport = async () => {
        if (shoppingList.length === 0) return;
        const cleanUrl = (firebaseUrl || '').trim().replace(/\/$/, '');
        if (!cleanUrl) {
          showToast('Für den Direkt-Import bitte zuerst die Firebase-URL in den Einstellungen verbinden (oder unten einzeln kopieren).');
          return;
        }
        try {
          await fetch(`${cleanUrl}/bring_export.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(buildBringParserPayload(shoppingList))
          });
        } catch (e) {}

        const staticJsonEndpoint = `${cleanUrl}/bring_export.json`;
        const officialDeepLink = `https://api.getbring.com/rest/bringrecipes/deeplink?url=${encodeURIComponent(staticJsonEndpoint)}&source=web&baseQuantity=1&requestedQuantity=1`;
        window.open(officialDeepLink, '_blank');
      };

      // FOTO-SCAN: Ignoriert jetzt Marken ("Bamboo Garden" -> "Sojasauce") und erkennt Packungsgrößen (z.B. 1000g Penne)!
      const handleFileSelected = async (e, scanType = 'pantry') => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = '';

        const activeKey = (geminiKey || '').trim();
        const todayStr = new Date().toISOString().split('T')[0];

        try {
          setIsAnalyzingPhoto(true);
          showToast('Foto wird von Gemini analysiert...');
          const base64Data = await compressImageToBase64(file, 1024, 0.75);

          const prompt = scanType === 'recipe'
            ? `Analysiere diese abfotografierte Kochbuchseite und antworte NUR mit reinem JSON: {"title": "Name des Gerichts", "prepTime": 30, "kcalPer100g": 180, "ingredients": [{"name": "Zutat (ohne Markennamen)", "amount": "Menge"}], "steps": ["Schritt 1", "Schritt 2"]}`
            : `Heute ist ${todayStr}. Erkenne das fotografierte Lebensmittel oder den Kassenbon.
WICHTIGE REGELN:
1. KEINE MARKENNAMEN! Speichere immer nur den reinen Gattungsbegriff (z.B. "Sojasauce" statt "Bamboo Garden Sojasauce", "Penne" statt "Barilla Penne", "Passata" statt "Mutti Passata").
2. PACKUNGSGEWICHT ERKENNEN: Wenn auf einer Packung/Dose/Flasche ein Gewicht oder Volumen steht (z.B. 1 kg = 1000 g Penne, 500 g Spaghetti, 400 g Dosentomaten), gib "packSize": 1000 (als Zahl in g oder ml), "packUnit": "g"|"ml" und "packCount": 1 an!
3. Falls ein Haltbarkeitsdatum (MHD) lesbar ist, gib es als YYYY-MM-DD in "expiryDate" an.
Antworte NUR mit reinem JSON:
{"items": [{"name": "Reiner Produktname ohne Marke", "amount": 1, "unitType": "Packung|Flasche|Dosen|Stück|g|ml|Tube", "packSize": 1000, "packUnit": "g", "category": "pantry|fridge|freezer_items|sauces|spices", "expiryDate": "YYYY-MM-DD"}]}`;

          const { text: rawText, usedModel } = await callGeminiWithAutoModel(activeKey, prompt, base64Data);
          setDetectedModelInfo(usedModel);

          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Kein JSON im KI-Text gefunden');
          const parsed = JSON.parse(jsonMatch[0]);

          if (scanType === 'recipe' && parsed.title) {
            const newRec = {
              id: 'r_' + Date.now(), title: parsed.title,
              effort: (parsed.prepTime || 30) <= 30 ? 'quick' : 'elaborate',
              season: 'all', kcalPer100g: Number(parsed.kcalPer100g) || 180,
              isFamilyRecipe: true, isKidFriendly: false, isMealPrep: false, isDraft: false,
              lastCookedDaysAgo: 99, prepTime: Number(parsed.prepTime) || 30,
              ingredients: (parsed.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
              steps: parsed.steps || ['Aus Kochbuch gescannt.']
            };
            setRecipes(prev => [newRec, ...prev]);
            setSelectedRecipeId(newRec.id);
            setActiveTab('recipes');
            showToast(`Rezept "${newRec.title}" eingescannt!`);
          } else if (parsed.items && parsed.items.length > 0) {
            parsed.items.forEach(it => {
              const hasDetectedPack = Number(it.packSize) > 0;
              addOrUpdatePantryItem(
                it.name,
                it.amount || 1,
                it.unitType || 'Stück',
                it.category || 'pantry',
                it.expiryDate || null,
                hasDetectedPack ? Number(it.packSize) : undefined,
                hasDetectedPack ? (it.packUnit || 'g') : undefined
              );
            });
          }
        } catch (err) {
          showToast(`Scan-Fehler: ${err.message}`);
          setNewPantryExpiryDate(getFutureDateStr(3));
          setShowNewPantryItemModal(true);
        } finally {
          setIsAnalyzingPhoto(false);
        }
      };

      const testAvailableModels = async () => {
        try {
          showToast('Frage verfügbare Modelle bei Google ab...');
          const activeKey = (geminiKey || '').trim();
          const res = await callGeminiWithAutoModel(activeKey, 'Antworte nur mit dem Wort OK');
          setDetectedModelInfo(res.usedModel);
          showToast(`Erfolgreich! Aktives Modell: ${res.usedModel}`);
        } catch (err) {
          showToast(`Test-Fehler: ${err.message}`);
        }
      };

      // SPRACHERKENNUNG OHNE DOPPELTE SÄTZE
      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Spracherkennung wird von diesem Browser nicht unterstützt.');
          return;
        }
        try {
          if (recognitionRef.current) {
            try { recognitionRef.current.abort(); } catch (e) {}
          }
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = 'de-DE';
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          setIsListening(true);
          recognition.onresult = (event) => {
            const lastIdx = event.results.length - 1;
            const singleCleanTranscript = event.results[lastIdx][0].transcript.trim();
            setVoiceText(singleCleanTranscript);
            try { recognition.stop(); } catch (e) {}
          };
          recognition.onend = () => setIsListening(false);
          recognition.onerror = () => setIsListening(false);
          recognition.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      const stopListening = () => {
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        setIsListening(false);
      };

      const openVoiceAssistantAndStart = () => {
        setVoiceText('');
        setVoiceOverlay(true);
        startListening();
      };

      // GEMINI KI SPRACH-INTERPRETER (Unterstützt Vorräte, Packungsgrößen UND das Anlegen neuer Rezepte wie "Senfeier"!)
      const executeVoiceCommand = async (rawCmdText) => {
        if (!rawCmdText || !rawCmdText.trim()) return;
        stopListening();

        const activeKey = (geminiKey || '').trim();
        const todayStr = new Date().toISOString().split('T')[0];
        const existingNames = pantry.map(p => `${p.name} (${p.amount !== undefined ? p.amount + ' ' + p.unitType : 'Gewürz'}, ${p.category})`).join(', ');

        try {
          setIsProcessingVoice(true);
          const voicePrompt = `Du bist der smarte Küchen-Assistent einer Vorrats- und Rezept-App.
Heute ist ${todayStr}.
Aktuell im Bestand vorhandene Artikel: [${existingNames}].
Der Nutzer hat folgenden Sprachbefehl eingesprochen: "${rawCmdText.trim()}"

Analysiere, was der Nutzer möchte, und antworte AUSSCHLIESSLICH mit validem JSON in genau diesem Format:
{
  "actions": [
    {
      "type": "add_or_increment" | "set_exact" | "delete" | "mealprep_add" | "create_recipe" | "query",
      "name": "Sauberer Produktname OHNE Markennamen (Falls im Bestand vorhanden, nutze exakt den vorhandenen Namen!)",
      "amount": 1,
      "unitType": "Packung|Flasche|Dosen|Stück|g|ml|Tube|Gläser",
      "packSize": null,
      "packUnit": "g",
      "category": "pantry|fridge|freezer_items|sauces|spices",
      "expiryDate": "YYYY-MM-DD (nur falls Kühlschrank/Frischware oder MHD genannt, sonst null)",
      "blocks500": 1,
      "blocks250": 0,
      "recipe": {
        "title": "Name des Gerichts",
        "prepTime": 25,
        "kcalPer100g": 180,
        "isKidFriendly": true,
        "ingredients": [{"name": "Zutat", "amount": "Menge"}],
        "steps": ["Schritt 1", "Schritt 2"]
      },
      "answerText": "Antwort-Text falls der Nutzer eine Frage gestellt hat"
    }
  ]
}
Wichtige Regeln:
- Lass Markennamen immer weg ("Bamboo Garden Sojasauce" -> "Sojasauce").
- Wenn der Nutzer Packungsgrößen nennt (z.B. "zwei 1-Kilo Packungen Penne"), setze type: "add_or_increment", name: "Penne", amount: 2, packSize: 1000, packUnit: "g", category: "pantry".
- Wenn der Nutzer ein neues Rezept anlegen möchte (z.B. "Rezept für Senfeier anlegen"), setze type: "create_recipe" und fülle das Objekt "recipe" komplett mit typischen Zutaten und Zubereitungsschritten aus!`;

          const { text: aiResponse } = await callGeminiWithAutoModel(activeKey, voicePrompt);
          const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Konnte Sprachbefehl nicht zuordnen');
          const parsed = JSON.parse(jsonMatch[0]);

          if (parsed.actions && Array.isArray(parsed.actions)) {
            parsed.actions.forEach(act => {
              if (act.type === 'query' && act.answerText) {
                showToast(act.answerText);
              } else if (act.type === 'create_recipe' && act.recipe) {
                const r = act.recipe;
                const newRec = {
                  id: 'r_' + Date.now(),
                  title: r.title || act.name || 'Neues Rezept',
                  effort: (Number(r.prepTime) || 25) <= 30 ? 'quick' : 'elaborate',
                  season: 'all',
                  kcalPer100g: Number(r.kcalPer100g) || 180,
                  isFamilyRecipe: true,
                  isKidFriendly: Boolean(r.isKidFriendly),
                  isMealPrep: false,
                  isDraft: false,
                  lastCookedDaysAgo: 99,
                  prepTime: Number(r.prepTime) || 25,
                  ingredients: (r.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
                  steps: r.steps || ['Frisch zubereiten.']
                };
                setRecipes(prev => [newRec, ...prev]);
                showToast(`Rezept "${newRec.title}" mit Zutaten angelegt!`);
              } else if (act.type === 'delete') {

                  id: 'mp_' + Date.now(), name: act.name || 'Neues Gericht',
                  blocks500: Number(act.blocks500) || 1, blocks250: Number(act.blocks250) || 0,
                  kcalPer100g: 170, needsFresh: [], prepTime: 20, season: 'all'

                  act.unitType || 'Stück',
                  act.category || 'pantry',
                  act.expiryDate || undefined,
                  hasPack ? Number(act.packSize) : undefined,
                  hasPack ? (act.packUnit || 'g') : undefined
                );
              }
            });

                      <span className="text-xs font-medium">+ 250 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers250(Math.max(0, freezeLeftovers250 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers250}</span>
                        <button onClick={() => setFreezeLeftovers250(freezeLeftovers250 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                  </div>
                </div>

                <button
                  onClick={handleConfirmCooked}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Bestätigen & Historie aktualisieren
                </button>
              </div>
            </div>
          )}

          {/* MODAL: SPRACHBEFEHL */}
          {voiceOverlay && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <h3 className="text-base font-semibold text-stone-900">Gemini Sprach-Assistent</h3>
                    <span className="text-[10px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded">KI aktiv</span>
                  </div>
                  <button onClick={() => { stopListening(); setVoiceOverlay(false); }} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <p className="text-xs text-stone-500">
                  Beispiele: <em>„Zwei 1-Kilo Packungen Penne“</em>, <em>„10 g Pancetta in den Kühlschrank“</em> oder <em>„Rezept für klassische Senfeier anlegen“</em>
                </p>

                <button
                  onClick={isListening ? stopListening : startListening}
                  className={`w-full py-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition ${
                    isListening ? 'bg-red-600 text-white animate-pulse' : 'bg-stone-100 hover:bg-stone-200 text-stone-900'
                  }`}
                >
                  <Icon name="mic" size={16} />
                  <span>{isListening ? 'Ich höre zu... (jetzt sprechen)' : 'Erneut sprechen'}</span>
                </button>

                <input
                  type="text"
                  placeholder="Erkannter Satz erscheint nach dem Sprechen hier..."
                  value={voiceText}
                  onChange={e => setVoiceText(e.target.value)}
                  className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                />

                <button
                  disabled={isProcessingVoice || !voiceText.trim()}
                  onClick={() => executeVoiceCommand(voiceText)}
                  className="w-full py-2.5 bg-stone-900 disabled:bg-stone-400 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2"
                >
                  {isProcessingVoice ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      <span>Gemini verarbeitet...</span>
                    </>
                  ) : (
                    <span>Mit Gemini ausführen</span>
                  )}
                </button>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 grid grid-cols-5 py-2 z-30">
            {[
              { id: 'home', label: 'Start', icon: 'home' },
              { id: 'decide', label: 'Würfler', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte', icon: 'archive' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 py-1 text-[11px] font-medium ${
                    active ? 'text-stone-900' : 'text-stone-400'
                  }`}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
