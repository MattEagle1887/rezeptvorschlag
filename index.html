    function App() {
      const [activeTab, setActiveTab] = useState('decide');

      const [pantry, setPantry] = useState(() => {
        const saved = localStorage.getItem('kueche_pantry_v6');
        return saved ? JSON.parse(saved) : INITIAL_PANTRY;
      });
      const [mealPrep, setMealPrep] = useState(() => {
        const saved = localStorage.getItem('kueche_mealprep_v6');
        return saved ? JSON.parse(saved) : INITIAL_MEAL_PREP;
      });
      const [recipes, setRecipes] = useState(() => {
        const saved = localStorage.getItem('kueche_recipes_v6');
        return saved ? JSON.parse(saved) : INITIAL_RECIPES;
      });
      const [shoppingList, setShoppingList] = useState(() => {
        const saved = localStorage.getItem('kueche_shopping_v6');
        return saved ? JSON.parse(saved) : [
          { id: 's1', name: 'Frischer Rosmarin & Thymian', reason: 'Wird knapp', done: false }
        ];
      });

      useEffect(() => { localStorage.setItem('kueche_pantry_v6', JSON.stringify(pantry)); }, [pantry]);
      useEffect(() => { localStorage.setItem('kueche_mealprep_v6', JSON.stringify(mealPrep)); }, [mealPrep]);
      useEffect(() => { localStorage.setItem('kueche_recipes_v6', JSON.stringify(recipes)); }, [recipes]);
      useEffect(() => { localStorage.setItem('kueche_shopping_v6', JSON.stringify(shoppingList)); }, [shoppingList]);

      const [filterEffort, setFilterEffort] = useState('all');
      const [filterCalories, setFilterCalories] = useState('all');
      const [filterShopping, setFilterShopping] = useState('all_here');
      const [filterMode, setFilterMode] = useState('normal');
      const [currentSuggestionIndex, setCurrentSuggestionIndex] = useState(0);

      const [pantrySubTab, setPantrySubTab] = useState('freezer_items');
      const [selectedRecipeId, setSelectedRecipeId] = useState(null);
      const [isEditingRecipe, setIsEditingRecipe] = useState(false);
      const [newIngredientName, setNewIngredientName] = useState('');
      const [newIngredientAmount, setNewIngredientAmount] = useState('');
      const [newStepText, setNewStepText] = useState('');

      const [showAddMealPrepModal, setShowAddMealPrepModal] = useState(false);
      const [newMpName, setNewMpName] = useState('');
      const [newMp500, setNewMp500] = useState(1);
      const [newMp250, setNewMp250] = useState(0);
      const [newMpNeeds, setNewMpNeeds] = useState('');
      const [newMpCreateRecipe, setNewMpCreateRecipe] = useState(true);

      const [showNewPantryItemModal, setShowNewPantryItemModal] = useState(false);
      const [newPantryName, setNewPantryName] = useState('');
      const [newPantryAmount, setNewPantryAmount] = useState(6);
      const [newPantryUnitType, setNewPantryUnitType] = useState('Stück');
      const [newPantryExpiry, setNewPantryExpiry] = useState(5);

      const [editingAmountItem, setEditingAmountItem] = useState(null);
      const [editingAmountValue, setEditingAmountValue] = useState('');

      const [cookedModalRecipe, setCookedModalRecipe] = useState(null);
      const [freezeLeftovers500, setFreezeLeftovers500] = useState(0);
      const [freezeLeftovers250, setFreezeLeftovers250] = useState(0);
      const [oliveOilAlert, setOliveOilAlert] = useState(false);

      const [voiceOverlay, setVoiceOverlay] = useState(false);
      const [voiceText, setVoiceText] = useState('');
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const updatePantryAmount = (itemId, newAmountVal) => {
        const cleanAmount = Math.max(0, Number(newAmountVal));
        setPantry(prev => prev.map(item => {
          if (item.id !== itemId) return item;
          const threshold = item.lowThreshold || (item.unitType === 'g' ? 150 : 2);
          let nextStatus = 'in_stock';
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';

          if (nextStatus === 'empty' && item.status !== 'empty') {
            setShoppingList(sl => {
              if (sl.some(s => s.name === item.name)) return sl;
              return [...sl, { id: 's_' + Date.now(), name: item.name, reason: 'Aufgebraucht (0 ' + item.unitType + ')', done: false }];
            });
            showToast(`${item.name} ist leer → Einkaufsliste`);
          }

          return { ...item, amount: cleanAmount, status: nextStatus };
        }));
      };

      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];

        recipe.ingredients.forEach((ing) => {
          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? (mp.blocks500 * 500 + mp.blocks250 * 250) : 0;
            if (totalGrams === 0) missing.push(ing.name);
            return;
          }

          if (ing.isPasta) {
            const exactPasta = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactPasta) return;
            const anyPasta = pantry.find(p => p.group === 'Pasta' && p.amount > 0);
            if (anyPasta) {
              notes.push(`Joker: ${anyPasta.name} im Haus`);
              return;
            }
            if (ing.essential) missing.push(ing.name);
            return;
          }

          if (ing.isFond) {
            const exactFond = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactFond) return;
            const anyFond = pantry.find(p => p.group === 'Fond' && p.amount > 0);
            if (anyFond) {
              notes.push(`Joker: ${anyFond.name} statt ${ing.name}`);
              return;
            }
            if (ing.essential) missing.push(ing.name);
            return;
          }

          const found = pantry.find(p =>
            p.name.toLowerCase().includes(ing.name.toLowerCase()) ||
            ing.name.toLowerCase().includes(p.name.toLowerCase())
          );
          if (!found || found.status === 'empty' || (found.amount !== undefined && found.amount <= 0)) {
            if (ing.essential) missing.push(ing.name);
          } else {
            if (found.category === 'freezer_items' && found.subType === 'meat') {
              fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);
            }
            if (found.category === 'fridge' && found.expiryDays <= 2) {
              urgentFridgeItems.push(found.name);
            }
          }
        });

        return { missing, fromFreezerMeat, urgentFridgeItems, noteText: notes.join(' · ') };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => {
            const avail = checkRecipeAvailability(r);
            return { ...r, ...avail };
          })
          .filter(r => {
            if (filterMode === 'kid') return r.isKidOnlyFastDay || r.isKidFriendly;
            if (filterMode === 'mealprep') return r.isMealPrep;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;
            if (filterCalories !== 'all' && r.calories !== filterCalories) return false;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_1_2' && r.missing.length > 2) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            return b.lastCookedDaysAgo - a.lastCookedDaysAgo;
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterCalories, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {
        setMealPrep(prev => prev.map(mp => {
          if (mp.id !== mpId) return mp;
          const next500 = Math.max(0, mp.blocks500 + delta500);
          const next250 = Math.max(0, mp.blocks250 + delta250);
          if (label) showToast(`${mp.name}: ${label}`);
          return { ...mp, blocks500: next500, blocks250: next250 };
        }));
      };

      const handleCreateNewMealPrep = () => {
        if (!newMpName.trim()) return;
        const newId = 'mp_' + Date.now();
        const needsArray = newMpNeeds.split(',').map(s => s.trim()).filter(Boolean);

        const newEntry = {
          id: newId,
          name: newMpName.trim(),
          blocks500: Number(newMp500) || 0,
          blocks250: Number(newMp250) || 0,
          needsFresh: needsArray,
          prepTime: 20,
          season: 'all'
        };
        setMealPrep(prev => [newEntry, ...prev]);

        if (newMpCreateRecipe) {
          const newRec = {
            id: 'r_mp_' + Date.now(),
            title: `${newMpName.trim()} (aus dem TK)`,
            effort: 'quick',
            season: 'all',
            calories: 'normal',
            isKidFriendly: true,
            isMealPrep: true,
            mealPrepId: newId,
            isDraft: false,
            lastCookedDaysAgo: 30,
            prepTime: 20,
            ingredients: [
              { name: `${newMpName.trim()} (TK)`, amount: '500g oder 250g Block', essential: true, isFromMealPrep: newId },
              ...needsArray.map(n => ({ name: n, amount: 'Nach Bedarf', essential: true }))
            ],
            steps: [
              'Gewünschte Silikonform-Blöcke aus dem TK nehmen und schonend im Topf erwärmen.',
              needsArray.length > 0 ? `Dazu frisch zubereiten: ${needsArray.join(', ')}.` : 'Direkt heiß servieren.'
            ]
          };
          setRecipes(prev => [newRec, ...prev]);
        }

        setNewMpName('');
        setNewMp500(1);
        setNewMp250(0);
        setNewMpNeeds('');
        setShowAddMealPrepModal(false);
        showToast(`"${newEntry.name}" im TK hinterlegt!`);
      };

      const handleAddPantryItem = () => {
        if (!newPantryName.trim()) return;
        const amt = Number(newPantryAmount) || 1;
        const defaultLow = newPantryUnitType === 'g' || newPantryUnitType === 'ml' ? 150 : 2;
        const lowerName = newPantryName.toLowerCase();

        const newItem = {
          id: 'p_' + Date.now(),
          name: newPantryName.trim(),
          category: pantrySubTab,

            m.name.toLowerCase().includes(cookedModalRecipe.title.toLowerCase()) ||

      const deleteIngredientFromRecipe = (recipeId, ingIndex) => {
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          const removed = r.ingredients[ingIndex];
          const nextIngs = r.ingredients.filter((_, idx) => idx !== ingIndex);

          return { ...r, ingredients: nextIngs };
        }));

      const addIngredientToRecipe = (recipeId) => {
        if (!newIngredientName.trim()) return;
        setRecipes(prev => prev.map(r => {

          return {
            ...r,
            ingredients: [
              ...r.ingredients,

        }));
        setNewIngredientName('');
        setNewIngredientAmount('');
        showToast('Zutat hinzugefügt');

      const deleteStepFromRecipe = (recipeId, stepIndex) => {
        setRecipes(prev => prev.map(r => {

          return { ...r, steps: r.steps.filter((_, idx) => idx !== stepIndex) };

          )}

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 grid grid-cols-4 py-2 z-30">
            {[
              { id: 'decide', label: 'Heute kochen', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte & TK', icon: 'archive' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 py-1 text-[11px] font-medium ${
                    active ? 'text-stone-900' : 'text-stone-400'
                  }`}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
