                  <h3 className="text-sm font-semibold text-stone-900">{editingMpKcalItem.name}</h3>
                  <button onClick={() => setEditingMpKcalItem(null)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div>
                  <label className="text-xs text-stone-600 block mb-1">
                    Kalorien pro 100 g (inkl. Beilage):
                  </label>
                  <input
                    type="number"
                    min="0"
                    value={editingMpKcalVal}
                    onChange={e => setEditingMpKcalVal(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-base font-semibold"
                    autoFocus
                  />
                </div>
                <button
                  onClick={() => {
                    setMealPrep(prev => prev.map(m => m.id === editingMpKcalItem.id ? { ...m, kcalPer100g: Number(editingMpKcalVal) || 0 } : m));
                    setEditingMpKcalItem(null);
                    showToast('Kalorien aktualisiert!');
                  }}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Übernehmen
                </button>
              </div>
            </div>
          )}

          {/* MODAL: EXAKTEN BESTAND EINGEBEN */}
          {editingAmountItem && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xs w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-stone-900">{editingAmountItem.name}</h3>
                  <button onClick={() => setEditingAmountItem(null)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div>
                  <label className="text-xs text-stone-600 block mb-1">
                    Genaue Restmenge in <strong>{editingAmountItem.unitType}</strong>:
                  </label>
                  <input
                    type="number"
                    min="0"
                    value={editingAmountValue}
                    onChange={e => setEditingAmountValue(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-base font-semibold"
                    autoFocus
                  />
                </div>
                <button
                  onClick={() => {
                    updatePantryAmount(editingAmountItem.id, editingAmountValue);
                    setEditingAmountItem(null);
                  }}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Übernehmen
                </button>
              </div>
            </div>
          )}

          {/* MODAL: NEUES GERICHT */}
          {showNewRecipeModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Neues Gericht anlegen</h3>
                  <button onClick={() => setShowNewRecipeModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">Name des Gerichts</label>
                    <input
                      type="text"
                      placeholder="z.B. Senfeier, Chili con Carne..."
                      value={newRecipeTitle}
                      onChange={e => setNewRecipeTitle(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-medium text-stone-700 block mb-1">ca. kcal / 100g</label>
                      <input
                        type="number"
                        value={newRecipeKcal}
                        onChange={e => setNewRecipeKcal(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-medium text-stone-700 block mb-1">Dauer (Min.)</label>
                      <input
                        type="number"
                        value={newRecipePrepTime}
                        onChange={e => setNewRecipePrepTime(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                      />
                    </div>
                  </div>
                </div>
                <button
                  onClick={() => {
                    if (!newRecipeTitle.trim()) return;
                    const newRec = {
                      id: 'r_' + Date.now(),
                      title: newRecipeTitle.trim(),
                      effort: Number(newRecipePrepTime) <= 30 ? 'quick' : 'elaborate',
                      season: 'all',
                      kcalPer100g: Number(newRecipeKcal) || 180,
                      isFamilyRecipe: true,
                      isKidFriendly: false,
                      isMealPrep: false,
                      isDraft: true,
                      lastCookedDaysAgo: 99,
                      prepTime: Number(newRecipePrepTime) || 30,
                      ingredients: [],
                      steps: ['Noch kein Rezepttext hinterlegt. Beim Kochen ergänzen!']
                    };
                    setRecipes(prev => [newRec, ...prev]);
                    setNewRecipeTitle('');
                    setShowNewRecipeModal(false);
                    setSelectedRecipeId(newRec.id);
                    setIsEditingRecipe(true);
                  }}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Anlegen & Zutaten ergänzen
                </button>
              </div>
            </div>
          )}

          {/* MODAL: NEUES MEAL-PREP */}
          {showAddMealPrepModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Neues Meal-Prep einfrieren</h3>
                  <button onClick={() => setShowAddMealPrepModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">Gericht / Sauce</label>
                    <input
                      type="text"
                      placeholder="z.B. Chili con Carne, Hühnerfrikassee..."
                      value={newMpName}
                      onChange={e => setNewMpName(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-stone-50 border border-stone-200 rounded-lg p-3">
                      <label className="text-xs font-semibold text-stone-800 block mb-1">500 g Formen</label>
                      <input
                        type="number"
                        min="0"
                        value={newMp500}
                        onChange={e => setNewMp500(e.target.value)}
                        className="w-full bg-white border border-stone-300 rounded px-2 py-1.5 text-sm font-semibold"
                      />
                    </div>
                    <div className="bg-stone-50 border border-stone-200 rounded-lg p-3">
                      <label className="text-xs font-semibold text-stone-800 block mb-1">250 g Formen</label>
                      <input
                        type="number"
                        min="0"
                        value={newMp250}
                        onChange={e => setNewMp250(e.target.value)}
                        className="w-full bg-white border border-stone-300 rounded px-2 py-1.5 text-sm font-semibold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">Ungefähre kcal / 100g (inkl. Beilage)</label>
                    <input
                      type="number"
                      value={newMpKcal}
                      onChange={e => setNewMpKcal(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">
                      Was braucht man beim Auftauen frisch dazu? (Optional)
                    </label>
                    <input
                      type="text"
                      placeholder="z.B. Reis, Pasta, Kartoffeln"
                      value={newMpNeeds}
                      onChange={e => setNewMpNeeds(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                    />
                  </div>
                </div>

                <button
                  onClick={handleCreateNewMealPrep}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Im Tiefkühler speichern
                </button>
              </div>
            </div>
          )}

          {/* MODAL: NEUER VORRAT */}
          {showNewPantryItemModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Vorrat hinzufügen</h3>
                  <button onClick={() => setShowNewPantryItemModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] text-stone-500 block mb-1">Lagerort</label>
                    <select
                      value={newPantryCategory}
                      onChange={e => {
                        const cat = e.target.value;
                        setNewPantryCategory(cat);
                        if (cat === 'fridge' && !newPantryExpiryDate) setNewPantryExpiryDate(getFutureDateStr(3));
                      }}
                      className="w-full border border-stone-300 rounded-lg px-2.5 py-2 text-xs bg-white"
                    >
                      <option value="pantry">Vorratsschrank</option>
                      <option value="fridge">Kühlschrank</option>
                      <option value="freezer_items">Tiefkühler</option>
                      <option value="sauces">Öle und Soßen</option>
                      <option value="spices">Gewürzschrank (ohne Einheit)</option>
                    </select>
                  </div>

                  <input
                    type="text"
                    placeholder="Bezeichnung ohne Marke (z.B. Penne, Senf...)"
                    value={newPantryName}
                    onChange={e => setNewPantryName(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                  />

                  {newPantryCategory !== 'spices' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-[11px] text-stone-500 block mb-1">Anzahl / Menge</label>
                          <input
                            type="number"
                            min="0"
                            value={newPantryAmount}
                            onChange={e => setNewPantryAmount(e.target.value)}
                            className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs font-semibold"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] text-stone-500 block mb-1">Behälter / Einheit</label>
                          <select
                            value={newPantryUnitType}
                            onChange={e => {
                              const u = e.target.value;
                              setNewPantryUnitType(u);
                              if (u === 'g' || u === 'ml') {
                                setNewPantryAmount(500);
                                setNewPantryPackWeight('');
                              } else {
                                setNewPantryAmount(1);
                              }
                            }}
                            className="w-full border border-stone-300 rounded-lg px-2.5 py-2 text-xs bg-white font-semibold"
                          >
                            <option value="Packung">Packung</option>
                            <option value="Glas">Glas</option>
                            <option value="Dose">Dose</option>
                            <option value="Flasche">Flasche</option>
                            <option value="Tube">Tube</option>
                            <option value="Becher">Becher</option>
                            <option value="Stück">Stück (Einzeln)</option>
                            <option value="g">Gramm (g lose)</option>
                            <option value="ml">Milliliter (ml lose)</option>
                          </select>
                        </div>
                      </div>

                      {['Packung', 'Dose', 'Dosen', 'Flasche', 'Glas', 'Gläser', 'Tube', 'Becher'].includes(newPantryUnitType) && (
                        <div className="bg-stone-50 border border-stone-200 rounded-xl p-3 space-y-2">
                          <div className="flex items-center justify-between">
                            <label className="text-[11px] font-semibold text-stone-800">
                              Inhalt pro {formatContainerLabel(newPantryUnitType, 1)} (Optional für Baukasten):
                            </label>
                            {newPantryPackWeight && (
                              <button
                                type="button"
                                onClick={() => setNewPantryPackWeight('')}
                                className="text-[10px] text-stone-500 underline"
                              >
                                Ohne Gewicht
                              </button>
                            )}
                          </div>
                          <div className="flex gap-1.5">
                            {[180, 250, 400, 500, 1000].map(w => (
                              <button
                                key={w}
                                type="button"
                                onClick={() => { setNewPantryPackWeight(String(w)); setNewPantryPackUnit('g'); }}
                                className={`flex-1 py-1 rounded border text-[10px] font-semibold ${
                                  Number(newPantryPackWeight) === w ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-700 border-stone-300'
                                }`}
                              >
                                {w}g
                              </button>
                            ))}
                          </div>
                          <div className="grid grid-cols-2 gap-2 pt-0.5">
                            <input
                              type="number"
                              placeholder="z.B. 180, 500, 1000"
                              value={newPantryPackWeight}
                              onChange={e => setNewPantryPackWeight(e.target.value)}
                              className="bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold"
                            />
                            <select
                              value={newPantryPackUnit}
                              onChange={e => setNewPantryPackUnit(e.target.value)}
                              className="bg-white border border-stone-300 rounded-lg px-2.5 py-1.5 text-xs"
                            >
                              <option value="g">Gramm (g)</option>
                              <option value="ml">Milliliter (ml)</option>
                            </select>
                          </div>
                        </div>
                      )}
                    </>
                  )}

                  {/* HALTBARKEITSDATUM (MHD) */}
                  <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-3 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="text-[11px] font-semibold text-amber-950">
                        Haltbar bis / MHD {newPantryCategory !== 'fridge' && '(Optional)'}:
                      </label>
                      {newPantryExpiryDate && (
                        <button
                          type="button"
                          onClick={() => setNewPantryExpiryDate('')}
                          className="text-[10px] text-stone-500 underline"
                        >
                          Kein MHD
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-4 gap-1">
                      {[
                        { label: 'Morgen', d: 1 },
                        { label: '+2 Tage', d: 2 },
                        { label: '+3 Tage', d: 3 },
                        { label: '+7 Tage', d: 7 }
                      ].map(b => (
                        <button
                          key={b.d}
                          type="button"
                          onClick={() => setNewPantryExpiryDate(getFutureDateStr(b.d))}
                          className="py-1 bg-white border border-amber-300 rounded text-[10px] font-semibold text-amber-900 hover:bg-amber-100"
                        >
                          {b.label}
                        </button>
                      ))}
                    </div>
                    <input
                      type="date"
                      value={newPantryExpiryDate}
                      onChange={e => setNewPantryExpiryDate(e.target.value)}
                      className="w-full bg-white border border-amber-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold"
                    />
                  </div>
                </div>
                <button
                  onClick={handleAddPantryItem}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Speichern (oder Bestand aufstocken)
                </button>
              </div>
            </div>
          )}

          {/* MODAL: HEUTE GEKOCHT + RESTE EINFRIEREN */}
          {cookedModalRecipe && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Heute gekocht: {cookedModalRecipe.title}</h3>
                  <button onClick={() => setCookedModalRecipe(null)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 space-y-2.5">
                  <p className="text-xs font-semibold text-stone-800">
                    Reste in Silikonformen eingefroren?
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 500 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers500(Math.max(0, freezeLeftovers500 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers500}</span>
                        <button onClick={() => setFreezeLeftovers500(freezeLeftovers500 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 250 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers250(Math.max(0, freezeLeftovers250 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers250}</span>
                        <button onClick={() => setFreezeLeftovers250(freezeLeftovers250 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                  </div>
                </div>

                <button
                  onClick={handleConfirmCooked}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Bestätigen & Historie aktualisieren
                </button>
              </div>
            </div>
          )}

          {/* MODAL: SPRACHBEFEHL MIT ENDLOS-DIKTAT */}
          {voiceOverlay && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <h3 className="text-base font-semibold text-stone-900">Gemini Sprach-Assistent</h3>
                    <span className={`text-[10px] font-semibold px-2 py-0.5 rounded border ${
                      isListening ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                    }`}>
                      {isListening ? '● Mikrofon offen' : 'Bereit'}
                    </span>
                  </div>
                  <button onClick={() => { stopListening(); setVoiceOverlay(false); }} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <p className="text-xs text-stone-500 leading-relaxed">
                  Sprich ganz entspannt (auch mit Pausen beim Kochen). Das Mikrofon bleibt so lange an, bis du unten auf <strong>„Mit Gemini ausführen“</strong> oder auf Pause tippst!
                </p>

                <div className="flex gap-2">
                  <button
                    onClick={isListening ? stopListening : startListening}
                    className={`flex-1 py-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition ${
                      isListening ? 'bg-red-600 text-white animate-pulse' : 'bg-stone-100 hover:bg-stone-200 text-stone-900'
                    }`}
                  >
                    <Icon name="mic" size={16} />
                    <span>{isListening ? 'Aufnahme pausieren' : 'Weiter sprechen'}</span>
                  </button>
                  {(voiceText || voiceInterimText) && (
                    <button
                      onClick={() => { setVoiceText(''); setVoiceInterimText(''); }}
                      className="px-3 py-3 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600 text-xs font-medium"
                      title="Textfeld leeren"
                    >
                      Leeren
                    </button>
                  )}
                </div>

                <div className="space-y-1">
                  <textarea
                    rows={4}
                    placeholder="Dein gesprochener Text wird hier laufend aneinandergehängt..."
                    value={voiceText}
                    onChange={e => setVoiceText(e.target.value)}
                    className="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs leading-relaxed text-stone-900 focus:outline-none focus:border-stone-600"
                  />
                  {voiceInterimText && (
                    <p className="text-[11px] text-stone-500 italic px-1 animate-pulse">
                      Höre gerade: „{voiceInterimText}...“
                    </p>
                  )}
                </div>

                <button
                  disabled={isProcessingVoice || (!voiceText.trim() && !voiceInterimText.trim())}
                  onClick={() => executeVoiceCommand(voiceText)}
                  className="w-full py-3 bg-[#849b82] hover:bg-[#738871] disabled:bg-stone-300 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 shadow-sm transition"
                >
                  {isProcessingVoice ? (
                    <>
                      <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      <span>Gemini verarbeitet...</span>
                    </>
                  ) : (
                    <>
                      <Icon name="check" size={16} />
                      <span>Fertig – Mit Gemini ausführen</span>
                    </>
                  )}
                </button>
              </div>
            </div>
          )}

          {/* DUNKLE ANTHRAZIT BOTTOM NAVIGATION (#1c1917): Kompakt mit salbeigrüner Hervorhebung */}
          <nav
            style={{
              paddingBottom: 'env(safe-area-inset-bottom, 0px)',
              boxShadow: '0 60px 0 60px #1c1917'
            }}
            className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#1c1917] border-t border-stone-800 grid grid-cols-5 px-1.5 py-1.5 z-30"
          >
            {[
              { id: 'decide', label: 'Würfler', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte', icon: 'archive' },
              { id: 'home', label: 'Start', icon: 'home' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }}
                  className={`flex flex-col items-center justify-center gap-0.5 py-1.5 mx-0.5 rounded-xl text-[11px] transition ${
                    active
                      ? 'bg-[#849b82]/20 text-[#a8c3a5] font-semibold'
                      : 'text-stone-400 hover:text-stone-200 font-medium'
                  }`}
                >
                  <Icon name={item.icon} size={18} className={active ? 'text-[#a8c3a5]' : ''} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
