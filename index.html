    const replaceGermanNumberWords = (str) => {
      const map = {
        'einhalb': '0.5', 'eineinhalb': '1.5', 'anderthalb': '1.5',
        'einen': '1', 'eine': '1', 'eins': '1', 'ein': '1',
        'zwei': '2', 'zwo': '2', 'zweimal': '2',
        'drei': '3', 'dreimal': '3',
        'vier': '4', 'viermal': '4',
        'fünf': '5', 'fünfmal': '5',
        'sechs': '6', 'sieben': '7', 'acht': '8', 'neun': '9', 'zehn': '10', 'elf': '11', 'zwölf': '12'
      };
      return str.replace(/\b(einhalb|eineinhalb|anderthalb|einen|eine|eins|ein|zwei|zwo|zweimal|drei|dreimal|vier|viermal|fünf|fünfmal|sechs|sieben|acht|neun|zehn|elf|zwölf)\b/gi, (m) => map[m.toLowerCase()] || m);
    };

    const compressImageToBase64 = (file, maxWidth = 1024, quality = 0.75) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl.split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

        if (!firebaseUrl || isApplyingRemote.current) return;
        const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
        try {
          setSyncStatus('syncing');
          const now = Date.now();
          lastSyncTimestamp.current = now;
          await fetch(`${cleanUrl}/kueche_shared.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...nextState, updatedAt: now })
          });
          setSyncStatus('synced');
        } catch (err) {
          setSyncStatus('error');
        }
      };

      const pullFromCloud = async () => {
        if (!firebaseUrl) {
          setSyncStatus('local');
          return;
        }
        const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
        try {
          const res = await fetch(`${cleanUrl}/kueche_shared.json`);
          if (!res.ok) throw new Error('Netzwerkfehler');
          const data = await res.json();
          if (data && data.updatedAt && data.updatedAt > lastSyncTimestamp.current) {
            isApplyingRemote.current = true;
            lastSyncTimestamp.current = data.updatedAt;
            if (data.pantry) setPantry(data.pantry);
            if (data.mealPrep) setMealPrep(data.mealPrep);
            if (data.recipes) setRecipes(data.recipes);
            if (data.shoppingList) setShoppingList(data.shoppingList);
            if (data.mealPlan) setMealPlan(data.mealPlan);
            setTimeout(() => { isApplyingRemote.current = false; }, 200);

          }
          setSyncStatus('synced');
        } catch (e) {

        }

      const updatePantryAmount = (itemId, newAmountVal) => {
        const cleanAmount = Math.max(0, Number(newAmountVal));
        setPantry(prev => prev.map(item => {
          if (item.id !== itemId) return item;
          const threshold = item.lowThreshold || (item.unitType === 'g' ? 150 : 1);
          let nextStatus = 'in_stock';
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';

          if (nextStatus === 'empty' && item.status !== 'empty') {
            setShoppingList(sl => {
              if (sl.some(s => s.name.toLowerCase() === item.name.toLowerCase())) return sl;
              return [...sl, { id: 's_' + Date.now(), name: item.name, reason: 'Aufgebraucht', done: false }];
            });
            showToast(`${item.name} ist leer → Einkaufsliste`);
          }

          return { ...item, amount: cleanAmount, status: nextStatus };
        }));
      };

      const deletePantryItem = (itemId) => {

      const addOrUpdatePantryItem = (name, amountToAdd, unit, category, expiryDays = undefined) => {
        const cleanName = name.trim();
        if (!cleanName) return;
        const lowerClean = cleanName.toLowerCase();

        const existingIndex = pantry.findIndex(p => {
          const pLower = p.name.toLowerCase();
          return pLower === lowerClean || pLower.includes(lowerClean) || lowerClean.includes(pLower);
        });

        if (existingIndex !== -1) {
          const matchedItem = pantry[existingIndex];
          setPantry(prev => prev.map((item, idx) => {
            if (idx !== existingIndex) return item;
            if (item.category === 'spices') return { ...item, status: 'in_stock' };
            const currentAmt = item.amount !== undefined ? Number(item.amount) : 0;
            const nextAmt = currentAmt + Number(amountToAdd);
            return { ...item, amount: nextAmt, status: 'in_stock' };
          }));
          showToast(`"${matchedItem.name}" aufgestockt (+${amountToAdd} ${matchedItem.unitType || unit})!`);
        } else {
          const targetCat = category || pantrySubTab || 'pantry';
          const newItem = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1),
            category: targetCat,
            status: 'in_stock',
            amount: targetCat === 'spices' ? undefined : Number(amountToAdd),
            unitType: targetCat === 'spices' ? undefined : unit,
            lowThreshold: unit === 'g' || unit === 'ml' ? 150 : 1,
            ...(targetCat === 'fridge' ? { expiryDays: Number(expiryDays) || 5 } : {}),
            ...(lowerClean.includes('tagliatelle') || lowerClean.includes('rigatoni') || lowerClean.includes('spaghetti') || lowerClean.includes('penne') || lowerClean.includes('pasta') ? { group: 'Pasta' } : {}),
            ...(lowerClean.includes('fond') || lowerClean.includes('brühe') ? { group: 'Fond' } : {})
          };
          setPantry(prev => [newItem, ...prev]);
          showToast(`Neu erkannt & angelegt: ${newItem.name}`);
        }
      };

      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];

        recipe.ingredients.forEach((ing) => {
          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? (mp.blocks500 * 500 + mp.blocks250 * 250) : 0;
            if (totalGrams === 0) missing.push(ing.name);
            return;
          }

          if (ing.isPasta) {
            const exactPasta = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactPasta) return;
            const anyPasta = pantry.find(p => p.group === 'Pasta' && p.amount > 0);
            if (anyPasta) {
              notes.push(`Joker: ${anyPasta.name} im Haus`);
              return;
            }
            if (ing.essential) missing.push(ing.name);
            return;
          }

          if (ing.isFond) {
            const exactFond = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactFond) return;
            const anyFond = pantry.find(p => p.group === 'Fond' && p.amount > 0);
            if (anyFond) {
              notes.push(`Joker: ${anyFond.name} statt ${ing.name}`);
              return;
            }
            if (ing.essential) missing.push(ing.name);
            return;
          }

          const found = pantry.find(p =>
            p.name.toLowerCase().includes(ing.name.toLowerCase()) ||
            ing.name.toLowerCase().includes(p.name.toLowerCase())
          );
          if (!found || found.status === 'empty' || (found.amount !== undefined && found.amount <= 0)) {
            if (ing.essential) missing.push(ing.name);
          } else {
            if (found.category === 'freezer_items' && found.subType === 'meat') {
              fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);
            }
            if (found.category === 'fridge' && found.expiryDays <= 2) {
              urgentFridgeItems.push(found.name);
            }
          }
        });

        return { missing, fromFreezerMeat, urgentFridgeItems, noteText: notes.join(' · ') };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => {
            const avail = checkRecipeAvailability(r);
            return { ...r, ...avail };
          })
          .filter(r => {
            if (filterMode === 'kid' && !r.isKidFriendly) return false;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;

            if (filterCalories === 'under150' && (r.kcalPer100g === undefined || r.kcalPer100g >= 150)) return false;
            if (filterCalories === '150to300' && (r.kcalPer100g === undefined || r.kcalPer100g < 150 || r.kcalPer100g > 300)) return false;
            if (filterCalories === 'over300' && (r.kcalPer100g === undefined || r.kcalPer100g <= 300)) return false;

            if (filterShopping === 'any_plan') return true;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_3' && r.missing.length > 3) return false;

            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            return b.lastCookedDaysAgo - a.lastCookedDaysAgo;
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterCalories, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {
        setMealPrep(prev => prev.map(mp => {
          if (mp.id !== mpId) return mp;
          const next500 = Math.max(0, mp.blocks500 + delta500);
          const next250 = Math.max(0, mp.blocks250 + delta250);
          if (label) showToast(`${mp.name}: ${label}`);
          return { ...mp, blocks500: next500, blocks250: next250 };
        }));
      };

      const handleCreateNewMealPrep = () => {
        if (!newMpName.trim()) return;
        const newId = 'mp_' + Date.now();
        const needsArray = newMpNeeds.split(',').map(s => s.trim()).filter(Boolean);

        const newEntry = {
          id: newId,
          name: newMpName.trim(),
          blocks500: Number(newMp500) || 0,
          blocks250: Number(newMp250) || 0,
          kcalPer100g: Number(newMpKcal) || 170,
          needsFresh: needsArray,
          prepTime: 20,
          season: 'all'
        };
        setMealPrep(prev => [newEntry, ...prev]);

        if (newMpCreateRecipe) {
          const newRec = {
            id: 'r_mp_' + Date.now(),
            title: `${newMpName.trim()} (aus dem TK)`,
            effort: 'quick',
            season: 'all',
            calories: 'normal',
            kcalPer100g: Number(newMpKcal) || 170,

            isMealPrep: true,
            mealPrepId: newId,
            isDraft: false,
            lastCookedDaysAgo: 30,
            prepTime: 20,
            ingredients: [
              { name: `${newMpName.trim()} (TK)`, amount: '500g oder 250g Block', essential: true, isFromMealPrep: newId },
              ...needsArray.map(n => ({ name: n, amount: 'Nach Bedarf', essential: true }))
            ],
            steps: [
              'Gewünschte Silikonform-Blöcke aus dem TK nehmen und schonend im Topf erwärmen.',
              needsArray.length > 0 ? `Dazu frisch zubereiten: ${needsArray.join(', ')}.` : 'Direkt heiß servieren.'
            ]

        setNewMpName('');
        setNewMp500(1);
        setNewMp250(0);
        setNewMpKcal(170);
        setNewMpNeeds('');

        showToast(`"${newEntry.name}" im TK hinterlegt!`);

      const handleAddPantryItem = () => {
        if (!newPantryName.trim()) return;

        const targetCat = newPantryCategory || (pantrySubTab === 'mealprep' ? 'pantry' : pantrySubTab);
        addOrUpdatePantryItem(newPantryName, amt, newPantryUnitType, targetCat, newPantryExpiry);
        setNewPantryName('');

      };

      const handleConfirmCooked = () => {
        if (!cookedModalRecipe) return;

        setRecipes(prev => prev.map(r =>
          r.id === cookedModalRecipe.id ? { ...r, lastCookedDaysAgo: 0 } : r
        ));

        setPantry(prev => prev.map(p => {
          if (p.id === 'p12') {
            const nextUses = (p.usesSinceOpen || 0) + 1;
            if (nextUses >= (p.maxUses || 20)) setOliveOilAlert(true);
            return { ...p, usesSinceOpen: nextUses };
          }
          return p;
        }));

        if (freezeLeftovers500 > 0 || freezeLeftovers250 > 0) {

      const selectedRecipe = recipes.find(r => r.id === selectedRecipeId);

      const addToMealPlan = (recipe) => {
        if (mealPlan.some(m => m.id === recipe.id)) {

        setMealPlan(prev => [...prev, recipe]);

        const avail = checkRecipeAvailability(recipe);
        const newShoppingItems = avail.missing

          }));

        if (newShoppingItems.length > 0) {

          showToast(`"${recipe.title}" gemerkt & ${newShoppingItems.length} Zutat(en) auf Einkaufsliste!`);
        } else {
          showToast(`"${recipe.title}" im Wochenplan gemerkt!`);
        }

      const removeFromMealPlan = (recipeId) => {
        setMealPlan(prev => prev.filter(m => m.id !== recipeId));

      const exportToBring = async () => {
        const itemsText = shoppingList.map(s => s.name).join('\n');
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(itemsText);
          }
        } catch (e) {}

        if (navigator.share) {
          try {
            await navigator.share({
              title: bringListName || 'Zuhause',
              text: itemsText
            });
            return;
          } catch (err) {}
        }

        showToast(`In Zwischenablage kopiert! Öffne Bring! (${bringListName})...`);
        setTimeout(() => {
          window.location.href = 'https://web.getbring.com';
        }, 600);
      };

      // DYNAMISCHER MODELL-CHECK (Fragt Google im Hintergrund nach dem passenden Modell, genau wie in deiner Pokédex-App!)
      const handleFileSelected = async (e, scanType = 'pantry') => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = '';

        const activeKey = (geminiKey || DEFAULT_GEMINI_KEY).trim();

        try {
          setIsAnalyzingPhoto(true);
          showToast('Foto wird verkleinert & Modell wird ermittelt...');
          const base64Data = await compressImageToBase64(file, 1024, 0.75);

          const prompt = scanType === 'recipe'
            ? `Analysiere diese abfotografierte Kochbuchseite und antworte NUR mit reinem JSON: {"title": "Name des Gerichts", "prepTime": 30, "kcalPer100g": 180, "ingredients": [{"name": "Zutat", "amount": "Menge"}], "steps": ["Schritt 1", "Schritt 2"]}`
            : `Erkenne das fotografierte Lebensmittel oder den Kassenbon auf dem Bild. Antworte NUR mit reinem JSON: {"items": [{"name": "Genauer Produktname (z.B. Mutti Passata)", "amount": 1, "unitType": "Flasche|Dosen|Stück|g|ml|Packung|Tube", "category": "pantry|fridge|freezer_items|sauces|spices", "expiryDays": 5}]}`;

          let response = null;
          let data = null;

          // 1. Hole im Hintergrund die Liste der verfügbaren Modelle, genau wie beim Pokédex!
          try {
            const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(activeKey)}`);
            const listData = await listRes.json();
            if (listData && listData.models) {
              // Finde das erste passende Flash-Modell, das Inhalte generieren kann
              const foundModel = listData.models.find(m => m.name.includes('flash') && m.supportedGenerationMethods?.includes('generateContent'));
              if (foundModel) {
                const modelName = foundModel.name.replace('models/', '');
                response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(activeKey)}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{
                      parts: [
                        { text: prompt },
                        { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                      ]
                    }]
                  })
                });
              }
            }
          } catch (modelListErr) {
            // Ignorieren und mit Fallback fortfahren
          }

          // 2. Fallback falls die automatische Erkennung fehlschlägt
          if (!response || !response.ok) {
            response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(activeKey)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                  ]
                }]
              })
            });
          }

          const result = await response.json();
          if (!response.ok || result.error) {
            throw new Error(result?.error?.message || `HTTP ${response.status}`);
          }

          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Kein Produkt im Bild erkannt');
          const parsed = JSON.parse(jsonMatch[0]);

          if (scanType === 'recipe' && parsed.title) {
            const newRec = {
              id: 'r_' + Date.now(),
              title: parsed.title,
              effort: (parsed.prepTime || 30) <= 30 ? 'quick' : 'elaborate',
              season: 'all',
              kcalPer100g: Number(parsed.kcalPer100g) || 180,
              isFamilyRecipe: true,
              isKidFriendly: false,
              isMealPrep: false,
              isDraft: false,
              lastCookedDaysAgo: 99,
              prepTime: Number(parsed.prepTime) || 30,
              ingredients: (parsed.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
              steps: parsed.steps || ['Aus Kochbuch gescannt.']
            };
            setRecipes(prev => [newRec, ...prev]);
            setSelectedRecipeId(newRec.id);
            setActiveTab('recipes');
            showToast(`Kochbuch-Rezept "${newRec.title}" eingescannt!`);
          } else if (parsed.items && parsed.items.length > 0) {
            parsed.items.forEach(it => {
              addOrUpdatePantryItem(it.name, it.amount || 1, it.unitType || 'Stück', it.category || 'pantry', it.expiryDays);
            });
          }
        } catch (err) {
          showToast(`Scan-Fehler: ${err.message.slice(0, 60)}`);
          setShowNewPantryItemModal(true);
        } finally {
          setIsAnalyzingPhoto(false);
        }
      };

      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Spracherkennung wird von diesem Browser nicht unterstützt.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          setVoiceText(transcript);
        };
        recognition.onend = () => setIsListening(false);
        recognition.onerror = () => setIsListening(false);
        recognition.start();
      };

      const executeVoiceCommand = (rawCmdText) => {
        if (!rawCmdText || !rawCmdText.trim()) return;
        const normalizedText = replaceGermanNumberWords(rawCmdText.trim());
        const text = normalizedText.toLowerCase();

        if (text.includes('haben wir') || text.includes('ist noch') || text.includes('gibt es')) {
          const queryItem = pantry.find(p => {
            const pWords = p.name.toLowerCase().split(/[\s()-]+/).filter(w => w.length > 2);
            return pWords.some(w => text.includes(w));
          });
          if (queryItem) {
            showToast(`${queryItem.name}: ${queryItem.amount !== undefined ? queryItem.amount + ' ' + queryItem.unitType : 'Auf Lager'} (${queryItem.status === 'empty' ? 'Leer!' : 'Da'})`);
          } else {
            showToast('Nicht im Bestand gefunden.');
          }
          setVoiceText('');
          setVoiceOverlay(false);
          return;
        }

        if (text.includes('eingefroren') || text.includes('silikonform')) {
          const newId = 'mp_' + Date.now();
          const dishName = normalizedText.split(/eingefroren/i)[0].replace(/ich habe|gerade|heute/gi, '').trim() || 'Neues Gericht';
          setMealPrep(prev => [{
            id: newId,
            name: dishName,
            blocks500: text.includes('2x 500') || text.includes('2 500') ? 2 : 1,
            blocks250: text.includes('250') ? 1 : 0,
            kcalPer100g: 170,
            needsFresh: [],
            prepTime: 20,
            season: 'all'
          }, ...prev]);
          showToast(`Im TK angelegt: ${dishName}`);
          setVoiceText('');
          setVoiceOverlay(false);
          return;
        }

        const numMatch = text.match(/(\d+(?:[.,]\d+)?)/);
        const amount = numMatch ? Number(numMatch[1].replace(',', '.')) : 1;

        let detectedUnit = 'Stück';
        if (/\b(flaschen|flasche)\b/i.test(text)) detectedUnit = 'Flasche';
        else if (/\b(dosen|dose)\b/i.test(text)) detectedUnit = 'Dosen';
        else if (/\b(gläser|glas)\b/i.test(text)) detectedUnit = 'Gläser';
        else if (/\b(tuben|tube)\b/i.test(text)) detectedUnit = 'Tube';
        else if (/\b(packungen|packung|paket|pakete)\b/i.test(text)) detectedUnit = 'Packung';
        else if (/\b(gramm|g)\b/i.test(text)) detectedUnit = 'g';
        else if (/\b(milliliter|ml)\b/i.test(text)) detectedUnit = 'ml';

        const isSettingAbsolute = /\b(noch|nur noch|auf)\b/i.test(text) && !/\b(füge|hinzu|gekauft|plus)\b/i.test(text);

        let cleanProductName = normalizedText
          .replace(/\b(füge|hinzu|bitte|zum|in|den|die|das|schrank|vorratsschrank|kühlschrank|tiefkühler|tk|vorrat|packe|lege|setze|stelle|ich|habe|wir|haben|gekauft|noch|nur|auf|flaschen|flasche|dosen|dose|gläser|glas|tuben|tube|packungen|packung|paket|pakete|stück|gramm|milliliter|ml|g)\b/gi, ' ')
          .replace(/\d+(?:[.,]\d+)?/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        const existingItem = pantry.find(p => {
          const pLower = p.name.toLowerCase();
          const cLower = cleanProductName.toLowerCase();
          return (cLower.length > 2 && (pLower.includes(cLower) || cLower.includes(pLower)));
        });

        if (existingItem && isSettingAbsolute && numMatch) {
          updatePantryAmount(existingItem.id, amount);
          showToast(`${existingItem.name} auf ${amount} ${existingItem.unitType} gesetzt!`);
        } else {
          let targetCategory = 'pantry';
          if (/kühlschrank|frisch|milch|sahne|butter|käse|hack/i.test(text)) targetCategory = 'fridge';
          else if (/tk|tiefkühl|gefrier|fischstäbchen|pommes/i.test(text)) targetCategory = 'freezer_items';
          else if (/soja|essig|balsamico|sauce/i.test(text)) targetCategory = 'sauces';
          else if (/gewürz|piment|nelken|muskat/i.test(text)) targetCategory = 'spices';

          addOrUpdatePantryItem(existingItem ? existingItem.name : (cleanProductName || rawCmdText), amount, detectedUnit, targetCategory);
        }

        setVoiceText('');
        setVoiceOverlay(false);
      };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
