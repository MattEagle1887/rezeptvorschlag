<html lang="de">

  <meta charset="UTF-8" />

  <meta name="theme-color" content="#1c1917" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Tailwind CSS -->

  <!-- React & ReactDOM -->

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel für JSX im Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Kleiner Icon-Wrapper für Lucide im Browser
    const Icon = ({ name, size = 18, className = "" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });
      return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
    };

    // --- START-DATEN ---
    const INITIAL_PANTRY = [

      { id: 'p7', name: 'Dosentomaten (San Marzano)', category: 'pantry', status: 'in_stock', count: 4, minCount: 2, unit: 'Dosen' },
      { id: 'p8', name: 'Risottoreis / Basmati', category: 'pantry', status: 'in_stock', group: 'Reis', unit: '1 kg' },

      { id: 'p13', name: 'Tomatenmark', category: 'basics', status: 'in_stock', usesSinceOpen: 5, maxUses: 10 },
      { id: 'p14', name: 'Hähnchenbrustfilet (TK)', category: 'freezer_items', status: 'in_stock', subType: 'meat', unit: '2x 400g' },
      { id: 'p15', name: 'Hackfleisch-Reserve (TK)', category: 'freezer_items', status: 'in_stock', subType: 'meat', unit: '2x 500g' },
      { id: 'p16', name: 'Merguez-Würstchen (TK)', category: 'freezer_items', status: 'in_stock', subType: 'meat', unit: '1 Packung' },
      { id: 'p17', name: 'Nürnberger Rostbratwürstchen (TK)', category: 'freezer_items', status: 'in_stock', subType: 'meat', unit: '1 Packung' },
      { id: 'p18', name: 'Fischstäbchen', category: 'freezer_items', status: 'in_stock', subType: 'kid', unit: '1 Packung' },
      { id: 'p19', name: 'Kartoffelpuffer', category: 'freezer_items', status: 'in_stock', subType: 'kid', unit: '1 Beutel' },
      { id: 'p20', name: 'Pommes Frites', category: 'freezer_items', status: 'in_stock', subType: 'kid', unit: '1 Beutel' },
      { id: 'p21', name: 'TK-Erbsen & Brokkoli', category: 'freezer_items', status: 'in_stock', subType: 'veggie', unit: 'je 1 Paket' }
    ];

    const INITIAL_MEAL_PREP = [
      { id: 'mp1', name: 'Ragù alla Bolognese', blocks500: 3, blocks250: 2, needsFresh: ['Spaghetti & Penne', 'Parmesan (am Stück)'], prepTime: 15, season: 'all' },
      { id: 'mp2', name: 'Grünkohl (fertig geschmort)', blocks500: 2, blocks250: 1, needsFresh: ['Kartoffeln', 'Mettenden / Kassler'], prepTime: 20, season: 'winter' },
      { id: 'mp3', name: 'Schmorkohl (Familienrezept)', blocks500: 2, blocks250: 0, needsFresh: ['Kartoffeln'], prepTime: 20, season: 'winter' },
      { id: 'mp4', name: 'Currysauce (Basis)', blocks500: 1, blocks250: 2, needsFresh: ['Hähnchenbrustfilet (TK)', 'Risottoreis / Basmati'], prepTime: 20, season: 'all' }
    ];

    const INITIAL_RECIPES = [
      {
        id: 'r1',
        title: 'Pasta al Limone',
        effort: 'quick',
        season: 'summer',
        isKidFriendly: false,
        isMealPrep: false,
        isDraft: false,
        lastCookedDaysAgo: 18,
        prepTime: 20,
        ingredients: [
          { name: 'Spaghetti & Penne', amount: '400 g Spaghetti', essential: true },
          { name: 'Zitronen (Bio)', amount: '2 Stück (Abrieb & Saft)', essential: true },
          { name: 'Parmesan (am Stück)', amount: '80 g fein gerieben', essential: true },
          { name: 'Butter', amount: '40 g (kalt)', essential: true },
          { name: 'Olivenöl Extra Vergine', amount: '3 EL', essential: true },
          { name: 'Zwiebeln & Knoblauch', amount: '1 Knoblauchzehe (angedrückt)', essential: false }
        ],
        steps: [
          'Spaghetti in reichlich (nur leicht gesalzenem) Wasser sehr al dente kochen.',
          'Knoblauch in Olivenöl sanft ziehen lassen, Zitronenabrieb kurz mitwärmen, dann Knoblauch entfernen.',
          'Tropfnasse Pasta direkt in die Pfanne geben. Reichlich stärkehaltiges Nudelwasser, kalte Butter, Zitronensaft und Parmesan kräftig unterschwenken, bis eine glänzende Emulsion entsteht.'
        ]
      },
      {
        id: 'r2',
        title: 'Klassisches Rindergulasch',
        effort: 'elaborate',
        season: 'winter',
        isKidFriendly: false,
        isMealPrep: false,
        isDraft: true,
        lastCookedDaysAgo: 185,
        prepTime: 150,
        ingredients: [
          { name: 'Rindergulasch', amount: 'Beim Kochen abwiegen', essential: true },
          { name: 'Zwiebeln & Knoblauch', amount: 'Große Menge (ca. 1:1 zum Fleisch)', essential: true },
          { name: 'Tomatenmark', amount: 'Nach Gefühl', essential: true },
          { name: 'Rinderfond / Gemüsebrühe', amount: 'Zum Aufgießen', essential: true },
          { name: 'Olivenöl Extra Vergine', amount: 'Zum Anbraten', essential: true }
        ],
        steps: [
          'Kopf-Rezept (Entwurf): Beim nächsten Kochen über das Mikrofon die genauen Mengen einsprechen.'
        ]
      },
      {
        id: 'r3',
        title: 'Ragù aus dem TK mit frischer Pasta',
        effort: 'quick',
        season: 'all',
        isKidFriendly: true,
        isMealPrep: true,
        mealPrepId: 'mp1',
        isDraft: false,
        lastCookedDaysAgo: 12,
        prepTime: 15,
        ingredients: [
          { name: 'Ragù alla Bolognese (TK)', amount: '500g oder 750g Block', essential: true, isFromMealPrep: 'mp1' },
          { name: 'Spaghetti & Penne', amount: '400 g', essential: true },
          { name: 'Parmesan (am Stück)', amount: 'Zum Reiben', essential: true }
        ],
        steps: [
          'Gewünschte Silikonform-Blöcke (z. B. 500g oder 750g) schonend im Topf mit einem Schuss Wasser erwärmen.',
          'Pasta al dente kochen, direkt mit dem Ragù vermengen und mit reichlich Parmesan servieren.'
        ]
      },
      {
        id: 'r4',
        title: 'Currysauce (TK) mit Hähnchen & Reis',
        effort: 'quick',
        season: 'all',
        isKidFriendly: true,
        isMealPrep: true,
        mealPrepId: 'mp4',
        isDraft: false,
        lastCookedDaysAgo: 34,
        prepTime: 25,
        ingredients: [
          { name: 'Currysauce (Basis) (TK)', amount: '500g Block', essential: true, isFromMealPrep: 'mp4' },
          { name: 'Hähnchenbrustfilet (TK)', amount: '400 g', essential: true },
          { name: 'Risottoreis / Basmati', amount: '250 g Basmatireis', essential: true }
        ],
        steps: [
          'Hähnchenbrust (rechtzeitig aus dem TK nehmen) in Streifen schneiden und scharf anbraten.',
          'Gefrorene Currysauce dazugeben und köcheln lassen, während der Reis gart.'
        ]
      },
      {
        id: 'r5',
        title: 'Fischstäbchen mit Pommes & TK-Erbsen',
        effort: 'quick',
        season: 'all',
        isKidFriendly: true,
        isKidOnlyFastDay: true,
        isMealPrep: false,
        isDraft: false,
        lastCookedDaysAgo: 9,
        prepTime: 20,
        ingredients: [
          { name: 'Fischstäbchen', amount: '6–8 Stück', essential: true },
          { name: 'Pommes Frites', amount: '1 Portion', essential: true },
          { name: 'TK-Erbsen & Brokkoli', amount: '1 Handvoll Erbsen', essential: true }
        ],
        steps: [
          'Pommes und Fischstäbchen im Ofen oder der Heißluftfritteuse knusprig backen.',
          'TK-Erbsen kurz in heißem Wasser mit einem Stückchen Butter ziehen lassen.'
        ]
      },
      {
        id: 'r6',
        title: 'Kartoffelpuffer mit Apfelmus',
        effort: 'quick',
        season: 'all',
        isKidFriendly: true,
        isKidOnlyFastDay: true,
        isMealPrep: false,
        isDraft: false,
        lastCookedDaysAgo: 21,
        prepTime: 15,
        ingredients: [
          { name: 'Kartoffelpuffer', amount: '3–4 Stück (TK)', essential: true },
          { name: 'Apfelmus (Glas)', amount: '1 Schälchen', essential: true }
        ],
        steps: [
          'Kartoffelpuffer in der Pfanne mit etwas Öl von beiden Seiten goldbraun braten.',
          'Mit kaltem Apfelmus servieren.'
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('decide');

      // LocalStorage Anbindung (speichert auf dem Handy!)
      const [pantry, setPantry] = useState(() => {
        const saved = localStorage.getItem('kueche_pantry');
        return saved ? JSON.parse(saved) : INITIAL_PANTRY;
      });
      const [mealPrep, setMealPrep] = useState(() => {
        const saved = localStorage.getItem('kueche_mealprep');
        return saved ? JSON.parse(saved) : INITIAL_MEAL_PREP;
      });
      const [recipes, setRecipes] = useState(() => {
        const saved = localStorage.getItem('kueche_recipes');
        return saved ? JSON.parse(saved) : INITIAL_RECIPES;
      });
      const [shoppingList, setShoppingList] = useState(() => {
        const saved = localStorage.getItem('kueche_shopping');
        return saved ? JSON.parse(saved) : [
          { id: 's1', name: 'Frischer Rosmarin & Thymian', reason: 'Wird knapp', done: false }
        ];
      });

      useEffect(() => { localStorage.setItem('kueche_pantry', JSON.stringify(pantry)); }, [pantry]);
      useEffect(() => { localStorage.setItem('kueche_mealprep', JSON.stringify(mealPrep)); }, [mealPrep]);
      useEffect(() => { localStorage.setItem('kueche_recipes', JSON.stringify(recipes)); }, [recipes]);
      useEffect(() => { localStorage.setItem('kueche_shopping', JSON.stringify(shoppingList)); }, [shoppingList]);

      // Filter States
      const [filterEffort, setFilterEffort] = useState('all');
      const [filterShopping, setFilterShopping] = useState('all_here');
      const [filterMode, setFilterMode] = useState('normal');
      const [currentSuggestionIndex, setCurrentSuggestionIndex] = useState(0);

      // Sub-Views & Modals
      const [pantrySubTab, setPantrySubTab] = useState('mealprep');
      const [selectedRecipeId, setSelectedRecipeId] = useState(null);
      const [isEditingRecipe, setIsEditingRecipe] = useState(false);
      const [newIngredientName, setNewIngredientName] = useState('');
      const [newIngredientAmount, setNewIngredientAmount] = useState('');
      const [newStepText, setNewStepText] = useState('');

      const [showAddMealPrepModal, setShowAddMealPrepModal] = useState(false);
      const [newMpName, setNewMpName] = useState('');
      const [newMp500, setNewMp500] = useState(1);
      const [newMp250, setNewMp250] = useState(0);
      const [newMpNeeds, setNewMpNeeds] = useState('');
      const [newMpCreateRecipe, setNewMpCreateRecipe] = useState(true);

      const [showNewPantryItemModal, setShowNewPantryItemModal] = useState(false);
      const [newPantryName, setNewPantryName] = useState('');
      const [newPantryUnit, setNewPantryUnit] = useState('');
      const [newPantryExpiry, setNewPantryExpiry] = useState(5);

      const [cookedModalRecipe, setCookedModalRecipe] = useState(null);
      const [freezeLeftovers500, setFreezeLeftovers500] = useState(0);
      const [freezeLeftovers250, setFreezeLeftovers250] = useState(0);
      const [oliveOilAlert, setOliveOilAlert] = useState(false);

      const [voiceOverlay, setVoiceOverlay] = useState(false);
      const [voiceText, setVoiceText] = useState('');
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Rezept-Verfügbarkeit prüfen
      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];

        recipe.ingredients.forEach((ing) => {
          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? (mp.blocks500 * 500 + mp.blocks250 * 250) : 0;
            if (totalGrams === 0) missing.push(ing.name);
            return;
          }
          const found = pantry.find(p =>
            p.name.toLowerCase().includes(ing.name.toLowerCase()) ||
            ing.name.toLowerCase().includes(p.name.toLowerCase())
          );
          if (!found || found.status === 'empty') {
            if (ing.essential) missing.push(ing.name);
          } else {
            if (found.category === 'freezer_items' && found.subType === 'meat') {
              fromFreezerMeat.push(found.name);
            }
            if (found.category === 'fridge' && found.expiryDays <= 2) {
              urgentFridgeItems.push(found.name);
            }
          }
        });

        return { missing, fromFreezerMeat, urgentFridgeItems };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => {
            const avail = checkRecipeAvailability(r);
            return { ...r, ...avail };
          })
          .filter(r => {
            if (filterMode === 'kid') return r.isKidOnlyFastDay || r.isKidFriendly;
            if (filterMode === 'mealprep') return r.isMealPrep;
            if (r.isKidOnlyFastDay) return false;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_1_2' && r.missing.length > 2) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            return b.lastCookedDaysAgo - a.lastCookedDaysAgo;
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      // Meal-Prep Blöcke ändern
      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {
        setMealPrep(prev => prev.map(mp => {
          if (mp.id !== mpId) return mp;
          const next500 = Math.max(0, mp.blocks500 + delta500);
          const next250 = Math.max(0, mp.blocks250 + delta250);
          if (label) showToast(`${mp.name}: ${label}`);
          return { ...mp, blocks500: next500, blocks250: next250 };
        }));
      };

      const handleCreateNewMealPrep = () => {
        if (!newMpName.trim()) return;
        const newId = 'mp_' + Date.now();
        const needsArray = newMpNeeds.split(',').map(s => s.trim()).filter(Boolean);

        const newEntry = {
          id: newId,
          name: newMpName.trim(),
          blocks500: Number(newMp500) || 0,
          blocks250: Number(newMp250) || 0,
          needsFresh: needsArray,
          prepTime: 20,
          season: 'all'
        };
        setMealPrep(prev => [newEntry, ...prev]);

        if (newMpCreateRecipe) {
          const newRec = {
            id: 'r_mp_' + Date.now(),
            title: `${newMpName.trim()} (aus dem TK)`,
            effort: 'quick',
            season: 'all',
            isKidFriendly: true,
            isMealPrep: true,
            mealPrepId: newId,
            isDraft: false,
            lastCookedDaysAgo: 30,
            prepTime: 20,
            ingredients: [
              { name: `${newMpName.trim()} (TK)`, amount: '500g oder 250g Block', essential: true, isFromMealPrep: newId },
              ...needsArray.map(n => ({ name: n, amount: 'Nach Bedarf', essential: true }))
            ],
            steps: [
              'Gewünschte Silikonform-Blöcke aus dem TK nehmen und schonend im Topf erwärmen.',
              needsArray.length > 0 ? `Dazu frisch zubereiten: ${needsArray.join(', ')}.` : 'Direkt heiß servieren.'
            ]
          };
          setRecipes(prev => [newRec, ...prev]);
        }

        setNewMpName('');
        setNewMp500(1);
        setNewMp250(0);
        setNewMpNeeds('');
        setShowAddMealPrepModal(false);
        showToast(`"${newEntry.name}" im TK hinterlegt!`);
      };

      const handleAddPantryItem = () => {
        if (!newPantryName.trim()) return;
        const newItem = {
          id: 'p_' + Date.now(),
          name: newPantryName.trim(),
          category: pantrySubTab,
          status: 'in_stock',
          unit: newPantryUnit.trim() || '1 Packung',
          ...(pantrySubTab === 'fridge' ? { expiryDays: Number(newPantryExpiry) || 5 } : {}),
          ...(pantrySubTab === 'freezer_items' ? { subType: 'meat' } : {}),
          ...(pantrySubTab === 'basics' ? { usesSinceOpen: 0, maxUses: 20 } : {})
        };
        setPantry(prev => [newItem, ...prev]);
        setNewPantryName('');
        setNewPantryUnit('');
        setShowNewPantryItemModal(false);
        showToast(`${newItem.name} hinzugefügt!`);
      };

      const handleConfirmCooked = () => {
        if (!cookedModalRecipe) return;

        setRecipes(prev => prev.map(r =>
          r.id === cookedModalRecipe.id ? { ...r, lastCookedDaysAgo: 0 } : r
        ));

        setPantry(prev => prev.map(p => {
          if (p.id === 'p11') {
            const nextUses = p.usesSinceOpen + 1;
            if (nextUses >= p.maxUses) setOliveOilAlert(true);
            return { ...p, usesSinceOpen: nextUses };
          }
          return p;
        }));

        if (freezeLeftovers500 > 0 || freezeLeftovers250 > 0) {
          const existingMp = mealPrep.find(m =>
            m.id === cookedModalRecipe.mealPrepId ||
            m.name.toLowerCase().includes(cookedModalRecipe.title.toLowerCase()) ||
            cookedModalRecipe.title.toLowerCase().includes(m.name.toLowerCase())
          );

          if (existingMp) {
            updateMealPrepBlocks(existingMp.id, freezeLeftovers500, freezeLeftovers250);
          } else {
            const newId = 'mp_' + Date.now();
            setMealPrep(prev => [{
              id: newId,
              name: cookedModalRecipe.title,
              blocks500: freezeLeftovers500,
              blocks250: freezeLeftovers250,
              needsFresh: [],
              prepTime: 20,
              season: 'all'
            }, ...prev]);
          }
          showToast(`Reste (${freezeLeftovers500 * 500 + freezeLeftovers250 * 250}g) im TK gespeichert!`);
        } else {
          showToast(`"${cookedModalRecipe.title}" als gekocht markiert!`);
        }

        setFreezeLeftovers500(0);
        setFreezeLeftovers250(0);
        setCookedModalRecipe(null);
      };

      // Rezept-Editor Funktionen
      const selectedRecipe = recipes.find(r => r.id === selectedRecipeId);

      const deleteIngredientFromRecipe = (recipeId, ingIndex) => {
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          const removed = r.ingredients[ingIndex];
          const nextIngs = r.ingredients.filter((_, idx) => idx !== ingIndex);
          if (removed) showToast(`"${removed.name}" gelöscht`);
          return { ...r, ingredients: nextIngs };
        }));
      };

      const addIngredientToRecipe = (recipeId) => {
        if (!newIngredientName.trim()) return;
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          return {
            ...r,
            ingredients: [
              ...r.ingredients,
              { name: newIngredientName.trim(), amount: newIngredientAmount.trim() || 'Nach Bedarf', essential: true }
            ]
          };
        }));
        setNewIngredientName('');
        setNewIngredientAmount('');
        showToast('Zutat hinzugefügt');
      };

      const deleteStepFromRecipe = (recipeId, stepIndex) => {
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          return { ...r, steps: r.steps.filter((_, idx) => idx !== stepIndex) };
        }));
      };

      const addStepToRecipe = (recipeId) => {
        if (!newStepText.trim()) return;
        setRecipes(prev => prev.map(r => {
          if (r.id !== recipeId) return r;
          const cleanSteps = r.isDraft ? [] : r.steps;
          return {
            ...r,
            isDraft: false,
            steps: [...cleanSteps, newStepText.trim()]
          };
        }));
        setNewStepText('');
        showToast('Zubereitungsschritt gespeichert');
      };

      // Echte Web-Speech-API + Sprachbefehle
      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Bitte nutze das Textfeld unten oder Chrome/Safari für Sprache.');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setVoiceText(transcript);
        };
        recognition.start();
        showToast('Höre zu...');
      };

      const executeVoiceCommand = (cmdText) => {
        const text = cmdText.toLowerCase();
        if (text.includes('eingefroren') || text.includes('silikonform')) {
          const newId = 'mp_' + Date.now();

                  </div>
                ) : (
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-semibold text-stone-900">Eure Rezepte ({recipes.length})</h3>
                      <button
                        onClick={() => {
                          const title = prompt('Name des neuen Gerichts (z.B. Chili con Carne):');
                          if (!title) return;
                          const newRec = {
                            id: 'r_' + Date.now(),
                            title,
                            effort: 'quick',
                            season: 'all',
                            isKidFriendly: false,
                            isMealPrep: false,
                            isDraft: true,
                            lastCookedDaysAgo: 99,
                            prepTime: 30,
                            ingredients: [],
                            steps: ['Noch kein Rezepttext hinterlegt. Beim Kochen ergänzen!']
                          };
                          setRecipes(prev => [newRec, ...prev]);
                          setSelectedRecipeId(newRec.id);
                          setIsEditingRecipe(true);
                        }}
                        className="flex items-center gap-1 bg-stone-900 text-white px-3 py-1.5 rounded-lg text-xs font-medium"
                      >
                        <Icon name="plus" size={14} />
                        <span>Neues Gericht</span>
                      </button>
                    </div>

                    {recipes.map(r => (
                      <div
                        key={r.id}
                        onClick={() => setSelectedRecipeId(r.id)}
                        className="bg-white border border-stone-200 rounded-xl p-3.5 flex items-center justify-between cursor-pointer hover:border-stone-400 transition"
                      >
                        <div>
                          <div className="flex items-center gap-2">
                            <h4 className="text-sm font-semibold text-stone-900">{r.title}</h4>
                            {r.isDraft && (
                              <span className="text-[10px] px-2 py-0.5 rounded bg-stone-100 text-stone-600 font-medium">
                                Kopf-Rezept
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-stone-500 mt-0.5">
                            {r.ingredients.length} Zutaten · Vor {r.lastCookedDaysAgo} Tagen gekocht
                          </p>
                        </div>
                        <Icon name="chevron-right" size={18} className="text-stone-400" />
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 4: EINKAUF */}
            {activeTab === 'shopping' && (
              <div className="space-y-3">
                <h3 className="text-sm font-semibold text-stone-900">Einkaufsliste</h3>
                <div className="bg-white border border-stone-200 rounded-xl divide-y divide-stone-100">
                  {shoppingList.map(item => (
                    <div key={item.id} className="p-3.5 flex items-center justify-between">
                      <div>
                        <p className="text-sm font-medium text-stone-900">{item.name}</p>
                        <p className="text-xs text-stone-500">{item.reason}</p>
                      </div>
                      <button
                        onClick={() => {
                          setShoppingList(prev => prev.filter(s => s.id !== item.id));
                          showToast(`${item.name} abgehakt!`);
                        }}
                        className="px-3 py-1.5 rounded-lg bg-stone-900 text-white text-xs font-medium"
                      >
                        Gekauft
                      </button>
                    </div>
                  ))}
                  {shoppingList.length === 0 && (
                    <p className="p-6 text-center text-xs text-stone-500">Alles auf Lager – nichts einzukaufen.</p>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* MODAL: NEUES MEAL-PREP */}
          {showAddMealPrepModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Neues Meal-Prep einfrieren</h3>
                  <button onClick={() => setShowAddMealPrepModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">Gericht / Sauce</label>
                    <input
                      type="text"
                      placeholder="z.B. Chili con Carne, Hühnerfrikassee..."
                      value={newMpName}
                      onChange={e => setNewMpName(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-stone-50 border border-stone-200 rounded-lg p-3">
                      <label className="text-xs font-semibold text-stone-800 block mb-1">500 g Formen</label>
                      <input
                        type="number"
                        min="0"
                        value={newMp500}
                        onChange={e => setNewMp500(e.target.value)}
                        className="w-full bg-white border border-stone-300 rounded px-2 py-1.5 text-sm font-semibold"
                      />
                    </div>
                    <div className="bg-stone-50 border border-stone-200 rounded-lg p-3">
                      <label className="text-xs font-semibold text-stone-800 block mb-1">250 g Formen</label>
                      <input
                        type="number"
                        min="0"
                        value={newMp250}
                        onChange={e => setNewMp250(e.target.value)}
                        className="w-full bg-white border border-stone-300 rounded px-2 py-1.5 text-sm font-semibold"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-medium text-stone-700 block mb-1">
                      Was braucht man beim Auftauen frisch dazu? (Optional)
                    </label>
                    <input
                      type="text"
                      placeholder="z.B. Reis, Pasta, Kartoffeln"
                      value={newMpNeeds}
                      onChange={e => setNewMpNeeds(e.target.value)}
                      className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                    />
                  </div>
                </div>

                <button
                  onClick={handleCreateNewMealPrep}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Im Tiefkühler speichern
                </button>
              </div>
            </div>
          )}

          {/* MODAL: NEUER VORRAT */}
          {showNewPantryItemModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Vorrat hinzufügen</h3>
                  <button onClick={() => setShowNewPantryItemModal(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                <div className="space-y-3">
                  <input
                    type="text"
                    placeholder="Bezeichnung (z.B. Merguez, Sahne...)"
                    value={newPantryName}
                    onChange={e => setNewPantryName(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                  />
                  <input
                    type="text"
                    placeholder="Menge / Einheit (z.B. 2 Packungen)"
                    value={newPantryUnit}
                    onChange={e => setNewPantryUnit(e.target.value)}
                    className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                  />
                  {pantrySubTab === 'fridge' && (
                    <div>
                      <label className="text-xs text-stone-600 block mb-1">Haltbar noch (Tage):</label>
                      <input
                        type="number"
                        value={newPantryExpiry}
                        onChange={e => setNewPantryExpiry(e.target.value)}
                        className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                  )}
                </div>
                <button
                  onClick={handleAddPantryItem}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Speichern
                </button>
              </div>
            </div>
          )}

          {/* MODAL: HEUTE GEKOCHT + RESTE EINFRIEREN */}
          {cookedModalRecipe && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Heute gekocht: {cookedModalRecipe.title}</h3>
                  <button onClick={() => setCookedModalRecipe(null)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="bg-stone-50 border border-stone-200 rounded-xl p-3.5 space-y-2.5">
                  <p className="text-xs font-semibold text-stone-800">
                    Reste in Silikonformen eingefroren?
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 500 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers500(Math.max(0, freezeLeftovers500 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers500}</span>
                        <button onClick={() => setFreezeLeftovers500(freezeLeftovers500 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                    <div className="bg-white border border-stone-200 rounded-lg p-2 flex items-center justify-between">
                      <span className="text-xs font-medium">+ 250 g</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setFreezeLeftovers250(Math.max(0, freezeLeftovers250 - 1))} className="w-6 h-6 rounded bg-stone-100 text-xs">-</button>
                        <span className="text-xs font-semibold">{freezeLeftovers250}</span>
                        <button onClick={() => setFreezeLeftovers250(freezeLeftovers250 + 1)} className="w-6 h-6 rounded bg-stone-900 text-white text-xs">+</button>
                      </div>
                    </div>
                  </div>
                </div>

                <button
                  onClick={handleConfirmCooked}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Bestätigen & Historie aktualisieren
                </button>
              </div>
            </div>
          )}

          {/* MODAL: SPRACHBEFEHL */}
          {voiceOverlay && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold text-stone-900">Sprach-Assistent</h3>
                  <button onClick={() => setVoiceOverlay(false)} className="text-stone-400">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <button
                  onClick={startListening}
                  className="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-900 rounded-xl text-xs font-semibold flex items-center justify-center gap-2"
                >
                  <Icon name="mic" size={16} />
                  <span>Mikrofon starten (Sprechen)</span>
                </button>

                <input
                  type="text"
                  placeholder="Oder Befehl hier eintippen..."
                  value={voiceText}
                  onChange={e => setVoiceText(e.target.value)}
                  className="w-full border border-stone-300 rounded-lg px-3 py-2 text-xs"
                />

                <button
                  onClick={() => executeVoiceCommand(voiceText)}
                  className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                >
                  Ausführen
                </button>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 grid grid-cols-4 py-2 z-30">
            {[
              { id: 'decide', label: 'Heute kochen', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte & TK', icon: 'archive' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => {
              const active = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex flex-col items-center gap-1 py-1 text-[11px] font-medium ${
                    active ? 'text-stone-900' : 'text-stone-400'
                  }`}
                >
                  <Icon name={item.icon} size={18} />
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
