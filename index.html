<body class="bg-[#1c1917] text-stone-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, memo } = React;

    // SICHERHEIT: Keine öffentlichen Zugangsdaten im Quellcode!
    const DEFAULT_GEMINI_KEY = "";
    const DEFAULT_FIREBASE_URL = "";

    // Reihenfolge der Tabs für die untere Leiste & die Wisch-Steuerung (Start in der Mitte)
    const TAB_ORDER = ['decide', 'pantry', 'home', 'recipes', 'shopping'];

    // Performance-optimierte Icon-Komponente
    const Icon = memo(({ name, size = 18, className = "" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
          window.lucide.createIcons({
            root: spanRef.current,
            attrs: { width: size, height: size, class: `inline-block ${className}` }
          });
        }
      }, [name, size, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
    });

    // Hilfsfunktionen für Haltbarkeitsdaten (MHD)
    const getFutureDateStr = (daysToAdd) => {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + Number(daysToAdd));
      return d.toISOString().split('T')[0];
    };

    const getDaysUntilExpiry = (item) => {
      if (!item) return undefined;
      if (item.expiryDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(item.expiryDate + 'T00:00:00');
        return Math.round((target - today) / (1000 * 60 * 60 * 24));
      }
      if (item.expiryDays !== undefined && item.expiryDays !== null && item.expiryDays !== '') {
        return Number(item.expiryDays);
      }
      return undefined;
    };

    const formatExpiryBadge = (days, expiryDateStr) => {
      if (days === undefined) return null;
      let dateHint = '';
      if (expiryDateStr) {
        const parts = expiryDateStr.split('-');
        if (parts.length === 3) dateHint = ` (${parts[2]}.${parts[1]}.)`;
      }
      if (days < 0) return { text: `Abgelaufen seit ${Math.abs(days)} T.${dateHint}`, urgent: true, expired: true };
      if (days === 0) return { text: `Läuft HEUTE ab!${dateHint}`, urgent: true, expired: false };
      if (days === 1) return { text: `Nur noch 1 Tag (Morgen)${dateHint}`, urgent: true, expired: false };
      if (days === 2) return { text: `Noch 2 Tage${dateHint}`, urgent: true, expired: false };
      return { text: `Noch ${days} Tage${dateHint}`, urgent: false, expired: false };
    };

    // Saubere Einzahl/Mehrzahl-Bezeichnung für Gebinde (Glas, Dose, Flasche, Packung, Tube...)
    const formatContainerLabel = (containerType, count = 1) => {
      const c = containerType || 'Packung';
      const isPlural = Number(count) !== 1;
      const map = {
        'Packung': isPlural ? 'Packungen' : 'Packung',
        'Glas': isPlural ? 'Gläser' : 'Glas',
        'Gläser': isPlural ? 'Gläser' : 'Glas',
        'Dose': isPlural ? 'Dosen' : 'Dose',
        'Dosen': isPlural ? 'Dosen' : 'Dose',
        'Flasche': isPlural ? 'Flaschen' : 'Flasche',
        'Tube': isPlural ? 'Tuben' : 'Tube',
        'Becher': isPlural ? 'Becher' : 'Becher',
        'Stück': isPlural ? 'Stück' : 'Stück',
        'Topf': isPlural ? 'Töpfe' : 'Topf'
      };
      return map[c] || c;
    };

    // Berechnet die Gesamtsumme beim Packungs-Baukasten
    const calcPacksSummary = (packs) => {
      if (!Array.isArray(packs) || packs.length === 0) return null;
      const totalAmount = packs.reduce((acc, p) => acc + (Number(p.count) || 0) * (Number(p.size) || 0), 0);
      const totalPacks = packs.reduce((acc, p) => acc + (Number(p.count) || 0), 0);
      const unit = packs[0]?.unit || 'g';
      return { totalAmount, totalPacks, unit };
    };

    // Liest benötigte Gramm / Milliliter aus einem Rezept-Mengentext aus (z.B. "500 g" -> { val: 500, unit: 'g' })
    const parseRequiredAmount = (amountStr) => {
      if (!amountStr) return null;
      const str = String(amountStr).toLowerCase().replace(',', '.');
      const matchKg = str.match(/(\d+(?:\.\d+)?)\s*kg\b/);
      if (matchKg) return { val: Math.round(parseFloat(matchKg[1]) * 1000), unit: 'g' };
      const matchG = str.match(/(\d+(?:\.\d+)?)\s*(?:g|gramm)\b/);
      if (matchG) return { val: Math.round(parseFloat(matchG[1])), unit: 'g' };
      const matchL = str.match(/(\d+(?:\.\d+)?)\s*(?:l|liter)\b/);
      if (matchL) return { val: Math.round(parseFloat(matchL[1]) * 1000), unit: 'ml' };
      const matchMl = str.match(/(\d+(?:\.\d+)?)\s*ml\b/);
      if (matchMl) return { val: Math.round(parseFloat(matchMl[1])), unit: 'ml' };
      return null;
    };

    // Deutsche Singular- & Synonym-Normalisierung für Lebensmittel
    const normalizeGermanFoodWord = (word) => {
      let w = (word || '').toLowerCase().trim();
      if (!w) return '';

      const synonymMap = {
        'eier': 'ei',
        'eiern': 'ei',
        'eigelb': 'ei',
        'möhren': 'karotte',
        'möhre': 'karotte',
        'karotten': 'karotte',
        'mohrrüben': 'karotte',
        'frühlingszwiebeln': 'frühlingszwiebel',
        'lauchzwiebeln': 'frühlingszwiebel',
        'lauchzwiebel': 'frühlingszwiebel',
        'schlagsahne': 'sahne',
        'süßrahm': 'sahne',
        'stangensellerie': 'staudensellerie',
        'knoblauchzehen': 'knoblauch',
        'knoblauchzehe': 'knoblauch',
        'parmigiano': 'parmesan',
        'pecorino': 'pecorino',
        'meersalz': 'salz',
        'speisesalz': 'salz',
        'jodsalz': 'salz',
        'steinsalz': 'salz',
        'pfefferkörner': 'pfeffer',
        'pfefferkorn': 'pfeffer',
        'kapernäpfel': 'kaper',
        'kapern': 'kaper',
        'cannellinibohnen': 'cannellini bohne',
        'kidneybohnen': 'kidney bohne'
      };
      if (synonymMap[w]) return synonymMap[w];

      if (w.length > 5 && (w.endsWith('zwiebeln') || w.endsWith('kartoffeln') || w.endsWith('nudeln') || w.endsWith('tomaten') || w.endsWith('zitronen') || w.endsWith('limetten') || w.endsWith('nelken') || w.endsWith('beeren') || w.endsWith('bohnen') || w.endsWith('linsen') || w.endsWith('erbsen') || w.endsWith('gurken') || w.endsWith('schalotten') || w.endsWith('oliven') || w.endsWith('kapern'))) {
        return w.slice(0, -1);
      }
      if (w.length > 5 && w.endsWith('äpfel')) {
        return w.replace('äpfel', 'apfel');
      }
      return w;
    };

    // PRÄZISER & ALLTAGSTAUGLICHER ZUTATEN-ABGLEICH
    // Ignoriert Farben/Größen/Schnittformen (z.B. "kleine Kapern" == "Kapern", "Pfeffer schwarz" == "Pfeffer"),
    // trennt aber weiterhin strikt echte Unterschiede (z.B. "Salz" != "Pommesgewürz Salz", "Guanciale" != "Sugo con Guanciale")!
    const isIngredientMatchingPantry = (pantryName, ingName) => {
      const pRaw = (pantryName || '').trim().toLowerCase();
      const iRaw = (ingName || '').trim().toLowerCase();
      if (!pRaw || !iRaw) return false;
      if (pRaw === iRaw) return true;

      // 1. Klammerzusätze sowie Farben, Größen, Schnittformen und Kochbuch-Adjektive herausfiltern
      const cleanNeutralWords = (str) => str
        .replace(/\s*\(.*?\)\s*/g, ' ')
        .replace(/\b(frisch|frische|frischer|frisches|bio|tk|tiefgekühlt|tiefgekühlte|fein|feiner|feines|grob|grober|grobes|gemahlen|gemahlener|gemahlenes|geschrotet|geschroteter|ganz|ganze|ganzer|ganzes|extra|vergine|nativ|natives|glatte|glatter|krause|getrocknet|getrocknete|getrockneter|gerieben|geriebener|geriebenes|kalt|kalte|kalter|warm|warme|lauwarm|lauwarme|zimmerwarm|zimmerwarme|mittelscharf|mittelscharfer|scharf|scharfer|scharfe|milder|mild|milde|süß|süßer|süße|edelsüß|edelsüßer|rosenscharf|schwarz|schwarzer|schwarze|schwarzes|weiß|weißer|weiße|weißes|rote|roter|rotes|rot|grün|grüner|grüne|grünes|gelb|gelber|gelbe|gelbes|braun|brauner|braune|braunes|bunt|bunter|bunte|hell|heller|helle|dunkel|dunkler|dunkle|klein|kleine|kleiner|kleines|groß|große|großer|großes|mittelgroß|mittelgroße|dicke|dünne|junge|gehackt|gehackte|gehackter|gewürfelt|gewürfelte|geschnitten|geschnittene|geschält|geschälte|ungeschält|ungeschälte|gestückelt|gestückelte|passiert|passierte|abgetropft|abgetropfte|eingelegt|eingelegte|gekocht|gekochte|roh|rohe|roher|reif|reife|weich|weiche|festkochend|festkochende|mehligkochend|mehligkochende|entsteint|entsteinte|ohne stein|ohne kerne|etwas|prise|nach geschmack|nach bedarf|zum braten|zum kochen|zum ablöschen|aus der mühle)\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const pClean = cleanNeutralWords(pRaw);
      const iClean = cleanNeutralWords(iRaw);
      if (!pClean || !iClean) return false;
      if (pClean === iClean) return true;

      // 2. Schutzregel gegen zusammengesetzte Fertigprodukte, Saucen & Gewürzmischungen:
      // (Verhindert z.B. "Salz" <-> "Pommesgewürz Salz" oder "Guanciale" <-> "Sugo con Guanciale")
      const compoundSauceOrSpiceRegex = /\b(sugo|pesto|sauce|soße|pastasauce|tomatensauce|nudelsoße|suppe|fond|brühe|bouillon|creme|aufstrich|gewürz|pommesgewürz|gewürzmischung|gewürzsalz|kräutersalz|knoblauchsalz|rauchsalz|selleriesalz|zwiebelsalz|curry|paste|mark|tomatenmark|ketchup|senf|mayo|mayonnaise|apfelmus)\b/i;
      if (compoundSauceOrSpiceRegex.test(pClean) !== compoundSauceOrSpiceRegex.test(iClean)) {
        return false;
      }

      // 3. Schutzregel für kritische Küchen-Paare, die auf dasselbe Grundwort enden, aber völlig andere Produkte sind:
      const forbiddenMismatchPairs = [
        /\b(kokosmilch|kondensmilch|hafermilch|mandelmilch|sojamilch|buttermilch)\b/i,
        /\b(kräuterbutter|knoblauchbutter|erdnussbutter|mandelbutter|kakaobutter)\b/i,
        /\b(puderzucker|vanillezucker|gelierzucker|rohrzucker|kokosblütenzucker)\b/i,
        /\b(cayennepfeffer|zitronenpfeffer|knoblauchpfeffer|pfefferminze|pfefferbeißer)\b/i,
        /\b(dosentomaten|passata|polpa)\b/i,
        /\b(knoblauchöl|trüffelöl|chiliöl|sesamöl|erdnussöl|kokosöl)\b/i,
        /\b(reisessig|apfelessig|himbeeressig)\b/i,
        /\b(schinkenwürfel|speckwürfel)\b/i
      ];
      for (const specialRegex of forbiddenMismatchPairs) {
        if (specialRegex.test(pClean) !== specialRegex.test(iClean)) {
          return false;
        }
      }

      // 4. Schneide Nebenzutaten hinter "con ...", "mit ...", "alla ...", "al ...", "in ..." ab:
      const stripModifiers = (str) => str.split(/\s+(?:con|mit|alla|all'|al|ai|in|auf|nach|aus|vom)\s+/i)[0].trim();
      const pHead = stripModifiers(pClean);
      const iHead = stripModifiers(iClean);
      if (pHead === iHead) return true;

      // 5. Unterstütze explizite Kombi-Einträge im Vorratsschrank mit "&" oder "+" (z.B. "Zwiebeln & Knoblauch" oder "Salz & Pfeffer")
      if (pHead.includes('&') || pHead.includes('+') || pHead.includes(' und ')) {
        const subItems = pHead.split(/\s*(?:&|\+|und)\s*/i).map(s => s.trim()).filter(Boolean);
        if (subItems.some(sub => isIngredientMatchingPantry(sub, iHead))) {
          return true;
        }
      }

      // 6. Zerlege die Hauptbegriffe in einzelne Wörter, normalisiere Singular/Plural und ignoriere die Wortreihenfolge
      const pWords = pHead.split(/[\s,\-\/]+/).filter(Boolean).map(normalizeGermanFoodWord);
      const iWords = iHead.split(/[\s,\-\/]+/).filter(Boolean).map(normalizeGermanFoodWord);

      if (pWords.join(' ') === iWords.join(' ')) return true;
      if ([...pWords].sort().join(' ') === [...iWords].sort().join(' ')) return true;

      // 7. Wenn beide Einträge auf 1 Kernwort reduziert sind (z.B. "Rinderhackfleisch" vs. "Hackfleisch"):
      if (pWords.length === 1 && iWords.length === 1) {
        const pw = pWords[0];
        const iw = iWords[0];
        if (pw === iw) return true;

        const allowedGenericBaseWords = ['hackfleisch', 'gulasch', 'filet', 'brustfilet', 'hähnchenbrust', 'reis', 'nudeln', 'nudel', 'pasta', 'käse', 'reibekäse', 'zwiebel', 'kartoffel', 'öl', 'speiseöl', 'essig', 'senf', 'bohne', 'pfeffer', 'salz', 'kaper', 'kapern', 'tomate', 'zitrone', 'sahne', 'butter', 'milch', 'mehl', 'zucker'];
        if (allowedGenericBaseWords.includes(iw) && (pw.endsWith(iw) || pw.startsWith(iw))) return true;
        if (allowedGenericBaseWords.includes(pw) && (iw.endsWith(pw) || iw.startsWith(pw))) return true;
      }

      return false;
    };

    // Automatische Gruppenerkennung für Joker-Zutaten (Pasta, Fond, Reis)
    const detectItemGroup = (nameStr, existingGroup = undefined) => {
      const lower = (nameStr || '').toLowerCase();
      if (/sugo|pesto|sauce|soße/i.test(lower)) return existingGroup;
      if (/tagliatelle|rigatoni|spaghetti|penne|pasta|nudeln|fusilli|farfalle|makkaroni|linguine|fettuccine|orecchiette|lasagne/i.test(lower)) {
        return 'Pasta';
      }
      if (/fond|brühe|bouillon/i.test(lower)) {
        return 'Fond';
      }
      if (/reis|risotto|basmati|jasminreis/i.test(lower)) {
        return 'Reis';
      }
      return existingGroup;
    };

    // Sicherheits-Weiche für Kategorien: Pesto, Sugo, Fonds, Brühen & Pastasaucen gehören in den Vorratsschrank (es sei denn, sie sind explizit im Kühlschrank/Tiefkühler)!
    const enforceSmartCategory = (productName, suggestedCategory) => {
      const lower = (productName || '').toLowerCase();
      if (suggestedCategory === 'sauces' && /sugo|amatriciana|pesto|fond|brühe|bouillon|tomatensauce|tomatensoße|passata|polpa|arrabbiata|bolognese|nudelsoße|pastasauce|kokosmilch|ketchup|senf|mayo|apfelmus|konserve|mais|bohnen|linsen|kichererbsen|nudeln|pasta|penne|spaghetti|rigatoni|tagliatelle|fusilli|farfalle|reis|mehl|zucker/i.test(lower)) {
        return 'pantry';
      }
      return suggestedCategory || 'pantry';
    };

    // Vollständige Start-Daten
    const SEED_DATA = {
      pantry: [
        { id: 'p1', name: 'Rinderhackfleisch', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(1), amount: 500, unitType: 'g', lowThreshold: 200 },
        { id: 'p2', name: 'Zitronen', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(9), amount: 3, unitType: 'Stück', lowThreshold: 1 },
        { id: 'p3', name: 'Parmesan', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(20), amount: 200, unitType: 'g', lowThreshold: 50 },
        { id: 'p4', name: 'Butter', category: 'fridge', status: 'in_stock', expiryDate: getFutureDateStr(14), amount: 250, unitType: 'g', lowThreshold: 50 },
        { id: 'p5', name: 'Rosmarin & Thymian', category: 'fridge', status: 'low', expiryDate: getFutureDateStr(3), amount: 1, unitType: 'Topf', lowThreshold: 1 },
        
        { id: 'p6a', name: 'Tagliatelle', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 500, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 1 }], lowThreshold: 200 },
        { id: 'p6b', name: 'Rigatoni', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 500, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 1 }], lowThreshold: 200 },
        { id: 'p6c', name: 'Spaghetti', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 1000, unitType: 'g', containerType: 'Packung', packs: [{ size: 500, unit: 'g', count: 2 }], lowThreshold: 300 },
        { id: 'p6d', name: 'Penne', category: 'pantry', status: 'in_stock', group: 'Pasta', amount: 3000, unitType: 'g', containerType: 'Packung', packs: [{ size: 1000, unit: 'g', count: 2 }, { size: 500, unit: 'g', count: 2 }], lowThreshold: 200 },
        { id: 'p7', name: 'Dosentomaten', category: 'pantry', status: 'in_stock', amount: 1600, unitType: 'g', containerType: 'Dose', packs: [{ size: 400, unit: 'g', count: 4 }], lowThreshold: 400 },
        { id: 'p7b', name: 'Passata', category: 'pantry', status: 'in_stock', amount: 700, unitType: 'g', containerType: 'Flasche', packs: [{ size: 700, unit: 'g', count: 1 }], lowThreshold: 350 },
        { id: 'p8', name: 'Basmatireis', category: 'pantry', status: 'in_stock', group: 'Reis', amount: 800, unitType: 'g', lowThreshold: 250 },
        { id: 'p9', name: 'Zwiebeln & Knoblauch', category: 'pantry', status: 'in_stock', amount: 6, unitType: 'Stück', lowThreshold: 2 },
        { id: 'p10', name: 'Apfelmus', category: 'pantry', status: 'in_stock', amount: 2, unitType: 'Glas', lowThreshold: 1 },
        { id: 'p10b', name: 'Ketchup', category: 'pantry', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1 },
        { id: 'p11a', name: 'Rinderfond', category: 'pantry', status: 'in_stock', group: 'Fond', amount: 800, unitType: 'ml', containerType: 'Glas', packs: [{ size: 400, unit: 'ml', count: 2 }], lowThreshold: 200 },
        { id: 'p11b', name: 'Gemüsebrühe', category: 'pantry', status: 'in_stock', group: 'Fond', amount: 1, unitType: 'Glas', lowThreshold: 1 },
        { id: 'p12', name: 'Olivenöl', category: 'pantry', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1, usesSinceOpen: 19, maxUses: 20 },
        { id: 'p13', name: 'Tomatenmark', category: 'pantry', status: 'in_stock', amount: 2, unitType: 'Tube', lowThreshold: 1 },

        { id: 's_soja1', name: 'Sojasauce', category: 'sauces', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1 },
        { id: 's_soja2', name: 'Sojasauce (dunkel)', category: 'sauces', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1 },
        { id: 's_essig1', name: 'Weißweinessig', category: 'sauces', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1 },
        { id: 's_essig2', name: 'Balsamico-Essig', category: 'sauces', status: 'in_stock', amount: 1, unitType: 'Flasche', lowThreshold: 1 },

        { id: 'sp_1', name: 'Piment', category: 'spices', status: 'in_stock' },
        { id: 'sp_2', name: 'Wacholderbeeren', category: 'spices', status: 'in_stock' },
        { id: 'sp_3', name: 'Nelken', category: 'spices', status: 'in_stock' },
        { id: 'sp_4', name: 'Muskatnuss', category: 'spices', status: 'in_stock' },
        { id: 'sp_5', name: 'Tonkabohne', category: 'spices', status: 'in_stock' },

    const compressImageToBase64 = (file, maxWidth = 1024, quality = 0.75) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    // DYNAMISCHER GEMINI AUFRUF
    let cachedWorkingModel = null;

    async function callGeminiWithAutoModel(apiKey, promptText, base64Image = null) {
      const cleanKey = (apiKey || '').trim();
      if (!cleanKey) {
        throw new Error('Kein Gemini API-Key hinterlegt. Bitte Einladungs-Link nutzen oder im Zahnrad-Menü eintragen.');
      }

      let candidateModels = [];
      if (cachedWorkingModel) candidateModels.push(cachedWorkingModel);

      try {
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
        const listData = await listRes.json();
        if (listRes.ok && listData && Array.isArray(listData.models)) {
          const validModels = listData.models
            .filter(m =>
              m.supportedGenerationMethods &&
              m.supportedGenerationMethods.includes('generateContent') &&
              !m.name.includes('embedding') &&
              !m.name.includes('aqa') &&
              !m.name.includes('imagen') &&
              !m.name.includes('veo') &&
              !m.name.includes('tts') &&
              !m.name.includes('audio')
            )
            .map(m => m.name.replace(/^models\//, ''));

          validModels.sort((a, b) => {
            const aFlash = a.includes('flash') ? 1 : 0;
            const bFlash = b.includes('flash') ? 1 : 0;
            if (aFlash !== bFlash) return bFlash - aFlash;
            return b.localeCompare(a, undefined, { numeric: true });
          });

          for (const vm of validModels) {
            if (!candidateModels.includes(vm)) candidateModels.push(vm);
          }
        }
      } catch (err) {}

      const fallbacks = ['gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-2.0-flash'];
      for (const fb of fallbacks) {
        if (!candidateModels.includes(fb)) candidateModels.push(fb);
      }

      const parts = [{ text: promptText }];
      if (base64Image) parts.push({ inlineData: { mimeType: 'image/jpeg', data: base64Image } });

      let lastErrorMsg = 'Kein passendes Gemini-Modell gefunden.';
      for (const modelName of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            cachedWorkingModel = modelName;
            return { text: data.candidates[0].content.parts[0].text, usedModel: modelName };
          } else {
            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (netErr) {
          lastErrorMsg = netErr.message;
        }
      }
      throw new Error(lastErrorMsg);
    }

        try {

          const currentShop = stateObj.shoppingList || [];
          const currentShopJson = JSON.stringify(currentShop.map(s => s.name));

      const pullFromCloud = async () => {

      const handleTouchStart = (e) => {
        if (isAnyModalOpen) return;
        const targetTag = e.target?.tagName?.toLowerCase();
        if (['input', 'textarea', 'select', 'button'].includes(targetTag)) return;
        if (e.touches && e.touches.length === 1) {
          touchStartRef.current = {
            x: e.touches[0].clientX,
            y: e.touches[0].clientY
          };

      const handleTouchEnd = (e) => {
        if (isAnyModalOpen || touchStartRef.current.x === null) return;
        if (!e.changedTouches || e.changedTouches.length === 0) return;

        const deltaX = e.changedTouches[0].clientX - touchStartRef.current.x;
        const deltaY = e.changedTouches[0].clientY - touchStartRef.current.y;
        touchStartRef.current = { x: null, y: null };

        if (Math.abs(deltaX) > 65 && Math.abs(deltaX) > Math.abs(deltaY) * 1.7) {
          const currentIndex = TAB_ORDER.indexOf(activeTab);
          if (currentIndex === -1) return;

          if (deltaX < 0 && currentIndex < TAB_ORDER.length - 1) {
            setActiveTab(TAB_ORDER[currentIndex + 1]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (deltaX > 0 && currentIndex > 0) {
            setActiveTab(TAB_ORDER[currentIndex - 1]);

      // Direktes Bearbeiten von Zutaten innerhalb eines Rezepts
      const updateIngredientInRecipe = (recipeId, ingIndex, field, value) => {

      // Öffnet das vollständige Bearbeitungs-Fenster (✏️) für einen Vorrat

        const normUnit = item.unitType === 'Gläser' ? 'Glas' : item.unitType === 'Dosen' ? 'Dose' : (item.unitType || 'Packung');
        setEditPantryUnitType(normUnit);
        const normContainer = item.containerType || (['Packung', 'Glas', 'Gläser', 'Dose', 'Dosen', 'Flasche', 'Tube', 'Becher', 'Stück', 'Topf'].includes(item.unitType) ? normUnit : 'Packung');
        setEditPantryContainerType(normContainer);
        setEditPantryPacks(Array.isArray(item.packs) ? item.packs.map(p => ({ ...p })) : []);

      const handleSaveFullEditPantryItem = () => {
        if (!editingFullPantryItem || !editPantryName.trim()) return;
        const cleanName = editPantryName.trim();
        const isSpice = editPantryCategory === 'spices';

        let finalPacks = [...editPantryPacks].filter(p => Number(p.size) > 0 && Number(p.count) >= 0);
        if (Number(editNewPackSize) > 0 && Number(editNewPackCount) > 0) {
          const s = Number(editNewPackSize);
          const c = Number(editNewPackCount);
          const u = editNewPackUnit || 'g';
          const existingIdx = finalPacks.findIndex(p => Number(p.size) === s && p.unit === u);
          if (existingIdx !== -1) {
            finalPacks[existingIdx].count += c;
          } else {
            finalPacks.push({ size: s, unit: u, count: c });

        }

          unit = sum.unit;

        const threshold = unit === 'g' || unit === 'ml' ? 200 : 1;
        let nextStatus = 'in_stock';
        if (!isSpice) {
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';
        }

        const detectedGroup = detectItemGroup(cleanName, editingFullPantryItem.group);

        setPantry(prev => prev.map(p => {
          if (p.id !== editingFullPantryItem.id) return p;
          return {
            ...p,

            amount: cleanAmount,
            unitType: unit,
            containerType: (!isSpice && finalPacks.length > 0) ? editPantryContainerType : undefined,
            packs: (!isSpice && finalPacks.length > 0) ? finalPacks : undefined,

      // Packungs-Anzahl in einer Vorratskarte direkt per [-] / [+] anpassen
      const updatePackCount = (itemId, packIndex, delta) => {

      // Intelligentes Hinzufügen oder Aufstocken (Mit Batch-Support für Mehrfach-Scans & sauberer Trennung zwischen Kühlschrank und Vorratsschrank!)
      const addOrUpdatePantryItem = (name, amountToAdd, unit, category, expiryInput = undefined, packSizeNum = undefined, packUnitStr = undefined) => {
        const cleanName = (name || '').trim();
        if (!cleanName) return;
        const rawCat = category || (pantrySubTab === 'mealprep' ? 'pantry' : pantrySubTab);
        const targetCat = enforceSmartCategory(cleanName, rawCat);

        let resolvedExpiryDate = undefined;
        if (typeof expiryInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(expiryInput)) {
          resolvedExpiryDate = expiryInput;
        } else if (typeof expiryInput === 'number' && !isNaN(expiryInput)) {
          resolvedExpiryDate = getFutureDateStr(expiryInput);
        } else if (targetCat === 'fridge' && expiryInput === undefined) {
          resolvedExpiryDate = getFutureDateStr(5);
        }

        const normContainer = unit === 'Gläser' ? 'Glas' : unit === 'Dosen' ? 'Dose' : unit;
        const isContainerUnit = ['Packung', 'Glas', 'Dose', 'Flasche', 'Tube', 'Becher', 'Stück', 'Topf'].includes(normContainer);

        const hasPackInfo = Number(packSizeNum) > 0;
        const pSize = Number(packSizeNum);
        const pUnit = packUnitStr || (normContainer === 'Flasche' || unit === 'ml' ? 'ml' : 'g');
        const pCount = Math.max(1, Number(amountToAdd) || 1);

        setPantry(prev => {
          const existingIndex = prev.findIndex(p =>
            p.category === targetCat && isIngredientMatchingPantry(p.name, cleanName)
          );

          if (existingIndex !== -1) {
            return prev.map((item, idx) => {
              if (idx !== existingIndex) return item;
              if (item.category === 'spices') return { ...item, status: 'in_stock' };

              if (hasPackInfo || (Array.isArray(item.packs) && item.packs.length > 0)) {
                let nextPacks = Array.isArray(item.packs) ? item.packs.map(pk => ({ ...pk })) : [];
                if (nextPacks.length === 0 && (item.unitType === 'g' || item.unitType === 'ml') && item.amount > 0) {
                  nextPacks.push({ size: item.amount, unit: item.unitType, count: 1 });
                }

                const targetSize = hasPackInfo ? pSize : ((unit === 'g' || unit === 'ml') && Number(amountToAdd) >= 100 ? Number(amountToAdd) : (nextPacks[0]?.size || 500));
                const targetUnit = hasPackInfo ? pUnit : (nextPacks[0]?.unit || item.unitType || 'g');
                const addCount = hasPackInfo ? pCount : ((unit === 'g' || unit === 'ml') && Number(amountToAdd) >= 100 ? 1 : pCount);

                const packIdx = nextPacks.findIndex(pk => Number(pk.size) === Number(targetSize) && pk.unit === targetUnit);
                if (packIdx !== -1) {
                  nextPacks[packIdx].count = (Number(nextPacks[packIdx].count) || 0) + addCount;
                } else {
                  nextPacks.push({ size: targetSize, unit: targetUnit, count: addCount });
                }
                nextPacks.sort((a, b) => Number(b.size) - Number(a.size));

                const sum = calcPacksSummary(nextPacks);
                return {
                  ...item,
                  packs: nextPacks,
                  containerType: isContainerUnit ? normContainer : (item.containerType || 'Packung'),
                  amount: sum.totalAmount,
                  unitType: sum.unit,
                  group: detectItemGroup(item.name, item.group),
                  status: 'in_stock',
                  ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
                };
              }

              const currentAmt = item.amount !== undefined ? Number(item.amount) : 0;
              return {
                ...item,
                amount: currentAmt + Number(amountToAdd),
                unitType: isContainerUnit ? normContainer : item.unitType,
                group: detectItemGroup(item.name, item.group),
                status: 'in_stock',
                ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
              };
            });
          } else {
            const initialPacks = (targetCat !== 'spices' && hasPackInfo)
              ? [{ size: pSize, unit: pUnit, count: pCount }]
              : undefined;
            const finalAmount = targetCat === 'spices'
              ? undefined
              : (initialPacks ? pSize * pCount : Number(amountToAdd));
            const finalUnit = targetCat === 'spices'
              ? undefined
              : (initialPacks ? pUnit : normContainer);
            const detectedGrp = detectItemGroup(cleanName);

            const newItem = {
              id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1),
              category: targetCat,
              status: 'in_stock',
              amount: finalAmount,
              unitType: finalUnit,
              ...(initialPacks ? { packs: initialPacks, containerType: isContainerUnit ? normContainer : 'Packung' } : {}),
              lowThreshold: finalUnit === 'g' || finalUnit === 'ml' ? 200 : 1,
              ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate } : {}),
              ...(detectedGrp ? { group: detectedGrp } : {})
            };
            return [newItem, ...prev];
          }
        });

        showToast(`"${cleanName}" gespeichert!`);
      };

      // PRÄZISER ZUTATEN- & MENGEN-CHECK (Rechnet auch Bestände aus Kühlschrank + Vorratsschrank zusammen!)
      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const missingDetails = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];
        let minExpiryDays = 999;

        const hasEnoughQuantity = (pantryItem, ingAmountStr) => {
          if (!pantryItem || pantryItem.status === 'empty') return false;
          if (pantryItem.category === 'spices') return true;
          const availAmt = pantryItem.amount !== undefined ? Number(pantryItem.amount) : 0;
          if (availAmt <= 0) return false;

          const req = parseRequiredAmount(ingAmountStr);
          if (req && (pantryItem.unitType === 'g' || pantryItem.unitType === 'ml') && req.unit === pantryItem.unitType) {
            return availAmt >= req.val;
          }
          return true;
        };

        (recipe.ingredients || []).forEach((ing) => {
          const cleanIngName = (ing.name || '').trim();
          if (!cleanIngName) return;

          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? ((mp.blocks500 || 0) * 500 + (mp.blocks250 || 0) * 250) : 0;
            const req = parseRequiredAmount(ing.amount);
            const neededGrams = req && req.unit === 'g' ? req.val : 250;
            if (totalGrams < neededGrams) {
              missing.push(cleanIngName);
              missingDetails.push({ name: cleanIngName, reason: `Für Wochenplan: ${recipe.title}` });
            }
            return;
          }

          const ingGroup = detectItemGroup(cleanIngName);
          const isPastaIng = Boolean(ing.isPasta || ingGroup === 'Pasta');
          const isFondIng = Boolean(ing.isFond || ingGroup === 'Fond');

          if (isPastaIng) {
            const exactPasta = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName) && hasEnoughQuantity(p, ing.amount));
            if (exactPasta) return;

            const partialExactPasta = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName) && p.status !== 'empty' && Number(p.amount) > 0);
            const anyPasta = pantry.find(p => (p.group === 'Pasta' || detectItemGroup(p.name) === 'Pasta') && hasEnoughQuantity(p, ing.amount));
            if (anyPasta) {
              notes.push(`Joker: ${anyPasta.name} (${anyPasta.amount}${anyPasta.unitType}) im Haus`);
              return;
            }
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              const reasonHint = partialExactPasta
                ? `Für ${recipe.title} (Benötigt: ${ing.amount}, nur ${partialExactPasta.amount}${partialExactPasta.unitType} da)`
                : `Für Wochenplan: ${recipe.title} (${ing.amount || 'Nach Bedarf'})`;
              missingDetails.push({ name: cleanIngName, reason: reasonHint });
            }
            return;
          }

          if (isFondIng) {
            const exactFond = pantry.find(p => isIngredientMatchingPantry(p.name, cleanIngName) && hasEnoughQuantity(p, ing.amount));
            if (exactFond) return;
            const anyFond = pantry.find(p => (p.group === 'Fond' || detectItemGroup(p.name) === 'Fond') && hasEnoughQuantity(p, ing.amount));
            if (anyFond) {
              notes.push(`Joker: ${anyFond.name} statt ${cleanIngName}`);
              return;
            }
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              missingDetails.push({ name: cleanIngName, reason: `Für Wochenplan: ${recipe.title} (${ing.amount || 'Nach Bedarf'})` });
            }
            return;
          }

          // Alle passenden Einträge über alle Schränke (z.B. Kühlschrank + Vorratsschrank) hinweg finden und Mengen addieren!
          const matchingItems = pantry.filter(p => isIngredientMatchingPantry(p.name, cleanIngName) && p.status !== 'empty');
          const primaryFound = matchingItems[0];
          const combinedAmount = matchingItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
          const virtualCombinedItem = primaryFound ? { ...primaryFound, amount: combinedAmount } : null;

          if (!virtualCombinedItem || !hasEnoughQuantity(virtualCombinedItem, ing.amount)) {
            if (ing.essential !== false) {
              missing.push(cleanIngName);
              const hasSome = virtualCombinedItem && combinedAmount > 0;
              const reasonHint = hasSome
                ? `Für ${recipe.title} (Benötigt: ${ing.amount}, insgesamt nur ${combinedAmount} ${primaryFound.unitType} da)`
                : `Für Wochenplan: ${recipe.title}${ing.amount ? ` (${ing.amount})` : ''}`;
              missingDetails.push({ name: cleanIngName, reason: reasonHint });
            }
          } else {
            matchingItems.forEach(found => {
              if (found.category === 'freezer_items' && found.subType === 'meat') {
                fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);
              }
              const dLeft = getDaysUntilExpiry(found);
              if (dLeft !== undefined && dLeft <= 2) {
                urgentFridgeItems.push({ name: found.name, daysLeft: dLeft });
                if (dLeft < minExpiryDays) minExpiryDays = dLeft;
              }
            });
          }
        });

        return { missing, missingDetails, fromFreezerMeat, urgentFridgeItems, minExpiryDays, noteText: notes.join(' · ') };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => ({ ...r, ...checkRecipeAvailability(r) }))
          .filter(r => {
            if (filterMode === 'kid' && !r.isKidFriendly) return false;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;
            if (filterCalories === 'under150' && (r.kcalPer100g === undefined || r.kcalPer100g >= 150)) return false;
            if (filterCalories === '150to300' && (r.kcalPer100g === undefined || r.kcalPer100g < 150 || r.kcalPer100g > 300)) return false;
            if (filterCalories === 'over300' && (r.kcalPer100g === undefined || r.kcalPer100g <= 300)) return false;
            if (filterShopping === 'any_plan') return true;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_3' && r.missing.length > 3) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            if (a.minExpiryDays !== b.minExpiryDays) {
              return a.minExpiryDays - b.minExpiryDays;
            }
            return (b.lastCookedDaysAgo || 0) - (a.lastCookedDaysAgo || 0);
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterCalories, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {

      const handleCreateNewMealPrep = () => {

        setShowAddMealPrepModal(false);

      const handleAddPantryItem = () => {

      const handleConfirmCooked = () => {

      const toggleRecipeFamily = (recipeId) => {

      const updateRecipeKcal = (recipeId, val) => {

      };

      const addToMealPlan = (recipeInput) => {
        const freshRecipe = recipes.find(r => r.id === recipeInput.id) || recipeInput;
        const alreadyInPlan = mealPlan.some(m => m.id === freshRecipe.id);

        if (!alreadyInPlan) {
          setMealPlan(prev => [...prev, freshRecipe]);
        } else {

        }

        const avail = checkRecipeAvailability(freshRecipe);
        let addedCount = 0;

        setShoppingList(prev => {
          const nextList = [...prev];
          (avail.missingDetails || []).forEach(detail => {
            const exists = nextList.some(s => isIngredientMatchingPantry(s.name, detail.name));
            if (!exists) {
              addedCount++;
              nextList.push({
                id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                name: detail.name,
                reason: detail.reason,
                done: false
              });
            }
          });
          return nextList;
        });

        setTimeout(() => {
          if (addedCount > 0) {
            showToast(`"${freshRecipe.title}": ${addedCount} fehlende Zutat(en) in den Einkaufswagen gelegt!`);
          } else if (avail.missing.length > 0) {
            showToast(`"${freshRecipe.title}": Fehlende Zutaten stehen bereits im Einkaufswagen!`);

      const syncAllMealPlanToShopping = () => {
        if (mealPlan.length === 0) return;
        let addedCount = 0;
        setShoppingList(prev => {
          const nextList = [...prev];
          mealPlan.forEach(planItem => {
            const latestRec = recipes.find(r => r.id === planItem.id) || planItem;
            const avail = checkRecipeAvailability(latestRec);
            (avail.missingDetails || []).forEach(detail => {
              const exists = nextList.some(s => isIngredientMatchingPantry(s.name, detail.name));
              if (!exists) {
                addedCount++;
                nextList.push({
                  id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                  name: detail.name,
                  reason: detail.reason,
                  done: false
                });
              }
            });
          });
          return nextList;
        });
        setTimeout(() => {
          if (addedCount > 0) {
            showToast(`${addedCount} fehlende Zutat(en) aus dem Wochenplan ergänzt!`);
          } else {
            showToast('Wochenplan geprüft: Alles vorrätig oder bereits auf der Einkaufsliste!');
          }
        }, 50);
      };

      const removeFromMealPlan = (recipeId) => {
        setMealPlan(prev => prev.filter(m => m.id !== recipeId));
        showToast('Aus dem Kochplan entfernt');
      };

      // OFFIZIELLER BRING!-EXPORT
      const triggerOfficialBringImport = async () => {
        if (shoppingList.length === 0) return;
        const cleanUrl = (firebaseUrl || '').trim().replace(/\/$/, '');
        if (!cleanUrl) {
          showToast('Bitte zuerst die Firebase-URL in den Einstellungen verbinden.');
          return;
        }
        try {
          await fetch(`${cleanUrl}/bring_export.json`, {
            method: 'PUT',

            body: JSON.stringify(buildBringParserPayload(shoppingList))
          });
        } catch (e) {}

        const staticJsonEndpoint = `${cleanUrl}/bring_export.json`;
        const officialDeepLink = `https://api.getbring.com/rest/bringrecipes/deeplink?url=${encodeURIComponent(staticJsonEndpoint)}&source=web&baseQuantity=1&requestedQuantity=1`;
        window.open(officialDeepLink, '_blank');
      };

      // FOTO-SCAN
      const handleFileSelected = async (e, scanType = 'pantry') => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = '';

        const activeKey = (geminiKey || '').trim();
        const todayStr = new Date().toISOString().split('T')[0];

        try {
          setIsAnalyzingPhoto(true);
          showToast('Foto wird von Gemini analysiert...');
          const base64Data = await compressImageToBase64(file, 1024, 0.75);

          const prompt = scanType === 'recipe'
            ? `Analysiere diese abfotografierte Kochbuchseite und antworte NUR mit reinem JSON: {"title": "Name des Gerichts", "prepTime": 30, "kcalPer100g": 180, "ingredients": [{"name": "Zutat (ohne Markennamen)", "amount": "Menge"}], "steps": ["Schritt 1", "Schritt 2"]}`
            : `Heute ist ${todayStr}. Erkenne die fotografierten Lebensmittel oder den Kassenbon.
WICHTIGE REGELN:
1. KEINE MARKENNAMEN & EINHEITLICHE BEGRIFFE! Speichere immer nur den reinen Gattungsbegriff (z.B. "Senf" statt "Kühne Senf mittelscharf", "Cannellini-Bohnen" statt "Mutti Cannellini"). Wenn mehrere Gläser/Dosen desselben Produkts (auch in unterschiedlichen Größen) auf dem Bild sind, gib ihnen EXAKT denselben Namen (z.B. "Senf")!
2. IDENTISCHE GEBINDE BÜNDELN: Wenn z.B. 2 identische Dosen Cannellini-Bohnen nebeneinander stehen, fasse sie zu EINEM Eintrag mit "amount": 2 zusammen!
3. KATEGORIEN STRIKT TRENNEN:
   - "sauces" (Öle und Soßen): NUR für flüssige Würzsaucen, Speiseöle und Essig (z.B. Sojasauce, Austernsauce, Fischsauce, Worcestersauce, Chilisauce, Tabasco, Olivenöl, Rapsöl, Sesamöl, Balsamico, Weißweinessig).
   - "pantry" (Vorratsschrank): Alle Kochzutaten im Glas/Dose/Packung! Insbesondere Pesto, Sugo, Tomatensauce, Pastasauce, Passata, Dosentomaten, Bratenfond, Rinderfond, Geflügelfond, Krustentierfond, Gemüsebrühe, Pasta, Reis, Konserven, Bohnen, Ketchup, Senf, Mayo.
4. BEHÄLTER & PACKUNGSGEWICHT GENAU ERKENNEN:
   - Unterscheide bei "unitType" präzise zwischen "Glas", "Dose", "Flasche", "Packung", "Tube", "Becher" oder "Stück".
   - Wenn auf einer Packung/Dose/Glas/Flasche ein Gewicht oder Volumen steht (z.B. 1 kg = 1000 g Penne, 400 g Dose, 200 ml Senf), gib "packSize": 400 (als Zahl in g oder ml), "packUnit": "g"|"ml" an!
5. Falls ein Haltbarkeitsdatum (MHD) lesbar ist, gib es als YYYY-MM-DD in "expiryDate" an.
Antworte NUR mit reinem JSON:
{"items": [{"name": "Reiner Produktname ohne Marke", "amount": 1, "unitType": "Packung|Glas|Dose|Flasche|Tube|Becher|Stück", "packSize": 400, "packUnit": "g", "category": "pantry|fridge|freezer_items|sauces|spices", "expiryDate": "YYYY-MM-DD"}]}`;

          const { text: rawText, usedModel } = await callGeminiWithAutoModel(activeKey, prompt, base64Data);
          setDetectedModelInfo(usedModel);

          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Kein JSON im KI-Text gefunden');
          const parsed = JSON.parse(jsonMatch[0]);

          if (scanType === 'recipe' && parsed.title) {
            const newRec = {
              id: 'r_' + Date.now(), title: parsed.title,
              effort: (parsed.prepTime || 30) <= 30 ? 'quick' : 'elaborate',
              season: 'all', kcalPer100g: Number(parsed.kcalPer100g) || 180,
              isFamilyRecipe: true, isKidFriendly: false, isMealPrep: false, isDraft: false,
              lastCookedDaysAgo: 99, prepTime: Number(parsed.prepTime) || 30,
              ingredients: (parsed.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
              steps: parsed.steps || ['Aus Kochbuch gescannt.']
            };
            setRecipes(prev => [newRec, ...prev]);
            setSelectedRecipeId(newRec.id);
            setActiveTab('recipes');
            showToast(`Rezept "${newRec.title}" eingescannt!`);
          } else if (parsed.items && parsed.items.length > 0) {
            const previewList = parsed.items.map((it, idx) => {
              const cleanName = (it.name || 'Unbekannter Artikel').trim();
              const smartCat = enforceSmartCategory(cleanName, it.category || 'pantry');
              const normU = it.unitType === 'Gläser' ? 'Glas' : it.unitType === 'Dosen' ? 'Dose' : (it.unitType || 'Packung');
              return {
                tempId: 'scan_' + Date.now() + '_' + idx,
                name: cleanName,
                category: smartCat,
                amount: Number(it.amount) || 1,
                unitType: normU,
                packSize: Number(it.packSize) > 0 ? String(it.packSize) : '',
                packUnit: it.packUnit === 'ml' ? 'ml' : 'g',
                expiryDate: it.expiryDate && /^\d{4}-\d{2}-\d{2}$/.test(it.expiryDate)
                  ? it.expiryDate
                  : (smartCat === 'fridge' ? getFutureDateStr(4) : '')
              };
            });
            setScanPreviewItems(previewList);
          }
        } catch (err) {
          showToast(`Scan-Fehler: ${err.message}`);
          setNewPantryExpiryDate(getFutureDateStr(3));
          setShowNewPantryItemModal(true);
        } finally {
          setIsAnalyzingPhoto(false);
        }
      };

      const handleConfirmScanPreview = () => {
        if (!Array.isArray(scanPreviewItems) || scanPreviewItems.length === 0) {
          setScanPreviewItems(null);
          return;
        }
        scanPreviewItems.forEach(it => {
          if (!it.name || !it.name.trim()) return;
          const hasPack = Number(it.packSize) > 0 && it.category !== 'spices';
          addOrUpdatePantryItem(
            it.name.trim(),
            Number(it.amount) || 1,
            it.unitType || 'Packung',
            it.category || 'pantry',
            it.expiryDate || null,
            hasPack ? Number(it.packSize) : undefined,
            hasPack ? (it.packUnit || 'g') : undefined
          );
        });
        setScanPreviewItems(null);
      };

      const updateScanPreviewItem = (tempId, field, value) => {
        setScanPreviewItems(prev => (prev || []).map(it => {
          if (it.tempId !== tempId) return it;
          const updated = { ...it, [field]: value };
          if (field === 'name') {
            updated.category = enforceSmartCategory(value, updated.category);
          }
          return updated;
        }));
      };

      const testAvailableModels = async () => {
        try {
          showToast('Frage verfügbare Modelle bei Google ab...');
          const activeKey = (geminiKey || '').trim();
          const res = await callGeminiWithAutoModel(activeKey, 'Antworte nur mit dem Wort OK');
          setDetectedModelInfo(res.usedModel);
          showToast(`Erfolgreich! Aktives Modell: ${res.usedModel}`);
        } catch (err) {
          showToast(`Test-Fehler: ${err.message}`);
        }
      };

      // ENDLOS-DIKTAT (Hört ohne Zeitlimit so lange zu, bis du auf Stopp oder Ausführen drückst!)
      const createAndStartRecognitionSession = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Spracherkennung wird von diesem Browser nicht unterstützt.');
          shouldKeepListeningRef.current = false;
          setIsListening(false);
          return;
        }

        try {
          if (recognitionRef.current) {
            recognitionRef.current.onend = null;
            recognitionRef.current.onerror = null;
            recognitionRef.current.onresult = null;
            try { recognitionRef.current.abort(); } catch (e) {}
          }

          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = 'de-DE';
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;

          recognition.onresult = (event) => {
            let finalChunk = '';
            let interimChunk = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcriptPiece = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                finalChunk += transcriptPiece + ' ';
              } else {
                interimChunk += transcriptPiece;
              }
            }

            if (finalChunk.trim()) {
              const cleanChunk = finalChunk.trim();
              setVoiceText(prev => {
                const p = (prev || '').trim();
                return p ? `${p} ${cleanChunk}` : cleanChunk;
              });
              setVoiceInterimText('');
            } else {
              setVoiceInterimText(interimChunk);
            }
          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
              shouldKeepListeningRef.current = false;
              setIsListening(false);
              setVoiceInterimText('');
              showToast('Bitte Mikrofon-Zugriff erlauben.');
            }
          };

          recognition.onend = () => {
            if (shouldKeepListeningRef.current) {
              if (restartListeningTimerRef.current) clearTimeout(restartListeningTimerRef.current);
              restartListeningTimerRef.current = setTimeout(() => {
                if (shouldKeepListeningRef.current) {
                  createAndStartRecognitionSession();
                }
              }, 120);
            } else {
              setIsListening(false);
              setVoiceInterimText('');
            }
          };

          recognition.start();
          setIsListening(true);
        } catch (e) {
          if (shouldKeepListeningRef.current) {
            restartListeningTimerRef.current = setTimeout(() => {
              if (shouldKeepListeningRef.current) createAndStartRecognitionSession();
            }, 300);
          } else {
            setIsListening(false);
          }
        }
      };

      const startListening = () => {
        shouldKeepListeningRef.current = true;
        setIsListening(true);
        createAndStartRecognitionSession();
      };

      const stopListening = () => {
        shouldKeepListeningRef.current = false;
        if (restartListeningTimerRef.current) {
          clearTimeout(restartListeningTimerRef.current);
          restartListeningTimerRef.current = null;
        }
        if (recognitionRef.current) {
          recognitionRef.current.onend = null;
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        setVoiceInterimText(currentInterim => {
          if (currentInterim && currentInterim.trim()) {
            setVoiceText(prev => {
              const p = (prev || '').trim();
              return p ? `${p} ${currentInterim.trim()}` : currentInterim.trim();
            });
          }
          return '';
        });
        setIsListening(false);
      };

      const openVoiceAssistantAndStart = () => {
        setVoiceText('');
        setVoiceInterimText('');
        setVoiceOverlay(true);
        startListening();
      };

      // GEMINI KI SPRACH-INTERPRETER
      const executeVoiceCommand = async (rawCmdText) => {
        const combinedText = `${rawCmdText || ''} ${voiceInterimText || ''}`.trim();
        if (!combinedText) return;
        stopListening();

        const activeKey = (geminiKey || '').trim();
        const todayStr = new Date().toISOString().split('T')[0];
        const existingNames = pantry.map(p => `${p.name} (${p.amount !== undefined ? p.amount + ' ' + p.unitType : 'Gewürz'}, ${p.category})`).join(', ');

        try {
          setIsProcessingVoice(true);
          const voicePrompt = `Du bist der smarte Küchen-Assistent einer Vorrats- und Rezept-App.
Heute ist ${todayStr}.
Aktuell im Bestand vorhandene Artikel: [${existingNames}].
Der Nutzer hat folgenden Sprachbefehl (ggf. mehrere Sätze oder ein ganzes Rezept mit Zutaten und Zubereitung) eingesprochen: "${combinedText}"

Analysiere, was der Nutzer möchte, und antworte AUSSCHLIESSLICH mit validem JSON in genau diesem Format:
{
  "actions": [
    {
      "type": "add_or_increment" | "set_exact" | "delete" | "mealprep_add" | "create_recipe" | "query",
      "name": "Sauberer Produktname OHNE Markennamen (WICHTIG: Wirf niemals unterschiedliche Produkte wie 'Salz' und 'Pommesgewürz Salz' zusammen!)",
      "amount": 1,
      "unitType": "Packung|Glas|Dose|Flasche|Tube|Becher|Stück|g|ml",
      "packSize": null,
      "packUnit": "g",
      "category": "pantry|fridge|freezer_items|sauces|spices",
      "expiryDate": "YYYY-MM-DD (nur falls Kühlschrank/Frischware oder MHD genannt, sonst null)",
      "blocks500": 1,
      "blocks250": 0,
      "recipe": {
        "title": "Name des Gerichts",
        "prepTime": 25,
        "kcalPer100g": 180,
        "isKidFriendly": true,
        "ingredients": [{"name": "Zutat", "amount": "Menge"}],
        "steps": ["Schritt 1", "Schritt 2"]
      },
      "answerText": "Antwort-Text falls der Nutzer eine Frage gestellt hat"
    }
  ]
}
Wichtige Regeln:
- Lass Markennamen immer weg ("Bamboo Garden Sojasauce" -> "Sojasauce").
- KATEGORIEN: Pesto, Sugo, Tomatensauce, Pastasauce, Passata, Fonds (Bratenfond, Rinderfond, Krustentierfond) und Brühen gehören in "pantry" (Vorratsschrank), es sei denn der Nutzer nennt explizit den Kühlschrank ("fridge"). "sauces" ist nur für flüssige Würzsaucen (Sojasauce, Austernsauce), Öle und Essig!
- Wenn der Nutzer Packungsgrößen nennt (z.B. "zwei 1-Kilo Packungen Penne"), setze type: "add_or_increment", name: "Penne", amount: 2, unitType: "Packung", packSize: 1000, packUnit: "g", category: "pantry".
- Wenn der Nutzer ein neues Rezept diktiert oder anlegen möchte (z.B. "Rezept für Senfeier..." oder eine Aufzählung von Zutaten & Schritten für ein Gericht), setze type: "create_recipe" und übernimm alle vom Nutzer genannten Mengen, Zutaten und Zubereitungsschritte sauber in das Objekt "recipe" (fehlende Angaben wie kcalPer100g oder prepTime sinnvoll schätzen)!`;

          const { text: aiResponse } = await callGeminiWithAutoModel(activeKey, voicePrompt);
          const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Konnte Sprachbefehl nicht zuordnen');
          const parsed = JSON.parse(jsonMatch[0]);

          if (parsed.actions && Array.isArray(parsed.actions)) {
            parsed.actions.forEach(act => {
              if (act.type === 'query' && act.answerText) {
                showToast(act.answerText);
              } else if (act.type === 'create_recipe' && act.recipe) {
                const r = act.recipe;
                const newRec = {
                  id: 'r_' + Date.now(),
                  title: r.title || act.name || 'Neues Rezept',
                  effort: (Number(r.prepTime) || 25) <= 30 ? 'quick' : 'elaborate',
                  season: 'all',
                  kcalPer100g: Number(r.kcalPer100g) || 180,
                  isFamilyRecipe: true,
                  isKidFriendly: Boolean(r.isKidFriendly),
                  isMealPrep: false,
                  isDraft: false,
                  lastCookedDaysAgo: 99,
                  prepTime: Number(r.prepTime) || 25,
                  ingredients: (r.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
                  steps: r.steps || ['Frisch zubereiten.']
                };
                setRecipes(prev => [newRec, ...prev]);
                setSelectedRecipeId(newRec.id);
                setActiveTab('recipes');
                showToast(`Rezept "${newRec.title}" komplett angelegt!`);
              } else if (act.type === 'delete') {
                const found = pantry.find(p => isIngredientMatchingPantry(p.name, act.name));
                if (found) deletePantryItem(found.id);
              } else if (act.type === 'set_exact') {
                const found = pantry.find(p => isIngredientMatchingPantry(p.name, act.name));
                if (found) {
                  updatePantryAmount(found.id, Number(act.amount) || 0);
                  showToast(`${found.name} auf ${act.amount} ${found.unitType || ''} gesetzt!`);
                } else {
                  addOrUpdatePantryItem(act.name, Number(act.amount) || 1, act.unitType || 'Stück', act.category || 'pantry', act.expiryDate);
                }
              } else if (act.type === 'mealprep_add') {
                setMealPrep(prev => [{
                  id: 'mp_' + Date.now(), name: act.name || 'Neues Gericht',
                  blocks500: Number(act.blocks500) || 1, blocks250: Number(act.blocks250) || 0,

                  act.category || 'pantry',
                  act.expiryDate || undefined,
                  hasPack ? Number(act.packSize) : undefined,
                  hasPack ? (act.packUnit || 'g') : undefined
                );
              }
            });
          }
          setVoiceText('');
          setVoiceInterimText('');
          setVoiceOverlay(false);
        } catch (err) {
