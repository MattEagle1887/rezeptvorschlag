    const Icon = ({ name, size = 18, className = "" }) => {
      const spanRef = useRef(null);
      useEffect(() => {
        if (spanRef.current && window.lucide) {
          spanRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
          window.lucide.createIcons({
            root: spanRef.current,
            attrs: { width: size, height: size, class: `inline-block ${className}` }
          });
        }
      }, [name, size, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;

    const getFutureDateStr = (daysToAdd) => {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + Number(daysToAdd));
      return d.toISOString().split('T')[0];
    };

    const getDaysUntilExpiry = (item) => {
      if (!item) return undefined;
      if (item.expiryDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(item.expiryDate + 'T00:00:00');
        return Math.round((target - today) / (1000 * 60 * 60 * 24));
      }
      if (item.expiryDays !== undefined && item.expiryDays !== null && item.expiryDays !== '') {
        return Number(item.expiryDays);
      }
      return undefined;
    };

    const formatExpiryBadge = (days, expiryDateStr) => {
      if (days === undefined) return null;
      let dateHint = '';
      if (expiryDateStr) {
        const parts = expiryDateStr.split('-');
        if (parts.length === 3) dateHint = ` (${parts[2]}.${parts[1]}.)`;
      }
      if (days < 0) return { text: `Abgelaufen seit ${Math.abs(days)} T.${dateHint}`, urgent: true, expired: true };
      if (days === 0) return { text: `Läuft HEUTE ab!${dateHint}`, urgent: true, expired: false };
      if (days === 1) return { text: `Nur noch 1 Tag (Morgen)${dateHint}`, urgent: true, expired: false };
      if (days === 2) return { text: `Noch 2 Tage${dateHint}`, urgent: true, expired: false };
      return { text: `Noch ${days} Tage${dateHint}`, urgent: false, expired: false };
    };

    const replaceGermanNumberWords = (str) => {
      const map = {
        'einhalb': '0.5', 'eineinhalb': '1.5', 'anderthalb': '1.5',
        'einen': '1', 'eine': '1', 'eins': '1', 'ein': '1',
        'zwei': '2', 'zwo': '2', 'zweimal': '2', 'drei': '3', 'dreimal': '3',
        'vier': '4', 'fünf': '5', 'sechs': '6', 'sieben': '7', 'acht': '8', 'neun': '9', 'zehn': '10'
      };
      return str.replace(/\b(einhalb|eineinhalb|anderthalb|einen|eine|eins|ein|zwei|zwo|zweimal|drei|dreimal|vier|fünf|sechs|sieben|acht|neun|zehn)\b/gi, (m) => map[m.toLowerCase()] || m);
    };

    const compressImageToBase64 = (file, maxWidth = 1024, quality = 0.75) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
        };
        img.onerror = reject;
        img.src = event.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    let cachedWorkingModel = null;
    async function callGeminiWithAutoModel(apiKey, promptText, base64Image = null) {
      const cleanKey = apiKey.trim();
      let candidateModels = [];

      if (cachedWorkingModel) candidateModels.push(cachedWorkingModel);

      try {
        const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
        const listData = await listRes.json();
        if (listRes.ok && listData && Array.isArray(listData.models)) {
          const validModels = listData.models
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent') && !m.name.includes('embedding'))
            .map(m => m.name.replace(/^models\//, ''));
          validModels.sort((a, b) => {
            const aFlash = a.includes('flash') ? 1 : 0;
            const bFlash = b.includes('flash') ? 1 : 0;
            if (aFlash !== bFlash) return bFlash - aFlash;
            return b.localeCompare(a, undefined, { numeric: true });
          });
          for (const vm of validModels) { if (!candidateModels.includes(vm)) candidateModels.push(vm); }
        }
      } catch (err) {}

      const fallbacks = ['gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-2.5-flash', 'gemini-2.0-flash'];
      for (const fb of fallbacks) { if (!candidateModels.includes(fb)) candidateModels.push(fb); }

      const parts = [{ text: promptText }];
      if (base64Image) parts.push({ inlineData: { mimeType: 'image/jpeg', data: base64Image } });

      let lastErrorMsg = 'Kein passendes Gemini-Modell gefunden.';
      for (const modelName of candidateModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          });
          const data = await res.json();
          if (res.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
            cachedWorkingModel = modelName;
            return { text: data.candidates[0].content.parts[0].text, usedModel: modelName };
          } else {
            lastErrorMsg = data?.error?.message || `HTTP ${res.status}`;
          }
        } catch (netErr) {
          lastErrorMsg = netErr.message;
        }
      }
      throw new Error(lastErrorMsg);
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');

      const [firebaseUrl, setFirebaseUrl] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const fromUrl = params.get('db');
        if (fromUrl) { localStorage.setItem('kueche_firebase_url', fromUrl); return fromUrl; }

      const [geminiKey, setGeminiKey] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        const fromUrl = params.get('gemini');
        if (fromUrl) { localStorage.setItem('kueche_gemini_key', fromUrl); return fromUrl; }
        return localStorage.getItem('kueche_gemini_key') || DEFAULT_GEMINI_KEY;
      });

      const [isEditingKey, setIsEditingKey] = useState(false);
      const [tempKeyInput, setTempKeyInput] = useState('');
      const [detectedModelInfo, setDetectedModelInfo] = useState('');
      const [bringListName, setBringListName] = useState(() => localStorage.getItem('kueche_bring_list') || 'Zuhause');

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const [syncStatus, setSyncStatus] = useState('local');
      const lastSyncTimestamp = useRef(0);
      const isApplyingRemote = useRef(false);

      const [pantry, setPantry] = useState([]);
      const [mealPrep, setMealPrep] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [shoppingList, setShoppingList] = useState([]);
      const [mealPlan, setMealPlan] = useState([]);
      const [isLoadedFromCloud, setIsLoadedFromCloud] = useState(false);

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 5500);
      };

      const pushToCloud = async (stateObj) => {
        if (!firebaseUrl || isApplyingRemote.current) return;
        const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
        try {
          setSyncStatus('syncing');
          const now = Date.now();
          lastSyncTimestamp.current = now;
          await fetch(`${cleanUrl}/kueche_shared.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              isInitialized: true,
              pantry: stateObj.pantry || [],
              mealPrep: stateObj.mealPrep || [],
              recipes: stateObj.recipes || [],
              shoppingList: stateObj.shoppingList || [],
              mealPlan: stateObj.mealPlan || [],
              bringRecipe: {
                name: `Küche & Vorrat (${bringListName})`,
                ingredients: (stateObj.shoppingList || []).map(item => ({ name: item.name, spec: '' }))
              },
              updatedAt: now
            })
          });
          setSyncStatus('synced');
        } catch (err) {
          setSyncStatus('error');
        }
      };

      useEffect(() => {
        if (!firebaseUrl) {
          setPantry(SEED_DATA.pantry);
          setMealPrep(SEED_DATA.mealPrep);
          setRecipes(SEED_DATA.recipes);
          setIsLoadedFromCloud(true);
          return;
        }

        const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
        fetch(`${cleanUrl}/kueche_shared.json`)
          .then(res => res.json())
          .then(data => {
            if (data && (data.isInitialized || data.pantry || data.updatedAt)) {
              setPantry(data.pantry || []);
              setMealPrep(data.mealPrep || []);
              setRecipes(data.recipes || []);
              setShoppingList(data.shoppingList || []);
              setMealPlan(data.mealPlan || []);
              if (data.updatedAt) lastSyncTimestamp.current = data.updatedAt;
            } else {
              setPantry(SEED_DATA.pantry);
              setMealPrep(SEED_DATA.mealPrep);
              setRecipes(SEED_DATA.recipes);
              pushToCloud({ pantry: SEED_DATA.pantry, mealPrep: SEED_DATA.mealPrep, recipes: SEED_DATA.recipes, shoppingList: [], mealPlan: [] });
            }
            setIsLoadedFromCloud(true);
            setSyncStatus('synced');
          })
          .catch(() => {
            setPantry(SEED_DATA.pantry);
            setMealPrep(SEED_DATA.mealPrep);
            setRecipes(SEED_DATA.recipes);
            setIsLoadedFromCloud(true);
            setSyncStatus('error');
          });
      }, [firebaseUrl]);

      useEffect(() => {
        if (!firebaseUrl || !isLoadedFromCloud) return;
        const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`${cleanUrl}/kueche_shared.json`);
            if (!res.ok) return;
            const data = await res.json();
            if (data && data.updatedAt && data.updatedAt > lastSyncTimestamp.current) {
              isApplyingRemote.current = true;
              lastSyncTimestamp.current = data.updatedAt;
              setPantry(data.pantry || []);
              setMealPrep(data.mealPrep || []);
              setRecipes(data.recipes || []);
              setShoppingList(data.shoppingList || []);
              setMealPlan(data.mealPlan || []);
              setTimeout(() => { isApplyingRemote.current = false; }, 250);
            }
            setSyncStatus('synced');
          } catch (e) {
            setSyncStatus('error');
          }
        }, 4000);
        return () => clearInterval(interval);
      }, [firebaseUrl, isLoadedFromCloud]);

      useEffect(() => {
        if (!isLoadedFromCloud || isApplyingRemote.current) return;
        if (firebaseUrl) {
          pushToCloud({ pantry, mealPrep, recipes, shoppingList, mealPlan });
        }
      }, [pantry, mealPrep, recipes, shoppingList, mealPlan]);

      const handleDatabaseReset = async () => {
        isApplyingRemote.current = true;
        setPantry([]); setMealPrep([]); setRecipes([]); setShoppingList([]); setMealPlan([]);
        if (firebaseUrl) {
          const cleanUrl = firebaseUrl.trim().replace(/\/$/, '');
          const now = Date.now();
          lastSyncTimestamp.current = now;
          await fetch(`${cleanUrl}/kueche_shared.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isInitialized: true, pantry: [], mealPrep: [], recipes: [], shoppingList: [], mealPlan: [], updatedAt: now })
          });
        }
        setTimeout(() => { isApplyingRemote.current = false; }, 300);
        setShowResetConfirm(false);
        setShowSettingsModal(false);
        showToast('Datenbank komplett geleert!');

      const [filterEffort, setFilterEffort] = useState('all');
      const [filterCalories, setFilterCalories] = useState('all');
      const [filterShopping, setFilterShopping] = useState('all_here');
      const [filterMode, setFilterMode] = useState('normal');
      const [currentSuggestionIndex, setCurrentSuggestionIndex] = useState(0);

      const [pantrySubTab, setPantrySubTab] = useState('pantry');

      const [showAddMealPrepModal, setShowAddMealPrepModal] = useState(false);

      const [editingMpKcalItem, setEditingMpKcalItem] = useState(null);

      const [showNewPantryItemModal, setShowNewPantryItemModal] = useState(false);

      const [editingExpiryDateVal, setEditingExpiryDateVal] = useState('');

      const [showNewRecipeModal, setShowNewRecipeModal] = useState(false);

      const [editingAmountItem, setEditingAmountItem] = useState(null);
      const [editingAmountValue, setEditingAmountValue] = useState('');

      const [cookedModalRecipe, setCookedModalRecipe] = useState(null);
      const [freezeLeftovers500, setFreezeLeftovers500] = useState(0);
      const [freezeLeftovers250, setFreezeLeftovers250] = useState(0);

      const [voiceOverlay, setVoiceOverlay] = useState(false);
      const [voiceText, setVoiceText] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [isProcessingVoice, setIsProcessingVoice] = useState(false);
      const [isAnalyzingPhoto, setIsAnalyzingPhoto] = useState(false);
      const [newShopItemName, setNewShopItemName] = useState('');

      const urgentExpiringItems = useMemo(() => {
        return pantry
          .filter(p => p.status !== 'empty' && (p.amount === undefined || p.amount > 0))
          .map(p => ({ ...p, daysLeft: getDaysUntilExpiry(p) }))
          .filter(p => p.daysLeft !== undefined && p.daysLeft <= 2)
          .sort((a, b) => a.daysLeft - b.daysLeft);
      }, [pantry]);

      const updatePantryAmount = (itemId, newAmountVal) => {
        const cleanAmount = Math.max(0, Number(newAmountVal));
        setPantry(prev => prev.map(item => {
          if (item.id !== itemId) return item;
          const threshold = item.lowThreshold || (item.unitType === 'g' ? 150 : 1);
          let nextStatus = 'in_stock';
          if (cleanAmount === 0) nextStatus = 'empty';
          else if (cleanAmount <= threshold) nextStatus = 'low';

          if (nextStatus === 'empty' && item.status !== 'empty') {
            setShoppingList(sl => {
              if (sl.some(s => s.name.toLowerCase() === item.name.toLowerCase())) return sl;
              return [...sl, { id: 's_' + Date.now(), name: item.name, reason: 'Aufgebraucht', done: false }];
            });
            showToast(`${item.name} ist leer → Einkaufsliste`);
          }
          return { ...item, amount: cleanAmount, status: nextStatus };
        }));
      };

      const deletePantryItem = (itemId) => {

        setPantry(prev => prev.filter(p => p.id !== itemId));
        if (itemToDelete) showToast(`"${itemToDelete.name}" gelöscht`);
      };

      const deleteMealPrepItem = (mpId) => {
        const mpToDelete = mealPrep.find(m => m.id === mpId);
        setMealPrep(prev => prev.filter(m => m.id !== mpId));
        if (mpToDelete) showToast(`"${mpToDelete.name}" gelöscht`);
      };

      const addOrUpdatePantryItem = (name, amountToAdd, unit, category, expiryInput = undefined) => {
        const cleanName = name.trim();
        if (!cleanName) return;
        const lowerClean = cleanName.toLowerCase();
        const targetCat = category || (pantrySubTab === 'mealprep' ? 'pantry' : pantrySubTab);

        let resolvedExpiryDate = undefined;
        if (typeof expiryInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(expiryInput)) {
          resolvedExpiryDate = expiryInput;
        } else if (typeof expiryInput === 'number' && !isNaN(expiryInput)) {
          resolvedExpiryDate = getFutureDateStr(expiryInput);
        } else if (targetCat === 'fridge') {
          resolvedExpiryDate = getFutureDateStr(5);
        }

        const existingIndex = pantry.findIndex(p => {
          const pLower = p.name.toLowerCase();
          return pLower === lowerClean || pLower.includes(lowerClean) || lowerClean.includes(pLower);
        });

        if (existingIndex !== -1) {
          const matchedItem = pantry[existingIndex];
          setPantry(prev => prev.map((item, idx) => {
            if (idx !== existingIndex) return item;
            if (item.category === 'spices') return { ...item, status: 'in_stock' };
            const currentAmt = item.amount !== undefined ? Number(item.amount) : 0;
            return {
              ...item,
              amount: currentAmt + Number(amountToAdd),
              status: 'in_stock',
              ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate, expiryDays: undefined } : {})
            };
          }));
          showToast(`"${matchedItem.name}" aufgestockt (+${amountToAdd} ${matchedItem.unitType || unit})!`);
        } else {
          const newItem = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            name: cleanName.charAt(0).toUpperCase() + cleanName.slice(1),
            category: targetCat,
            status: 'in_stock',
            amount: targetCat === 'spices' ? undefined : Number(amountToAdd),
            unitType: targetCat === 'spices' ? undefined : unit,
            lowThreshold: unit === 'g' || unit === 'ml' ? 150 : 1,
            ...(resolvedExpiryDate ? { expiryDate: resolvedExpiryDate } : {}),
            ...(lowerClean.includes('tagliatelle') || lowerClean.includes('rigatoni') || lowerClean.includes('spaghetti') || lowerClean.includes('penne') || lowerClean.includes('pasta') ? { group: 'Pasta' } : {})
          };
          setPantry(prev => [newItem, ...prev]);
          showToast(`Neu angelegt: ${newItem.name}`);
        }
      };

      const checkRecipeAvailability = (recipe) => {
        const missing = [];
        const fromFreezerMeat = [];
        const urgentFridgeItems = [];
        const notes = [];
        let minExpiryDays = 999;

        (recipe.ingredients || []).forEach((ing) => {
          if (ing.isFromMealPrep) {
            const mp = mealPrep.find(m => m.id === ing.isFromMealPrep);
            const totalGrams = mp ? ((mp.blocks500 || 0) * 500 + (mp.blocks250 || 0) * 250) : 0;
            if (totalGrams === 0) missing.push(ing.name);
            return;
          }
          if (ing.isPasta) {
            const exactPasta = pantry.find(p => p.name.toLowerCase() === ing.name.toLowerCase() && p.amount > 0);
            if (exactPasta) return;
            const anyPasta = pantry.find(p => p.group === 'Pasta' && p.amount > 0);
            if (anyPasta) { notes.push(`Joker: ${anyPasta.name} da`); return; }
            if (ing.essential) missing.push(ing.name);
            return;
          }
          const found = pantry.find(p =>
            p.name.toLowerCase().includes(ing.name.toLowerCase()) ||
            ing.name.toLowerCase().includes(p.name.toLowerCase())
          );
          if (!found || found.status === 'empty' || (found.amount !== undefined && found.amount <= 0)) {
            if (ing.essential) missing.push(ing.name);
          } else {
            if (found.category === 'freezer_items' && found.subType === 'meat') {
              fromFreezerMeat.push(`${found.name} (${found.amount} ${found.unitType})`);
            }
            const dLeft = getDaysUntilExpiry(found);
            if (dLeft !== undefined && dLeft <= 2) {
              urgentFridgeItems.push({ name: found.name, daysLeft: dLeft });
              if (dLeft < minExpiryDays) minExpiryDays = dLeft;
            }
          }
        });

        return { missing, fromFreezerMeat, urgentFridgeItems, minExpiryDays, noteText: notes.join(' · ') };
      };

      const filteredSuggestions = useMemo(() => {
        return recipes
          .map(r => ({ ...r, ...checkRecipeAvailability(r) }))
          .filter(r => {
            if (filterMode === 'kid' && !r.isKidFriendly) return false;
            if (filterEffort !== 'all' && r.effort !== filterEffort) return false;
            if (filterCalories === 'under150' && (r.kcalPer100g === undefined || r.kcalPer100g >= 150)) return false;
            if (filterCalories === '150to300' && (r.kcalPer100g === undefined || r.kcalPer100g < 150 || r.kcalPer100g > 300)) return false;
            if (filterCalories === 'over300' && (r.kcalPer100g === undefined || r.kcalPer100g <= 300)) return false;
            if (filterShopping === 'any_plan') return true;
            if (filterShopping === 'all_here' && r.missing.length > 0) return false;
            if (filterShopping === 'shop_3' && r.missing.length > 3) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.urgentFridgeItems.length !== b.urgentFridgeItems.length) {
              return b.urgentFridgeItems.length - a.urgentFridgeItems.length;
            }
            if (a.minExpiryDays !== b.minExpiryDays) {
              return a.minExpiryDays - b.minExpiryDays;
            }
            return (b.lastCookedDaysAgo || 0) - (a.lastCookedDaysAgo || 0);
          });
      }, [recipes, pantry, mealPrep, filterEffort, filterCalories, filterShopping, filterMode]);

      const activeSuggestion = filteredSuggestions[currentSuggestionIndex % Math.max(1, filteredSuggestions.length)];

      const updateMealPrepBlocks = (mpId, delta500, delta250, label = '') => {
        setMealPrep(prev => prev.map(mp => {
          if (mp.id !== mpId) return mp;
          if (label) showToast(`${mp.name}: ${label}`);
          return {
            ...mp,
            blocks500: Math.max(0, (mp.blocks500 || 0) + delta500),
            blocks250: Math.max(0, (mp.blocks250 || 0) + delta250)
          };
        }));
      };

      const handleCreateNewMealPrep = () => {
        if (!newMpName.trim()) return;
        const newId = 'mp_' + Date.now();
        const needsArray = newMpNeeds.split(',').map(s => s.trim()).filter(Boolean);
        const newEntry = {
          id: newId, name: newMpName.trim(),
          blocks500: Number(newMp500) || 0, blocks250: Number(newMp250) || 0,
          kcalPer100g: Number(newMpKcal) || 170, needsFresh: needsArray, prepTime: 20, season: 'all'
        };
        setMealPrep(prev => [newEntry, ...prev]);

        const newRec = {
          id: 'r_mp_' + Date.now(), title: `${newMpName.trim()} (aus dem TK)`,
          effort: 'quick', season: 'all', kcalPer100g: Number(newMpKcal) || 170,
          isFamilyRecipe: true, isKidFriendly: true, isMealPrep: true, mealPrepId: newId, lastCookedDaysAgo: 30, prepTime: 20,
          ingredients: [
            { name: `${newMpName.trim()} (TK)`, amount: '500g oder 250g Block', essential: true, isFromMealPrep: newId },
            ...needsArray.map(n => ({ name: n, amount: 'Nach Bedarf', essential: true }))
          ],
          steps: ['Blöcke aus dem TK nehmen und schonend im Topf erwärmen.']
        };
        setRecipes(prev => [newRec, ...prev]);
        setNewMpName(''); setNewMp500(1); setNewMp250(0); setNewMpNeeds('');
        setShowAddMealPrepModal(false);
        showToast(`"${newEntry.name}" im TK angelegt!`);
      };

      const handleAddPantryItem = () => {
        if (!newPantryName.trim()) return;
        const expToSave = newPantryCategory === 'fridge' ? newPantryExpiryDate : undefined;
        addOrUpdatePantryItem(newPantryName, Number(newPantryAmount) || 1, newPantryUnitType, newPantryCategory, expToSave);
        setNewPantryName('');
        setShowNewPantryItemModal(false);
      };

      const handleConfirmCooked = () => {
        if (!cookedModalRecipe) return;
        setRecipes(prev => prev.map(r => r.id === cookedModalRecipe.id ? { ...r, lastCookedDaysAgo: 0 } : r));

        if (freezeLeftovers500 > 0 || freezeLeftovers250 > 0) {
          const existingMp = mealPrep.find(m =>
            m.id === cookedModalRecipe.mealPrepId ||
            m.name.toLowerCase().includes(cookedModalRecipe.title.toLowerCase())
          );
          if (existingMp) {
            updateMealPrepBlocks(existingMp.id, freezeLeftovers500, freezeLeftovers250);
          } else {
            setMealPrep(prev => [{
              id: 'mp_' + Date.now(), name: cookedModalRecipe.title,
              blocks500: freezeLeftovers500, blocks250: freezeLeftovers250,
              kcalPer100g: cookedModalRecipe.kcalPer100g || 170, needsFresh: [], prepTime: 20, season: 'all'
            }, ...prev]);
          }
          showToast(`Reste im TK gespeichert!`);
        } else {
          showToast(`"${cookedModalRecipe.title}" als gekocht markiert!`);
        }
        setFreezeLeftovers500(0); setFreezeLeftovers250(0); setCookedModalRecipe(null);
      };

      const selectedRecipe = recipes.find(r => r.id === selectedRecipeId);

      const addToMealPlan = (recipe) => {
        if (mealPlan.some(m => m.id === recipe.id)) {
          showToast('Ist bereits im Kochplan!');
          return;
        }
        setMealPlan(prev => [...prev, recipe]);
        const avail = checkRecipeAvailability(recipe);
        const newShoppingItems = avail.missing
          .filter(ingName => !shoppingList.some(s => s.name.toLowerCase() === ingName.toLowerCase()))
          .map(ingName => ({ id: 's_' + Date.now() + '_' + Math.random(), name: ingName, reason: `Für: ${recipe.title}`, done: false }));

        if (newShoppingItems.length > 0) {
          setShoppingList(prev => [...prev, ...newShoppingItems]);
          showToast(`Gemerkt & ${newShoppingItems.length} Zutat(en) auf Einkaufsliste!`);
        } else {
          showToast(`Im Wochenplan gemerkt!`);
        }
      };

      const handleFileSelected = async (e, scanType = 'pantry') => {
        const file = e.target.files[0];
        if (!file) return;
        e.target.value = '';

        const activeKey = (geminiKey || DEFAULT_GEMINI_KEY).trim();
        const todayStr = new Date().toISOString().split('T')[0];

        try {
          setIsAnalyzingPhoto(true);
          showToast('Foto wird von Gemini analysiert...');
          const base64Data = await compressImageToBase64(file, 1024, 0.75);

          const prompt = scanType === 'recipe'
            ? `Analysiere diese abfotografierte Kochbuchseite und antworte NUR mit reinem JSON: {"title": "Name des Gerichts", "prepTime": 30, "kcalPer100g": 180, "ingredients": [{"name": "Zutat", "amount": "Menge"}], "steps": ["Schritt 1", "Schritt 2"]}`
            : `Heute ist ${todayStr}. Erkenne das fotografierte Lebensmittel oder den Kassenbon. Falls ein Haltbarkeitsdatum (MHD) auf der Packung lesbar ist, gib es als YYYY-MM-DD in "expiryDate" an (sonst bei frischen Kühlschrank-Produkten geschätztes Datum in 2-5 Tagen). Antworte NUR mit reinem JSON: {"items": [{"name": "Genauer Produktname", "amount": 1, "unitType": "Flasche|Dosen|Stück|g|ml|Packung|Tube", "category": "pantry|fridge|freezer_items|sauces|spices", "expiryDate": "YYYY-MM-DD"}]}`;

          const { text: rawText, usedModel } = await callGeminiWithAutoModel(activeKey, prompt, base64Data);
          setDetectedModelInfo(usedModel);

          const jsonMatch = rawText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Kein JSON im KI-Text gefunden');
          const parsed = JSON.parse(jsonMatch[0]);

          if (scanType === 'recipe' && parsed.title) {
            const newRec = {
              id: 'r_' + Date.now(), title: parsed.title,
              effort: (parsed.prepTime || 30) <= 30 ? 'quick' : 'elaborate',
              season: 'all', kcalPer100g: Number(parsed.kcalPer100g) || 180,
              isFamilyRecipe: true, isKidFriendly: false, isMealPrep: false,
              lastCookedDaysAgo: 99, prepTime: Number(parsed.prepTime) || 30,
              ingredients: (parsed.ingredients || []).map(i => ({ name: i.name, amount: i.amount || 'Nach Bedarf', essential: true })),
              steps: parsed.steps || ['Aus Kochbuch gescannt.']
            };
            setRecipes(prev => [newRec, ...prev]);
            setSelectedRecipeId(newRec.id);
            setActiveTab('recipes');
            showToast(`Rezept "${newRec.title}" eingescannt!`);
          } else if (parsed.items && parsed.items.length > 0) {
            parsed.items.forEach(it => {
              addOrUpdatePantryItem(it.name, it.amount || 1, it.unitType || 'Stück', it.category || 'pantry', it.expiryDate);
            });
          }
        } catch (err) {
          showToast(`Scan-Fehler: ${err.message}`);
          setShowNewPantryItemModal(true);
        } finally {
          setIsAnalyzingPhoto(false);
        }
      };

      const testAvailableModels = async () => {
        try {
          showToast('Frage verfügbare Modelle bei Google ab...');
          const activeKey = (geminiKey || DEFAULT_GEMINI_KEY).trim();
          const res = await callGeminiWithAutoModel(activeKey, 'Antworte nur mit dem Wort OK');
          setDetectedModelInfo(res.usedModel);
          showToast(`Erfolgreich! Aktives Modell: ${res.usedModel}`);
        } catch (err) {
          showToast(`Test-Fehler: ${err.message}`);
        }
      };

      // SAUBERE SPRACHERKENNUNG (Stoppt automatisch nach Satzende und dupliziert nichts mehr)
      const startListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Spracherkennung wird von diesem Browser nicht unterstützt.');
          return;
        }
        try {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch (e) {}
          }
          const recognition = new SpeechRecognition();
          recognitionRef.current = recognition;
          recognition.lang = 'de-DE';
          recognition.continuous = false; // Schaltet nach einmaligem Sprechen ab -> keine Endlos-Duplizierung!
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;

          setIsListening(true);
          recognition.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = 0; i < event.results.length; i++) {
              if (event.results[i].isFinal) {
                final += event.results[i][0].transcript;
              } else {
                interim += event.results[i][0].transcript;
              }
            }
            if (final) {
              setVoiceText(final.trim());
            } else if (interim) {
              setVoiceText(interim.trim());
            }
          };
          recognition.onend = () => setIsListening(false);
          recognition.onerror = () => setIsListening(false);
          recognition.start();
        } catch (e) {
          setIsListening(false);
        }
      };

      const stopListening = () => {
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
        }
        setIsListening(false);
      };

      const openVoiceAssistantAndStart = () => {
        setVoiceText('');
        setVoiceOverlay(true);
        startListening();
      };

      // GEMINI KI SPRACH-INTERPRETER
      const executeVoiceCommand = async (rawCmdText) => {
        if (!rawCmdText || !rawCmdText.trim()) return;
        stopListening();

        const activeKey = (geminiKey || DEFAULT_GEMINI_KEY).trim();
        const todayStr = new Date().toISOString().split('T')[0];
        const existingNames = pantry.map(p => `${p.name} (${p.amount !== undefined ? p.amount + ' ' + p.unitType : 'Gewürz'}, ${p.category})`).join(', ');

        try {
          setIsProcessingVoice(true);
          const voicePrompt = `Du bist der smarte Küchen-Assistent einer Vorrats-App.
Heute ist ${todayStr}.
Aktuell im Bestand vorhandene Artikel: [${existingNames}].
Der Nutzer hat folgenden Sprachbefehl eingesprochen: "${rawCmdText.trim()}"

Analysiere, was der Nutzer möchte, und antworte AUSSCHLIESSLICH mit validem JSON in genau diesem Format:
{
  "actions": [
    {
      "type": "add_or_increment" | "set_exact" | "delete" | "mealprep_add" | "query",
      "name": "Sauberer Produktname",
      "amount": 1,
      "unitType": "Flasche|Dosen|Stück|g|ml|Packung|Tube|Gläser",
      "category": "pantry|fridge|freezer_items|sauces|spices",
      "expiryDate": "YYYY-MM-DD (nur falls Kühlschrank/Frischware oder MHD genannt, sonst null)",
      "answerText": "Antwort-Text falls der Nutzer eine Frage gestellt hat"
    }
  ]
}
Wichtige Regeln:
- Entferne alle Befehlswörter aus dem Produktnamen!
- Achte darauf, dass Zahlen (z.B. 100g Pancetta) korrekt als amount: 100, unitType: "g" interpretiert werden und sich NICHT duplizieren!`;

          const { text: aiResponse } = await callGeminiWithAutoModel(activeKey, voicePrompt);
          const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('Konnte Sprachbefehl nicht zuordnen');
          const parsed = JSON.parse(jsonMatch[0]);

          if (parsed.actions && Array.isArray(parsed.actions)) {
            parsed.actions.forEach(act => {
              if (act.type === 'query' && act.answerText) {
                showToast(act.answerText);
              } else if (act.type === 'delete') {
                const found = pantry.find(p => p.name.toLowerCase().includes((act.name || '').toLowerCase()));
                if (found) deletePantryItem(found.id);
              } else if (act.type === 'set_exact') {
                const found = pantry.find(p => p.name.toLowerCase().includes((act.name || '').toLowerCase()));
                if (found) {
                  updatePantryAmount(found.id, Number(act.amount) || 0);
                  showToast(`${found.name} auf ${act.amount} gesetzt!`);
                } else {
                  addOrUpdatePantryItem(act.name, Number(act.amount) || 1, act.unitType || 'Stück', act.category || 'pantry', act.expiryDate);
                }
              } else if (act.type === 'mealprep_add') {
                setMealPrep(prev => [{
                  id: 'mp_' + Date.now(), name: act.name || 'Neues Gericht',
                  blocks500: Number(act.blocks500) || 1, blocks250: Number(act.blocks250) || 0,
                  kcalPer100g: 170, needsFresh: [], prepTime: 20, season: 'all'
                }, ...prev]);
                showToast(`Im TK angelegt: ${act.name}`);
              } else {
                addOrUpdatePantryItem(
                  act.name || rawCmdText,
                  Number(act.amount) || 1,
                  act.unitType || 'Stück',
                  act.category || 'pantry',
                  act.expiryDate || undefined
                );
              }
            });
          }
          setVoiceText('');
          setVoiceOverlay(false);
        } catch (err) {
          showToast(`Sprach-Fehler: ${err.message}`);
        } finally {
          setIsProcessingVoice(false);
        }
      };

      const copyShareLink = () => {
        const baseUrl = window.location.origin + window.location.pathname;
        const params = new URLSearchParams();
        if (firebaseUrl.trim()) params.set('db', firebaseUrl.trim());
        if (geminiKey.trim()) params.set('gemini', geminiKey.trim());
        navigator.clipboard.writeText(`${baseUrl}?${params.toString()}`);
        showToast('Link kopiert!');
      };

      return (
        <div className="min-h-screen bg-stone-100 text-stone-900 flex flex-col max-w-md mx-auto border-x border-stone-200 shadow-sm relative pb-24">
          <input type="file" accept="image/*" capture="environment" id="globalCameraInput" onChange={e => handleFileSelected(e, 'pantry')} className="hidden" />
          <input type="file" accept="image/*" capture="environment" id="cookbookCameraInput" onChange={e => handleFileSelected(e, 'recipe')} className="hidden" />

          {isAnalyzingPhoto && (
            <div className="fixed inset-0 bg-black/60 z-50 flex flex-col items-center justify-center p-6 text-white space-y-3 text-center">
              <div className="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin" />
              <p className="text-sm font-semibold">Gemini analysiert dein Foto & Haltbarkeit...</p>
            </div>
          )}

          {/* HEADER */}
          <header className="bg-white border-b border-stone-200 px-4 py-3.5 sticky top-0 z-20 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <h1 className="text-base font-semibold tracking-tight text-stone-900">Küche & Vorrat</h1>
              <span className={`w-2 h-2 rounded-full ${
                syncStatus === 'synced' ? 'bg-emerald-500' :
                syncStatus === 'syncing' ? 'bg-amber-400' : 'bg-red-500'
              }`} title="Live-Datenbank Status" />
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => document.getElementById('globalCameraInput').click()}
                className="flex items-center justify-center bg-stone-900 text-white w-9 h-9 rounded-lg hover:bg-stone-800 transition shadow-sm"
                title="Foto scannen"
              >
                <Icon name="camera" size={16} />
              </button>
              <button
                onClick={openVoiceAssistantAndStart}
                className="flex items-center gap-1.5 bg-stone-900 text-white px-3 h-9 rounded-lg text-xs font-medium hover:bg-stone-800 transition shadow-sm"
              >
                <Icon name="mic" size={14} />
                <span>Sprache</span>
              </button>
              <button
                onClick={() => setShowSettingsModal(true)}
                className="flex items-center justify-center bg-stone-900 text-white w-9 h-9 rounded-lg hover:bg-stone-800 transition shadow-sm"
                title="Einstellungen"
              >
                <Icon name="settings" size={16} />
              </button>
            </div>
          </header>

          {toastMsg && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-start gap-2 w-[90vw] max-w-sm break-words">
              <Icon name="info" size={15} className="text-emerald-400 mt-0.5" />
              <span className="leading-snug">{toastMsg}</span>
            </div>
          )}

          <main className="flex-1 px-4 pt-4">
            {activeTab === 'home' && (
              <div className="space-y-4">
                {urgentExpiringItems.length > 0 && (
                  <div className="bg-amber-50 border border-amber-300 rounded-2xl p-4 space-y-2.5 shadow-sm">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2 text-amber-950 font-semibold text-xs">
                        <Icon name="flame" size={16} className="text-amber-600" />
                        <span>Frische-Alarm: Bald verbrauchen!</span>
                      </div>
                      <button
                        onClick={() => { setActiveTab('decide'); setCurrentSuggestionIndex(0); }}
                        className="text-[11px] font-semibold bg-amber-900 text-white px-2.5 py-1 rounded-lg"
                      >
                        Passende Rezepte →
                      </button>
                    </div>
                    <div className="space-y-1">
                      {urgentExpiringItems.map(it => {
                        const badge = formatExpiryBadge(it.daysLeft, it.expiryDate);
                        return (
                          <div key={it.id} className="flex items-center justify-between text-xs bg-white/80 px-2.5 py-1.5 rounded-lg border border-amber-200">
                            <span className="font-medium text-stone-900">{it.name} ({it.amount} {it.unitType})</span>
                            <span className={`text-[11px] font-semibold ${badge?.expired ? 'text-red-700' : 'text-amber-800'}`}>
                              {badge?.text}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <div className="bg-stone-900 text-white rounded-2xl p-5 space-y-3 shadow-sm">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-medium uppercase tracking-wider text-stone-400">Was kochen wir heute?</span>
                    <span className="text-xs bg-stone-800 text-stone-300 px-2.5 py-1 rounded-full">{recipes.length} Rezepte</span>
                  </div>
                  <h2 className="text-xl font-semibold">Ab in die Küche!</h2>
                  <p className="text-xs text-stone-300 leading-relaxed">
                    Rezepte mit bald ablaufenden Zutaten (wie frischem Hackfleisch) werden im Würfler automatisch zuerst vorgeschlagen.
                  </p>
                  <button
                    onClick={() => setActiveTab('decide')}
                    className="w-full py-2.5 bg-white text-stone-900 rounded-xl text-xs font-semibold hover:bg-stone-100 transition flex items-center justify-center gap-2"
                  >
                    <Icon name="utensils" size={15} />
                    <span>Rezept-Würfler & Planer starten</span>
                  </button>
                </div>

                <div className="bg-white border border-stone-200 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-semibold uppercase tracking-wider text-stone-500">Kochplan ({mealPlan.length})</h3>
                  </div>
                  {mealPlan.length > 0 ? (
                    <div className="space-y-2">
                      {mealPlan.map(meal => (
                        <div key={meal.id} className="bg-stone-50 border border-stone-200 rounded-xl p-3 flex items-center justify-between">
                          <div onClick={() => { setSelectedRecipeId(meal.id); setActiveTab('recipes'); }} className="cursor-pointer">
                            <h4 className="text-sm font-semibold text-stone-900">{meal.title}</h4>
                            <p className="text-[11px] text-stone-500">{meal.prepTime} Min. · ~{meal.kcalPer100g || 170} kcal/100g</p>
                          </div>
                          <div className="flex items-center gap-1">
                            <button onClick={() => { setCookedModalRecipe(meal); setMealPlan(prev => prev.filter(m => m.id !== meal.id)); }} className="text-emerald-700 hover:bg-emerald-50 p-1.5 rounded">
                              <Icon name="check" size={15} />
                            </button>
                            <button onClick={() => setMealPlan(prev => prev.filter(m => m.id !== meal.id))} className="text-stone-400 hover:text-red-600 p-1.5">
                              <Icon name="trash-2" size={15} />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-stone-400 py-2">Noch keine Gerichte vorgemerkt.</p>
                  )}
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-semibold uppercase tracking-wider text-stone-400 px-1">Vorräte & Bereiche</span>
                  <div className="grid grid-cols-2 gap-2.5">
                    {[
                      { id: 'mealprep', icon: 'snowflake', badge: 'TK Meal', title: 'Gefrierfach (Saucen)', sub: '500g / 250g Blöcke' },
                      { id: 'freezer_items', icon: 'archive', badge: 'TK Vorrat', title: 'TK-Truhe', sub: 'Stück & Gramm' },
                      { id: 'fridge', icon: 'clock', badge: 'MHD', title: 'Kühlschrank', sub: 'Frisch & Haltbarkeit' },

                </div>
                <div className="space-y-3">
                  <select value={newPantryCategory} onChange={e => setNewPantryCategory(e.target.value)} className="w-full border rounded-lg px-2.5 py-2 text-xs bg-white">
                    <option value="pantry">Vorratsschrank</option>
                    <option value="fridge">Kühlschrank (Frisch mit MHD)</option>
                    <option value="freezer_items">Tiefkühler</option>
                    <option value="sauces">Öle & Essige</option>
                    <option value="spices">Gewürze</option>
                  </select>
                  <input type="text" placeholder="Bezeichnung" value={newPantryName} onChange={e => setNewPantryName(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-xs" />
                  {newPantryCategory !== 'spices' && (
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" min="0" value={newPantryAmount} onChange={e => setNewPantryAmount(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-xs font-semibold" />
                      <select value={newPantryUnitType} onChange={e => setNewPantryUnitType(e.target.value)} className="w-full border rounded-lg px-2.5 py-2 text-xs bg-white">
                        <option value="Flasche">Flasche</option>
                        <option value="Stück">Stück</option>
                        <option value="g">g</option>
                        <option value="ml">ml</option>
                        <option value="Packung">Packung</option>
                      </select>
                    </div>
                  )}
                  {newPantryCategory === 'fridge' && (
                    <div className="bg-amber-50 p-3 rounded-xl space-y-2">
                      <label className="text-xs font-semibold block">Haltbar bis (MHD):</label>
                      <input type="date" value={newPantryExpiryDate} onChange={e => setNewPantryExpiryDate(e.target.value)} className="w-full bg-white border rounded-lg px-2 py-1 text-xs font-semibold" />
                    </div>
                  )}
                </div>
                <button onClick={handleAddPantryItem} className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold">Speichern</button>
              </div>
            </div>
          )}

          {showNewRecipeModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-semibold">Neues Rezept</h3>
                  <button onClick={() => setShowNewRecipeModal(false)} className="text-stone-400"><Icon name="x" size={18} /></button>
                </div>
                <input type="text" placeholder="Titel" value={newRecipeTitle} onChange={e => setNewRecipeTitle(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-xs" />
                <button onClick={() => { if (!newRecipeTitle.trim()) return; setRecipes(prev => [...prev, { id: 'r_' + Date.now(), title: newRecipeTitle.trim(), effort: 'quick', season: 'all', kcalPer100g: 180, ingredients: [], steps: [] }]); setShowNewRecipeModal(false); setNewRecipeTitle(''); }} className="w-full py-2.5 bg-stone-900 text-white rounded-xl text-xs font-semibold">Anlegen</button>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 grid grid-cols-5 py-2 z-30">
            {[
              { id: 'home', label: 'Start', icon: 'home' },
              { id: 'decide', label: 'Würfler', icon: 'utensils' },
              { id: 'pantry', label: 'Vorräte', icon: 'archive' },
              { id: 'recipes', label: 'Rezepte', icon: 'book-open' },
              { id: 'shopping', label: `Einkauf (${shoppingList.length})`, icon: 'shopping-cart' }
            ].map(item => (
              <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center gap-1 py-1 text-[11px] font-medium ${activeTab === item.id ? 'text-stone-900' : 'text-stone-400'}`}>
                <Icon name={item.icon} size={18} />
                <span>{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
